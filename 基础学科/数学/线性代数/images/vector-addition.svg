<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <rect width="700" height="350" fill="#f8fafc"/>
  
  <text x="350" y="30" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="bold" font-family="Arial, sans-serif">向量加法：三角形法则与平行四边形法则</text>
  
  <g transform="translate(60, 280)">
    <line x1="0" y1="0" x2="250" y2="0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah-blue)"/>
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah-blue)"/>
    <text x="260" y="5" font-size="14" fill="#64748b" font-family="Arial, sans-serif">x</text>
    <text x="-15" y="-210" font-size="14" fill="#64748b" font-family="Arial, sans-serif">y</text>
    
    <line x1="0" y1="0" x2="120" y2="-90" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)"/>
    <text x="50" y="-60" font-size="16" fill="#2563eb" font-weight="bold" font-family="Arial, sans-serif">a</text>
    
    <line x1="120" y1="-90" x2="220" y2="-170" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
    <text x="175" y="-145" font-size="16" fill="#dc2626" font-weight="bold" font-family="Arial, sans-serif">b</text>
    
    <line x1="0" y1="0" x2="220" y2="-170" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
    <text x="90" y="-100" font-size="16" fill="#16a34a" font-weight="bold" font-family="Arial, sans-serif">a + b</text>
    
    <text x="100" y="30" text-anchor="middle" font-size="14" fill="#475569" font-family="Arial, sans-serif">三角形法则：首尾相接</text>
  </g>
  
  <g transform="translate(400, 280)">
    <line x1="0" y1="0" x2="250" y2="0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah-blue)"/>
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah-blue)"/>
    <text x="260" y="5" font-size="14" fill="#64748b" font-family="Arial, sans-serif">x</text>
    <text x="-15" y="-210" font-size="14" fill="#64748b" font-family="Arial, sans-serif">y</text>
    
    <line x1="0" y1="0" x2="120" y2="-90" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)"/>
    <text x="50" y="-60" font-size="16" fill="#2563eb" font-weight="bold" font-family="Arial, sans-serif">a</text>
    
    <line x1="0" y1="0" x2="100" y2="-80" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
    <text x="35" y="-50" font-size="16" fill="#dc2626" font-weight="bold" font-family="Arial, sans-serif">b</text>
    
    <line x1="120" y1="-90" x2="220" y2="-170" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="100" y1="-80" x2="220" y2="-170" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
    
    <line x1="0" y1="0" x2="220" y2="-170" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
    <text x="90" y="-100" font-size="16" fill="#16a34a" font-weight="bold" font-family="Arial, sans-serif">a + b</text>
    
    <text x="100" y="30" text-anchor="middle" font-size="14" fill="#475569" font-family="Arial, sans-serif">平行四边形法则：共起点</text>
  </g>
  
  <g transform="translate(200, 320)">
    <rect x="-180" y="0" width="360" height="25" rx="5" fill="#e0e7ff" stroke="#818cf8"/>
    <text x="0" y="17" text-anchor="middle" font-size="14" fill="#4338ca" font-family="monospace">a + b = (a₁+b₁, a₂+b₂, ..., aₙ+bₙ)</text>
  </g>
</svg>