<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">线性关系示意图</title>
  <desc id="desc">展示一次函数 y = kx + b 的图像、斜率 k 和截距 b。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px sans-serif; fill: #0f172a; }
      .subtitle { font: 18px sans-serif; fill: #475569; }
      .axis { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .grid { stroke: #dbe3ef; stroke-width: 1; }
      .line { stroke: #2563eb; stroke-width: 5; fill: none; }
      .rise { stroke: #f97316; stroke-width: 3; fill: none; stroke-dasharray: 8 6; }
      .run { stroke: #16a34a; stroke-width: 3; fill: none; stroke-dasharray: 8 6; }
      .point { fill: #ffffff; stroke: #2563eb; stroke-width: 4; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .label { font: 700 20px sans-serif; fill: #0f172a; }
      .text { font: 17px sans-serif; fill: #334155; }
      .formula { font: 700 24px monospace; fill: #1d4ed8; }
      .orange { fill: #f97316; }
      .green { fill: #16a34a; }
    </style>
  </defs>

  <rect class="bg" width="980" height="620"/>
  <text class="title" x="490" y="52" text-anchor="middle">线性关系：一个量按固定比例影响另一个量</text>
  <text class="subtitle" x="490" y="84" text-anchor="middle">标准形式：y = kx + b，其中 k 决定变化速度，b 决定起点位置。</text>

  <g transform="translate(95,115)">
    <line class="grid" x1="0" y1="0" x2="0" y2="390"/>
    <line class="grid" x1="80" y1="0" x2="80" y2="390"/>
    <line class="grid" x1="160" y1="0" x2="160" y2="390"/>
    <line class="grid" x1="240" y1="0" x2="240" y2="390"/>
    <line class="grid" x1="320" y1="0" x2="320" y2="390"/>
    <line class="grid" x1="400" y1="0" x2="400" y2="390"/>
    <line class="grid" x1="480" y1="0" x2="480" y2="390"/>
    <line class="grid" x1="0" y1="0" x2="520" y2="0"/>
    <line class="grid" x1="0" y1="65" x2="520" y2="65"/>
    <line class="grid" x1="0" y1="130" x2="520" y2="130"/>
    <line class="grid" x1="0" y1="195" x2="520" y2="195"/>
    <line class="grid" x1="0" y1="260" x2="520" y2="260"/>
    <line class="grid" x1="0" y1="325" x2="520" y2="325"/>
    <line class="grid" x1="0" y1="390" x2="520" y2="390"/>

    <line class="axis" x1="0" y1="390" x2="545" y2="390"/>
    <line class="axis" x1="0" y1="390" x2="0" y2="-20"/>
    <text class="label" x="555" y="397">x</text>
    <text class="label" x="-7" y="-32">y</text>

    <path class="line" d="M0 310 L500 60"/>
    <circle class="point" cx="120" cy="250" r="7"/>
    <circle class="point" cx="360" cy="130" r="7"/>

    <path class="run" d="M120 250 L360 250"/>
    <path class="rise" d="M360 250 L360 130"/>
    <text class="text green" x="220" y="278">Δx</text>
    <text class="text orange" x="375" y="195">Δy</text>

    <circle class="point" cx="0" cy="310" r="7"/>
    <text class="text" x="15" y="318">截距 b</text>
    <text class="formula" x="175" y="40">y = kx + b</text>
  </g>

  <rect class="card" x="690" y="145" width="230" height="300" rx="18"/>
  <text class="label" x="805" y="185" text-anchor="middle">核心含义</text>
  <text class="text" x="720" y="230">k：斜率</text>
  <text class="text" x="720" y="260">表示 x 每增加 1，</text>
  <text class="text" x="720" y="288">y 平均改变多少。</text>
  <text class="text" x="720" y="340">b：截距</text>
  <text class="text" x="720" y="370">表示 x = 0 时，</text>
  <text class="text" x="720" y="398">y 的初始值。</text>

  <text class="subtitle" x="490" y="570" text-anchor="middle">线性关系的图像是一条直线，变化规律稳定，适合描述“固定比例变化”的问题。</text>
</svg>
