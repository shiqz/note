<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f8fafc"/>
  
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">维度（Dimension）：从数轴到高维空间</text>
  
  <g transform="translate(100, 130)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#arr1)"/>
    <defs><marker id="arr1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#64748b"/></marker></defs>
    <circle cx="30" cy="0" r="6" fill="#ef4444"/>
    <text x="30" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef4444">x = 5</text>
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">1维 (1D)</text>
    <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">数轴：一个数字确定位置</text>
    <text x="0" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">例：温度、价格、分数</text>
  </g>
  
  <g transform="translate(300, 130)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="0" y2="-60" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="40" cy="-30" r="6" fill="#f97316"/>
    <line x1="40" y1="0" x2="40" y2="-30" stroke="#fdba74" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="-30" x2="40" y2="-30" stroke="#fdba74" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="50" y="-25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f97316">(x, y) = (4, 3)</text>
    <text x="0" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">2维 (2D)</text>
    <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">平面：两个数字确定位置</text>
    <text x="0" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">例：坐标、经纬度</text>
  </g>
  
  <g transform="translate(500, 130)">
    <line x1="-50" y1="40" x2="50" y2="-40" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-50" y1="-10" x2="50" y2="10" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="0" y2="-60" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="35" cy="-20" r="6" fill="#8b5cf6"/>
    <text x="45" y="-30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8b5cf6">(x, y, z) = (3, 2, 4)</text>
    <text x="0" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">3维 (3D)</text>
    <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">空间：三个数字确定位置</text>
    <text x="0" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">例：空间坐标、RGB颜色</text>
  </g>
  
  <g transform="translate(700, 130)">
    <rect x="-50" y="-50" width="100" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#d97706">n维</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b45309">(x₁, x₂, ..., xₙ)</text>
    <text x="0" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">n维 (nD)</text>
    <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">高维：n个数字</text>
    <text x="0" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">例：词向量128-4096维</text>
  </g>
  
  <rect x="50" y="280" width="700" height="140" rx="10" fill="#fefce8" stroke="#fde047"/>
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#854d0e">维度的直觉：每增加一维，就多一个"描述角度"</text>
  
  <g transform="translate(80, 335)">
    <text font-family="Arial, sans-serif" font-size="13" fill="#713f12">• 1维 = 1个数描述（温度：25°C）</text>
    <text y="25" font-family="Arial, sans-serif" font-size="13" fill="#713f12">• 3维 = 3个数描述（颜色：R=255, G=128, B=0）</text>
    <text y="50" font-family="Arial, sans-serif" font-size="13" fill="#713f12">• 768维 = 768个数描述（BERT词向量：捕捉语义的768个特征）</text>
  </g>
  
  <g transform="translate(420, 335)">
    <rect x="-10" y="-10" width="320" height="75" rx="6" fill="#fef9c3" stroke="#facc15"/>
    <text x="150" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#854d0e">AI中的典型维度：</text>
    <text x="10" y="34" font-family="Arial, sans-serif" font-size="12" fill="#713f12">• 词向量：128 ~ 4096 维</text>
    <text x="160" y="34" font-family="Arial, sans-serif" font-size="12" fill="#713f12">• 图像特征：512 ~ 2048 维</text>
    <text x="10" y="54" font-family="Arial, sans-serif" font-size="12" fill="#713f12">• LLM隐藏层：4096 ~ 12288 维</text>
  </g>
</svg>