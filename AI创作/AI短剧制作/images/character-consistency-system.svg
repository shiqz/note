<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f7f9fa"/>
  <text x="600" y="56" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#18232d">角色一致性的五层控制</text>
  <text x="600" y="88" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#60707d">一致性不是单个提示词，而是一套从设定到验收的约束系统</text>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="85" y="135" width="1030" height="82" rx="8" fill="#e8f2fb" stroke="#2c73a8" stroke-width="2"/>
    <circle cx="135" cy="176" r="25" fill="#2c73a8"/>
    <text x="135" y="183" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1</text>
    <text x="180" y="169" font-size="22" font-weight="700" fill="#1d5178">文字身份层</text>
    <text x="180" y="196" font-size="15" fill="#486477">固定年龄、脸型、五官、发型、服装和 2～4 个视觉锚点</text>

    <rect x="125" y="229" width="950" height="82" rx="8" fill="#eaf7ef" stroke="#3d8a5c" stroke-width="2"/>
    <circle cx="175" cy="270" r="25" fill="#3d8a5c"/>
    <text x="175" y="277" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2</text>
    <text x="220" y="263" font-size="22" font-weight="700" fill="#296140">视觉参考层</text>
    <text x="220" y="290" font-size="15" fill="#4d6858">三视图、全身图、表情表、服装表与角色比例参考</text>

    <rect x="165" y="323" width="870" height="82" rx="8" fill="#fff5de" stroke="#b8872d" stroke-width="2"/>
    <circle cx="215" cy="364" r="25" fill="#b8872d"/>
    <text x="215" y="371" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3</text>
    <text x="260" y="357" font-size="22" font-weight="700" fill="#755b24">生成约束层</text>
    <text x="260" y="384" font-size="15" fill="#6d6247">复用角色参考、风格后缀、种子或模型能力，控制动作幅度</text>

    <rect x="205" y="417" width="790" height="82" rx="8" fill="#f5edfb" stroke="#7a5b9c" stroke-width="2"/>
    <circle cx="255" cy="458" r="25" fill="#7a5b9c"/>
    <text x="255" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4</text>
    <text x="300" y="451" font-size="22" font-weight="700" fill="#533d6c">连续性记录层</text>
    <text x="300" y="478" font-size="15" fill="#665875">服装、配饰、伤痕、道具、站位、视线、光线逐镜记录</text>

    <rect x="245" y="511" width="710" height="82" rx="8" fill="#fdecef" stroke="#ae4e5d" stroke-width="2"/>
    <circle cx="295" cy="552" r="25" fill="#ae4e5d"/>
    <text x="295" y="559" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">5</text>
    <text x="340" y="545" font-size="22" font-weight="700" fill="#773440">人工验收层</text>
    <text x="340" y="572" font-size="15" fill="#76545a">关键帧先验收，视频再验收，有问题的资产不流入后期</text>

    <path d="M600 217 V229" stroke="#6e7a84" stroke-width="3"/>
    <path d="M600 311 V323" stroke="#6e7a84" stroke-width="3"/>
    <path d="M600 405 V417" stroke="#6e7a84" stroke-width="3"/>
    <path d="M600 499 V511" stroke="#6e7a84" stroke-width="3"/>

    <rect x="325" y="621" width="550" height="38" rx="6" fill="#18232d"/>
    <text x="600" y="646" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">任何一层缺失，角色漂移风险都会显著上升</text>
  </g>
</svg>
