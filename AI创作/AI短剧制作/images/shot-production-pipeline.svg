<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#f8f9fb"/>
  <text x="600" y="56" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#17232e">从分镜到成片的镜头流水线</text>
  <text x="600" y="88" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#60707d">先用低成本材料验证，再逐步投入生成预算</text>

  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="60" y="145" width="185" height="120" rx="8" fill="#e9f3fc" stroke="#2d74aa" stroke-width="2"/>
