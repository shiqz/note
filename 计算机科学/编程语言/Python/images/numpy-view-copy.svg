<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.t{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 18px Arial,sans-serif;fill:#172554}.p{font:15px Arial,sans-serif;fill:#334155}.l{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.box{stroke-width:2}</style></defs>
  <rect width="1200" height="510" fill="#f8fafc"/><text x="600" y="45" class="t" text-anchor="middle">切片通常返回视图，花式索引通常返回副本</text>
  <rect x="70" y="125" width="270" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="205" y="165" class="h" text-anchor="middle">原数组 a</text><rect x="105" y="205" width="200" height="65" rx="5" fill="#fff" stroke="#93c5fd"/><text x="205" y="244" class="p" text-anchor="middle">data buffer: [0, 1, 2, 3, 4, 5]</text><text x="205" y="310" class="p" text-anchor="middle">a.base is None</text>
  <path d="M340 215 H450" class="l"/><text x="395" y="193" class="p" text-anchor="middle">a[1:5]</text>
  <rect x="480" y="125" width="270" height="230" rx="10" fill="#dcfce7" stroke="#16a34a" class="box"/><text x="615" y="165" class="h" text-anchor="middle">视图 view</text><rect x="515" y="205" width="200" height="65" rx="5" fill="#fff" stroke="#86efac"/><text x="615" y="244" class="p" text-anchor="middle">共享 data buffer 的一段</text><text x="615" y="310" class="p" text-anchor="middle">view.base is a</text>
  <path d="M340 310 H865" class="l"/><text x="595" y="292" class="p" text-anchor="middle">a[[1, 3, 5]] 或 a[mask]</text>
  <rect x="895" y="125" width="250" height="230" rx="10" fill="#fef3c7" stroke="#d97706" class="box"/><text x="1020" y="165" class="h" text-anchor="middle">副本 copy</text><rect x="930" y="205" width="180" height="65" rx="5" fill="#fff" stroke="#fcd34d"/><text x="1020" y="244" class="p" text-anchor="middle">新的 data buffer</text><text x="1020" y="310" class="p" text-anchor="middle">copy.base is None</text>
  <rect x="150" y="405" width="900" height="55" rx="7" fill="#fff" stroke="#94a3b8"/><text x="600" y="439" class="p" text-anchor="middle">修改视图会修改原数组；需要隔离时显式调用 .copy()。用 np.shares_memory(a, b) 可验证是否共享内存。</text>
</svg>
