<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.t{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 17px Arial,sans-serif;fill:#172554}.p{font:15px Arial,sans-serif;fill:#334155}.cell{stroke:#64748b;stroke-width:1.5}.l{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="540" fill="#f8fafc"/><text x="600" y="43" class="t" text-anchor="middle">广播：从末尾维度对齐，把长度为 1 的维度逻辑扩展</text>
  <text x="180" y="95" class="h" text-anchor="middle">A，shape = (3, 1)</text>
  <g fill="#dbeafe" class="cell"><rect x="130" y="125" width="100" height="60"/><rect x="130" y="185" width="100" height="60"/><rect x="130" y="245" width="100" height="60"/></g>
  <g class="p" text-anchor="middle"><text x="180" y="162">1</text><text x="180" y="222">2</text><text x="180" y="282">3</text></g>
  <text x="440" y="95" class="h" text-anchor="middle">B，shape = (1, 4)</text>
  <g fill="#fef3c7" class="cell"><rect x="290" y="185" width="75" height="60"/><rect x="365" y="185" width="75" height="60"/><rect x="440" y="185" width="75" height="60"/><rect x="515" y="185" width="75" height="60"/></g>
  <g class="p" text-anchor="middle"><text x="327" y="222">10</text><text x="402" y="222">20</text><text x="477" y="222">30</text><text x="552" y="222">40</text></g>
  <path d="M620 215 H725" class="l"/><text x="672" y="198" class="h" text-anchor="middle">A + B</text>
  <text x="960" y="95" class="h" text-anchor="middle">结果，shape = (3, 4)</text>
  <g fill="#dcfce7" class="cell"><rect x="790" y="125" width="75" height="60"/><rect x="865" y="125" width="75" height="60"/><rect x="940" y="125" width="75" height="60"/><rect x="1015" y="125" width="75" height="60"/><rect x="790" y="185" width="75" height="60"/><rect x="865" y="185" width="75" height="60"/><rect x="940" y="185" width="75" height="60"/><rect x="1015" y="185" width="75" height="60"/><rect x="790" y="245" width="75" height="60"/><rect x="865" y="245" width="75" height="60"/><rect x="940" y="245" width="75" height="60"/><rect x="1015" y="245" width="75" height="60"/></g>
  <g class="p" text-anchor="middle"><text x="827" y="162">11</text><text x="902" y="162">21</text><text x="977" y="162">31</text><text x="1052" y="162">41</text><text x="827" y="222">12</text><text x="902" y="222">22</text><text x="977" y="222">32</text><text x="1052" y="222">42</text><text x="827" y="282">13</text><text x="902" y="282">23</text><text x="977" y="282">33</text><text x="1052" y="282">43</text></g>
  <rect x="130" y="370" width="940" height="105" rx="8" fill="#fff" stroke="#94a3b8"/><text x="160" y="407" class="h">兼容规则：</text><text x="290" y="407" class="p">从右到左比较两个 shape；维度相等或其中一个为 1 时兼容；缺失维度视为 1。</text><text x="160" y="445" class="p">广播通常不复制数据，但计算结果仍可能分配新数组。不能兼容时会抛出 ValueError。</text>
</svg>
