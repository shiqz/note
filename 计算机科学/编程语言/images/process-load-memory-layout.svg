<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}
      .label{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}
      .text{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#40566d}
      .small{font:12px Arial,"Microsoft YaHei",sans-serif;fill:#52687b}
      .file{fill:#f3f9fe;stroke:#4383ad;stroke-width:2}
      .mem{stroke:#6a7f91;stroke-width:1.5}
      .kernel{fill:#fff1df;stroke:#d78b2a;stroke-width:2;rx:12}
      .arrow{stroke:#506b80;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#7a56ae;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#purple)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506b80"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7a56ae"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="title">可执行文件如何成为一个正在运行的进程</text>

  <text x="180" y="90" text-anchor="middle" class="label">磁盘中的可执行文件</text>
  <rect x="65" y="115" width="230" height="75" class="file" fill="#dbeeff"/>
  <text x="180" y="147" text-anchor="middle" class="label">文件头与程序头</text>
  <text x="180" y="172" text-anchor="middle" class="small">架构、入口地址、待映射段</text>
  <rect x="65" y="190" width="230" height="75" class="file" fill="#dff4e5"/>
  <text x="180" y="234" text-anchor="middle" class="label">代码段 .text</text>
  <rect x="65" y="265" width="230" height="75" class="file" fill="#fff0ce"/>
  <text x="180" y="309" text-anchor="middle" class="label">只读数据 .rodata</text>
  <rect x="65" y="340" width="230" height="75" class="file" fill="#ffe0cf"/>
  <text x="180" y="384" text-anchor="middle" class="label">已初始化数据 .data</text>
  <rect x="65" y="415" width="230" height="75" class="file" fill="#eee8fa"/>
  <text x="180" y="447" text-anchor="middle" class="label">符号、重定位、调试信息</text>
  <text x="180" y="472" text-anchor="middle" class="small">部分内容运行时无需映射</text>

  <rect x="410" y="150" width="275" height="330" class="kernel"/>
  <text x="547" y="185" text-anchor="middle" class="label">内核加载器 / 动态链接器</text>
  <text x="440" y="225" class="text">1. 校验格式、架构和权限</text>
  <text x="440" y="260" class="text">2. 创建进程描述符与页表</text>
  <text x="440" y="295" class="text">3. 建立文件到虚拟地址的映射</text>
  <text x="440" y="330" class="text">4. 准备栈、参数和环境变量</text>
  <text x="440" y="365" class="text">5. 加载共享库并修正符号地址</text>
  <text x="440" y="400" class="text">6. 设置程序计数器与栈指针</text>
  <text x="440" y="435" class="text">7. 首次访问时按需调页</text>

  <path d="M295 300 H407" class="arrow"/>

  <text x="965" y="90" text-anchor="middle" class="label">进程虚拟地址空间（概念图）</text>
  <rect x="825" y="115" width="280" height="70" class="mem" fill="#fff1df"/>
  <text x="965" y="145" text-anchor="middle" class="label">内核保留区</text>
  <text x="965" y="169" text-anchor="middle" class="small">用户态通常不可访问</text>
  <rect x="825" y="185" width="280" height="90" class="mem" fill="#e9e2f8"/>
  <text x="965" y="220" text-anchor="middle" class="label">用户栈 ↓</text>
  <text x="965" y="249" text-anchor="middle" class="small">argv、env、局部变量、返回地址</text>
  <rect x="825" y="275" width="280" height="80" class="mem" fill="#f4f7fa"/>
  <text x="965" y="322" text-anchor="middle" class="label">mmap 区 / 共享库</text>
  <rect x="825" y="355" width="280" height="85" class="mem" fill="#dff4e5"/>
  <text x="965" y="390" text-anchor="middle" class="label">堆 ↑</text>
  <text x="965" y="419" text-anchor="middle" class="small">malloc、对象分配、运行时管理</text>
  <rect x="825" y="440" width="280" height="70" class="mem" fill="#ffe0cf"/>
  <text x="965" y="482" text-anchor="middle" class="label">.data / .bss</text>
  <rect x="825" y="510" width="280" height="70" class="mem" fill="#fff0ce"/>
  <text x="965" y="552" text-anchor="middle" class="label">只读数据</text>
  <rect x="825" y="580" width="280" height="70" class="mem" fill="#dbeeff"/>
  <text x="965" y="622" text-anchor="middle" class="label">机器代码</text>

  <path d="M685 265 H822" class="arrow"/>
  <path d="M685 405 H770 V545 H822" class="dash"/>

  <rect x="80" y="575" width="590" height="80" fill="#f8fafc" stroke="#a8b8c5" rx="10"/>
  <text x="375" y="606" text-anchor="middle" class="label">关键事实：映射不等于立即读取</text>
  <text x="375" y="633" text-anchor="middle" class="text">页表先描述“虚拟地址应对应哪个文件区间”；缺页时内核才装入物理页，代码页还可被多个进程共享。</text>
</svg>
