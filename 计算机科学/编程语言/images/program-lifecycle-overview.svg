<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <style>
      .title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}
      .label{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}
      .text{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#40566d}
      .box{fill:#f7fbff;stroke:#4285b4;stroke-width:2;rx:14}
      .os{fill:#fff7e8;stroke:#d99027;stroke-width:2;rx:14}
      .hardware{fill:#f3efff;stroke:#7657b5;stroke-width:2;rx:14}
      .arrow{stroke:#526d82;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#526d82"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">程序从创建到关闭的完整生命周期</text>

  <rect x="45" y="95" width="190" height="110" class="box"/>
  <text x="140" y="127" text-anchor="middle" class="label">1. 创建与编辑</text>
  <text x="140" y="157" text-anchor="middle" class="text">字符输入、编辑器缓冲区</text>
  <text x="140" y="181" text-anchor="middle" class="text">编码为 UTF-8 等字节序列</text>

  <rect x="270" y="95" width="190" height="110" class="os"/>
  <text x="365" y="127" text-anchor="middle" class="label">2. 保存到文件</text>
  <text x="365" y="157" text-anchor="middle" class="text">write 系统调用、页缓存</text>
  <text x="365" y="181" text-anchor="middle" class="text">文件系统、存储设备</text>

  <rect x="495" y="95" width="190" height="110" class="box"/>
  <text x="590" y="127" text-anchor="middle" class="label">3. 翻译与构建</text>
  <text x="590" y="157" text-anchor="middle" class="text">词法、语法、语义、优化</text>
  <text x="590" y="181" text-anchor="middle" class="text">机器码 / 字节码 / IR</text>

  <rect x="720" y="95" width="190" height="110" class="box"/>
  <text x="815" y="127" text-anchor="middle" class="label">4. 链接与封装</text>
  <text x="815" y="157" text-anchor="middle" class="text">符号解析、地址重定位</text>
  <text x="815" y="181" text-anchor="middle" class="text">ELF / PE / Mach-O</text>

  <rect x="945" y="95" width="190" height="110" class="os"/>
  <text x="1040" y="127" text-anchor="middle" class="label">5. 创建进程</text>
  <text x="1040" y="157" text-anchor="middle" class="text">Shell / GUI 请求内核</text>
  <text x="1040" y="181" text-anchor="middle" class="text">建立进程与地址空间</text>

  <path d="M235 150 H267" class="arrow"/>
  <path d="M460 150 H492" class="arrow"/>
  <path d="M685 150 H717" class="arrow"/>
  <path d="M910 150 H942" class="arrow"/>

  <rect x="945" y="300" width="190" height="110" class="os"/>
  <text x="1040" y="332" text-anchor="middle" class="label">6. 装载与初始化</text>
  <text x="1040" y="362" text-anchor="middle" class="text">映射代码、数据、动态库</text>
  <text x="1040" y="386" text-anchor="middle" class="text">运行时初始化后进入入口</text>

  <rect x="720" y="300" width="190" height="110" class="hardware"/>
  <text x="815" y="332" text-anchor="middle" class="label">7. CPU 执行</text>
  <text x="815" y="362" text-anchor="middle" class="text">取指、译码、执行、访存</text>
  <text x="815" y="386" text-anchor="middle" class="text">流水线、缓存、分支预测</text>

  <rect x="495" y="300" width="190" height="110" class="os"/>
  <text x="590" y="332" text-anchor="middle" class="label">8. 与内核交互</text>
  <text x="590" y="362" text-anchor="middle" class="text">文件、网络、内存、时间</text>
  <text x="590" y="386" text-anchor="middle" class="text">系统调用、异常和中断</text>

  <rect x="270" y="300" width="190" height="110" class="box"/>
  <text x="365" y="332" text-anchor="middle" class="label">9. 语言运行时</text>
  <text x="365" y="362" text-anchor="middle" class="text">堆、栈、GC、线程调度</text>
  <text x="365" y="386" text-anchor="middle" class="text">异常、JIT、协程等</text>

  <rect x="45" y="300" width="190" height="110" class="os"/>
  <text x="140" y="332" text-anchor="middle" class="label">10. 退出与回收</text>
  <text x="140" y="362" text-anchor="middle" class="text">返回码、清理用户态资源</text>
  <text x="140" y="386" text-anchor="middle" class="text">内核撤销进程全部资源</text>

  <path d="M1040 205 V297" class="arrow"/>
  <path d="M945 355 H913" class="arrow"/>
  <path d="M720 355 H688" class="arrow"/>
  <path d="M495 355 H463" class="arrow"/>
  <path d="M270 355 H238" class="arrow"/>

  <rect x="45" y="490" width="1090" height="100" fill="#f8fafc" stroke="#aebdca" rx="12"/>
  <text x="80" y="522" class="label">贯穿全程的四层边界</text>
  <circle cx="310" cy="555" r="8" fill="#4285b4"/><text x="328" y="561" class="text">语言与工具链</text>
  <circle cx="510" cy="555" r="8" fill="#4d9a69"/><text x="528" y="561" class="text">语言运行时与库</text>
  <circle cx="735" cy="555" r="8" fill="#d99027"/><text x="753" y="561" class="text">操作系统内核</text>
  <circle cx="925" cy="555" r="8" fill="#7657b5"/><text x="943" y="561" class="text">CPU 与硬件</text>
</svg>
