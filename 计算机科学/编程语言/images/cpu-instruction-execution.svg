<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>
      .title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}
      .label{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}
      .text{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#40566d}
      .stage{fill:#eef7fd;stroke:#3e81ad;stroke-width:2;rx:12}
      .unit{fill:#fff4e4;stroke:#d68a29;stroke-width:2;rx:12}
      .memory{fill:#f1edfb;stroke:#7353aa;stroke-width:2;rx:12}
      .arrow{stroke:#506b80;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .feedback{stroke:#b35b4b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#red)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506b80"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b35b4b"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="title">一条机器指令在现代 CPU 中如何流动</text>

  <rect x="45" y="105" width="155" height="105" class="stage"/>
  <text x="122" y="138" text-anchor="middle" class="label">取指 Fetch</text>
  <text x="122" y="168" text-anchor="middle" class="text">依据 PC 取指令字节</text>
  <text x="122" y="191" text-anchor="middle" class="text">L1I / 指令 TLB</text>

  <rect x="230" y="105" width="155" height="105" class="stage"/>
  <text x="307" y="138" text-anchor="middle" class="label">译码 Decode</text>
  <text x="307" y="168" text-anchor="middle" class="text">识别操作码与操作数</text>
  <text x="307" y="191" text-anchor="middle" class="text">拆分为微操作</text>

  <rect x="415" y="105" width="155" height="105" class="stage"/>
  <text x="492" y="138" text-anchor="middle" class="label">重命名 Rename</text>
  <text x="492" y="168" text-anchor="middle" class="text">逻辑寄存器映射</text>
  <text x="492" y="191" text-anchor="middle" class="text">消除伪数据依赖</text>

  <rect x="600" y="105" width="155" height="105" class="stage"/>
  <text x="677" y="138" text-anchor="middle" class="label">调度 Dispatch</text>
  <text x="677" y="168" text-anchor="middle" class="text">等待操作数就绪</text>
  <text x="677" y="191" text-anchor="middle" class="text">乱序选择可执行项</text>

  <rect x="785" y="105" width="155" height="105" class="stage"/>
  <text x="862" y="138" text-anchor="middle" class="label">执行 Execute</text>
  <text x="862" y="168" text-anchor="middle" class="text">ALU / FPU / SIMD</text>
  <text x="862" y="191" text-anchor="middle" class="text">Load / Store 单元</text>

  <rect x="970" y="105" width="185" height="105" class="stage"/>
  <text x="1062" y="138" text-anchor="middle" class="label">提交 Retire</text>
  <text x="1062" y="168" text-anchor="middle" class="text">按程序顺序提交结果</text>
  <text x="1062" y="191" text-anchor="middle" class="text">形成精确异常状态</text>

  <path d="M200 157 H227" class="arrow"/><path d="M385 157 H412" class="arrow"/>
  <path d="M570 157 H597" class="arrow"/><path d="M755 157 H782" class="arrow"/>
  <path d="M940 157 H967" class="arrow"/>

  <rect x="45" y="315" width="250" height="120" class="unit"/>
  <text x="170" y="350" text-anchor="middle" class="label">分支预测器</text>
  <text x="170" y="380" text-anchor="middle" class="text">预测下一条 PC，保持流水线充满</text>
  <text x="170" y="406" text-anchor="middle" class="text">预测错误会清空错误路径并回滚</text>

  <rect x="355" y="315" width="250" height="120" class="unit"/>
  <text x="480" y="350" text-anchor="middle" class="label">寄存器与执行单元</text>
  <text x="480" y="380" text-anchor="middle" class="text">寄存器保存最靠近 CPU 的数据</text>
  <text x="480" y="406" text-anchor="middle" class="text">多个端口可并行执行微操作</text>

  <rect x="665" y="315" width="250" height="120" class="memory"/>
  <text x="790" y="350" text-anchor="middle" class="label">缓存层次</text>
  <text x="790" y="380" text-anchor="middle" class="text">L1 → L2 → L3 → 内存</text>
  <text x="790" y="406" text-anchor="middle" class="text">缓存未命中可带来数十至数百周期</text>

  <rect x="975" y="315" width="180" height="120" class="memory"/>
  <text x="1065" y="350" text-anchor="middle" class="label">MMU / TLB</text>
  <text x="1065" y="380" text-anchor="middle" class="text">虚拟地址翻译</text>
  <text x="1065" y="406" text-anchor="middle" class="text">检查页级访问权限</text>

  <path d="M170 315 V250 H122 V213" class="feedback"/>
  <path d="M480 315 V250 H862 V213" class="arrow"/>
  <path d="M790 315 V250 H862 V213" class="arrow"/>
  <path d="M1065 315 V250 H900 V213" class="arrow"/>

  <rect x="85" y="525" width="1030" height="105" fill="#f8fafc" stroke="#a9b8c4" rx="12"/>
  <text x="600" y="558" text-anchor="middle" class="label">“CPU 一条条执行代码”只是架构层视角</text>
  <text x="600" y="588" text-anchor="middle" class="text">软件观察到的效果近似按指令集规则发生；内部则通过流水线、推测执行、乱序执行和多级缓存重叠大量工作。</text>
  <text x="600" y="613" text-anchor="middle" class="text">遇到缺页、非法指令、除零或系统调用时，CPU 保存现场并转入内核异常处理入口。</text>
</svg>
