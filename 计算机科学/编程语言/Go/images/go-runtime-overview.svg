<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#183153" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#46637f"/>
    </marker>
    <style>
      .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#17324d}
      .sub{font:400 15px "Microsoft YaHei",sans-serif;fill:#577086}
      .head{font:700 20px "Microsoft YaHei",sans-serif;fill:#fff}
      .label{font:700 17px "Microsoft YaHei",sans-serif;fill:#17324d}
      .text{font:400 14px "Microsoft YaHei",sans-serif;fill:#425d72}
      .small{font:400 13px "Microsoft YaHei",sans-serif;fill:#577086}
      .line{stroke:#46637f;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" class="title">Go 程序从源码到运行时</text>
  <text x="600" y="76" text-anchor="middle" class="sub">编译器、调度器、内存管理和操作系统共同决定程序行为</text>

  <g filter="url(#shadow)">
    <rect x="55" y="120" width="210" height="150" rx="16" fill="#fff"/>
    <rect x="55" y="120" width="210" height="42" rx="16" fill="#2878b5"/>
    <rect x="55" y="146" width="210" height="16" fill="#2878b5"/>
    <text x="160" y="148" text-anchor="middle" class="head">源代码</text>
    <text x="78" y="192" class="label">包与函数</text>
    <text x="78" y="221" class="text">AST · 类型检查 · SSA</text>
    <text x="78" y="247" class="small">逃逸与内联从这里开始</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="120" width="210" height="150" rx="16" fill="#fff"/>
    <rect x="355" y="120" width="210" height="42" rx="16" fill="#536dfe"/>
    <rect x="355" y="146" width="210" height="16" fill="#536dfe"/>
    <text x="460" y="148" text-anchor="middle" class="head">机器码</text>
    <text x="378" y="192" class="label">静态链接</text>
    <text x="378" y="221" class="text">业务代码 + runtime</text>
    <text x="378" y="247" class="small">通常无需外部语言运行时</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="655" y="120" width="210" height="150" rx="16" fill="#fff"/>
    <rect x="655" y="120" width="210" height="42" rx="16" fill="#00897b"/>
    <rect x="655" y="146" width="210" height="16" fill="#00897b"/>
    <text x="760" y="148" text-anchor="middle" class="head">Go Runtime</text>
    <text x="678" y="192" class="label">调度与内存</text>
    <text x="678" y="221" class="text">GMP · GC · netpoll</text>
    <text x="678" y="247" class="small">随程序一同编译和链接</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="955" y="120" width="190" height="150" rx="16" fill="#fff"/>
    <rect x="955" y="120" width="190" height="42" rx="16" fill="#ef6c00"/>
    <rect x="955" y="146" width="190" height="16" fill="#ef6c00"/>
    <text x="1050" y="148" text-anchor="middle" class="head">操作系统</text>
    <text x="978" y="192" class="label">线程与系统调用</text>
    <text x="978" y="221" class="text">CPU · 虚拟内存 · I/O</text>
    <text x="978" y="247" class="small">最终资源边界</text>
  </g>

  <path d="M265 195 H345" class="line"/>
  <path d="M565 195 H645" class="line"/>
  <path d="M865 195 H945" class="line"/>

  <g filter="url(#shadow)">
    <rect x="85" y="345" width="1030" height="285" rx="20" fill="#fff"/>
    <text x="115" y="385" class="label">GMP 调度模型</text>
    <text x="115" y="412" class="small">P 持有运行 Go 代码所需的调度资源；M 必须绑定 P 才能执行 G</text>

    <rect x="130" y="460" width="160" height="105" rx="14" fill="#e8f1fb" stroke="#2878b5" stroke-width="2"/>
    <text x="210" y="493" text-anchor="middle" class="label">G</text>
    <text x="210" y="521" text-anchor="middle" class="text">Goroutine</text>
    <text x="210" y="546" text-anchor="middle" class="small">栈 + 执行状态</text>

    <rect x="390" y="460" width="160" height="105" rx="14" fill="#eceffe" stroke="#536dfe" stroke-width="2"/>
    <text x="470" y="493" text-anchor="middle" class="label">P</text>
    <text x="470" y="521" text-anchor="middle" class="text">Processor</text>
    <text x="470" y="546" text-anchor="middle" class="small">本地队列 + 缓存</text>

    <rect x="650" y="460" width="160" height="105" rx="14" fill="#e5f5f2" stroke="#00897b" stroke-width="2"/>
    <text x="730" y="493" text-anchor="middle" class="label">M</text>
    <text x="730" y="521" text-anchor="middle" class="text">Machine</text>
    <text x="730" y="546" text-anchor="middle" class="small">操作系统线程</text>

    <rect x="910" y="460" width="160" height="105" rx="14" fill="#fff1e6" stroke="#ef6c00" stroke-width="2"/>
    <text x="990" y="493" text-anchor="middle" class="label">CPU</text>
    <text x="990" y="521" text-anchor="middle" class="text">执行机器指令</text>
    <text x="990" y="546" text-anchor="middle" class="small">受配额与调度约束</text>

    <path d="M290 512 H380" class="line"/>
    <path d="M550 512 H640" class="line"/>
    <path d="M810 512 H900" class="line"/>
    <text x="335" y="497" text-anchor="middle" class="small">调度</text>
    <text x="595" y="497" text-anchor="middle" class="small">绑定</text>
    <text x="855" y="497" text-anchor="middle" class="small">运行</text>
  </g>
  <text x="600" y="680" text-anchor="middle" class="small">理解边界：goroutine 不是线程，P 也不是 CPU 核</text>
</svg>
