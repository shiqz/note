<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f4f8f2"/>
    </linearGradient>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#397b89"/>
    </marker>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#193b44" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg2)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#193b44">Go 运行时性能心智模型</text>
  <text x="600" y="80" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#56727a">请求从 goroutine 调度进入计算，分配行为又决定 GC 成本与尾延迟</text>

  <g filter="url(#s2)" font-family="Microsoft YaHei, sans-serif">
    <rect x="60" y="120" width="250" height="180" rx="18" fill="#fff" stroke="#6ab8c4" stroke-width="2"/>
    <text x="185" y="158" text-anchor="middle" font-size="21" font-weight="700" fill="#1e6977">G：goroutine</text>
    <rect x="88" y="180" width="75" height="40" rx="20" fill="#d9f1f4"/>
    <rect x="176" y="180" width="75" height="40" rx="20" fill="#d9f1f4"/>
    <rect x="88" y="234" width="75" height="40" rx="20" fill="#d9f1f4"/>
    <rect x="176" y="234" width="75" height="40" rx="20" fill="#d9f1f4"/>
    <text x="125" y="206" text-anchor="middle" font-size="15" fill="#193b44">G1</text>
    <text x="213" y="206" text-anchor="middle" font-size="15" fill="#193b44">G2</text>
    <text x="125" y="260" text-anchor="middle" font-size="15" fill="#193b44">G3</text>
    <text x="213" y="260" text-anchor="middle" font-size="15" fill="#193b44">G...</text>

    <rect x="470" y="112" width="260" height="196" rx="18" fill="#fff" stroke="#6ab8c4" stroke-width="2"/>
    <text x="600" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#1e6977">P：逻辑处理器</text>
    <rect x="500" y="174" width="90" height="98" rx="12" fill="#e8f5ea" stroke="#84b98a"/>
    <rect x="610" y="174" width="90" height="98" rx="12" fill="#e8f5ea" stroke="#84b98a"/>
    <text x="545" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#386e40">P0</text>
    <text x="655" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#386e40">P1</text>
    <text x="545" y="238" text-anchor="middle" font-size="14" fill="#4c6951">本地队列</text>
    <text x="655" y="238" text-anchor="middle" font-size="14" fill="#4c6951">本地队列</text>
    <text x="600" y="291" text-anchor="middle" font-size="14" fill="#56727a">数量通常由 GOMAXPROCS 决定</text>

    <rect x="890" y="120" width="250" height="180" rx="18" fill="#fff" stroke="#6ab8c4" stroke-width="2"/>
    <text x="1015" y="158" text-anchor="middle" font-size="21" font-weight="700" fill="#1e6977">M：操作系统线程</text>
    <rect x="925" y="184" width="180" height="42" rx="10" fill="#f6e9d9" stroke="#d6a96f"/>
    <rect x="925" y="240" width="180" height="42" rx="10" fill="#f6e9d9" stroke="#d6a96f"/>
    <text x="1015" y="211" text-anchor="middle" font-size="15" fill="#765027">M0：执行 Go 代码</text>
    <text x="1015" y="267" text-anchor="middle" font-size="15" fill="#765027">M1：系统调用/计算</text>
  </g>

  <g fill="none" stroke="#397b89" stroke-width="4" marker-end="url(#a2)">
    <path d="M310 210 L458 210"/>
    <path d="M730 210 L878 210"/>
  </g>
  <text x="385" y="194" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#397b89">入队 / 窃取</text>
  <text x="805" y="194" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#397b89">绑定执行</text>

  <g filter="url(#s2)" font-family="Microsoft YaHei, sans-serif">
    <rect x="115" y="400" width="290" height="180" rx="18" fill="#fff" stroke="#9d86c8" stroke-width="2"/>
    <text x="260" y="438" text-anchor="middle" font-size="21" font-weight="700" fill="#674e96">分配路径</text>
    <text x="145" y="477" font-size="15" fill="#554a69">栈：生命周期明确，成本低</text>
    <text x="145" y="510" font-size="15" fill="#554a69">堆：逃逸对象，增加扫描压力</text>
    <text x="145" y="543" font-size="15" fill="#554a69">热点：临时对象、切片扩容、装箱</text>

    <rect x="455" y="400" width="290" height="180" rx="18" fill="#fff" stroke="#d18b8b" stroke-width="2"/>
    <text x="600" y="438" text-anchor="middle" font-size="21" font-weight="700" fill="#984d4d">垃圾回收</text>
    <text x="485" y="477" font-size="15" fill="#714c4c">并发标记：消耗 CPU</text>
    <text x="485" y="510" font-size="15" fill="#714c4c">写屏障：维护对象图正确性</text>
    <text x="485" y="543" font-size="15" fill="#714c4c">STW：短暂停顿影响尾延迟</text>

    <rect x="795" y="400" width="290" height="180" rx="18" fill="#fff" stroke="#d2ad61" stroke-width="2"/>
    <text x="940" y="438" text-anchor="middle" font-size="21" font-weight="700" fill="#89651e">外部表现</text>
    <text x="825" y="477" font-size="15" fill="#6f5c35">吞吐下降、CPU 升高</text>
    <text x="825" y="510" font-size="15" fill="#6f5c35">内存峰值与 RSS 增长</text>
    <text x="825" y="543" font-size="15" fill="#6f5c35">P95/P99 延迟抖动</text>
  </g>

  <g fill="none" stroke="#397b89" stroke-width="4" marker-end="url(#a2)">
    <path d="M405 490 L443 490"/>
    <path d="M745 490 L783 490"/>
    <path d="M600 308 L600 388"/>
  </g>
  <text x="424" y="477" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#397b89">触发</text>
  <text x="764" y="477" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#397b89">反映为</text>
  <text x="618" y="354" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#397b89">业务代码产生对象</text>
</svg>
