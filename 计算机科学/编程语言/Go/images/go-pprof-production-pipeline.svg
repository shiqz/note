<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>.t{font:700 28px Arial,"Microsoft YaHei";fill:#17324d}.h{font:700 18px Arial,"Microsoft YaHei";fill:#17324d}.x{font:15px Arial,"Microsoft YaHei";fill:#3f5c73}.b{fill:#f7fbff;stroke:#4b88b6;stroke-width:2;rx:12}.g{fill:#effaf4;stroke:#4d9b70;stroke-width:2;rx:12}.r{fill:#fff2ef;stroke:#d96657;stroke-width:2;rx:12}.l{stroke:#7895aa;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7895aa"/></marker></defs>
  <text x="600" y="42" text-anchor="middle" class="t">生产环境 pprof 安全采集链路</text>
  <rect x="45" y="105" width="215" height="120" class="b"/><text x="152" y="142" text-anchor="middle" class="h">告警与业务指标</text><text x="152" y="174" text-anchor="middle" class="x">CPU、RSS、GC、P99</text><text x="152" y="199" text-anchor="middle" class="x">确定异常实例和窗口</text>
  <rect x="335" y="105" width="235" height="120" class="g"/><text x="452" y="142" text-anchor="middle" class="h">受控诊断入口</text><text x="452" y="174" text-anchor="middle" class="x">仅监听 localhost / Pod</text><text x="452" y="199" text-anchor="middle" class="x">网络策略 + 身份认证</text>
  <rect x="645" y="105" width="235" height="120" class="b"/><text x="762" y="142" text-anchor="middle" class="h">按需采集单一 Profile</text><text x="762" y="174" text-anchor="middle" class="x">限时、限并发、留审计</text><text x="762" y="199" text-anchor="middle" class="x">保存实例与构建元数据</text>
  <rect x="955" y="105" width="200" height="120" class="b"/><text x="1055" y="142" text-anchor="middle" class="h">离线分析与归档</text><text x="1055" y="174" text-anchor="middle" class="x">profile + binary</text><text x="1055" y="199" text-anchor="middle" class="x">版本化、加密、限期保留</text>
  <path d="M260 165 H335 M570 165 H645 M880 165 H955" class="l"/>
  <rect x="100" y="330" width="280" height="125" class="r"/><text x="240" y="367" text-anchor="middle" class="h">禁止公网直接暴露</text><text x="240" y="399" text-anchor="middle" class="x">cmdline、栈和符号可能泄露信息</text><text x="240" y="427" text-anchor="middle" class="x">CPU/trace 还会消耗服务资源</text>
  <rect x="460" y="330" width="280" height="125" class="g"/><text x="600" y="367" text-anchor="middle" class="h">Kubernetes 推荐路径</text><text x="600" y="399" text-anchor="middle" class="x">kubectl port-forward → localhost</text><text x="600" y="427" text-anchor="middle" class="x">不创建公网 Service / Ingress</text>
  <rect x="820" y="330" width="280" height="125" class="b"/><text x="960" y="367" text-anchor="middle" class="h">变更后必须复测</text><text x="960" y="399" text-anchor="middle" class="x">同负载、同窗口、同版本比较</text><text x="960" y="427" text-anchor="middle" class="x">同时验证吞吐、尾延迟与错误率</text>
  <path d="M452 225 C452 280 240 280 240 330 M762 225 C762 280 600 280 600 330 M1055 225 C1055 280 960 280 960 330" class="l"/>
  <text x="600" y="535" text-anchor="middle" class="x">采集权限应视同读取进程内部状态的高权限操作，并设置超时、并发锁、速率限制和审计记录</text>
</svg>
