<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#0f172a">虚拟地址如何找到物理内存</text>
  <g font-family="Microsoft YaHei">
    <rect x="55" y="145" width="190" height="120" rx="16" fill="#4f46e5"/>
    <text x="150" y="190" text-anchor="middle" font-size="23" font-weight="700" fill="white">CPU</text>
    <text x="150" y="225" text-anchor="middle" font-size="16" fill="#e0e7ff">发出虚拟地址 VA</text>
    <rect x="315" y="145" width="190" height="120" rx="16" fill="#2563eb"/>
    <text x="410" y="190" text-anchor="middle" font-size="23" font-weight="700" fill="white">TLB</text>
    <text x="410" y="225" text-anchor="middle" font-size="16" fill="#dbeafe">缓存近期地址映射</text>
    <rect x="575" y="145" width="190" height="120" rx="16" fill="#0891b2"/>
    <text x="670" y="190" text-anchor="middle" font-size="23" font-weight="700" fill="white">页表遍历</text>
    <text x="670" y="225" text-anchor="middle" font-size="16" fill="#cffafe">查找虚拟页对应页框</text>
    <rect x="835" y="145" width="310" height="120" rx="16" fill="#059669"/>
    <text x="990" y="190" text-anchor="middle" font-size="23" font-weight="700" fill="white">Cache / 物理内存</text>
    <text x="990" y="225" text-anchor="middle" font-size="16" fill="#d1fae5">使用物理地址 PA 访问数据</text>
    <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)">
      <path d="M245 205H308"/><path d="M505 205H568"/><path d="M765 205H828"/>
      <path d="M410 270V335H990V272"/>
    </g>
    <text x="680" y="325" text-anchor="middle" font-size="15" fill="#1d4ed8">TLB 命中：跳过页表遍历</text>
    <rect x="245" y="400" width="710" height="140" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="440" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">页表项还保存权限和状态</text>
    <text x="600" y="477" text-anchor="middle" font-size="17" fill="#475569">是否存在、是否可写、能否执行、用户态能否访问、是否被修改……</text>
    <text x="600" y="510" text-anchor="middle" font-size="17" fill="#b91c1c">映射不存在或权限不允许 → 触发页故障/访问异常 → 操作系统处理</text>
  </g>
</svg>
