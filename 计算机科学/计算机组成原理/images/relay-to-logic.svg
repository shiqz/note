<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#475569"/></marker></defs>
  <rect width="1100" height="600" rx="24" fill="#f8fafc"/>
  <text x="550" y="50" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#0f172a">继电器：用一个开关控制另一个开关</text>
  <g font-family="Microsoft YaHei">
    <rect x="60" y="125" width="270" height="180" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text x="195" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#3730a3">输入电路</text>
    <line x1="100" y1="220" x2="155" y2="220" stroke="#334155" stroke-width="4"/>
    <circle cx="165" cy="220" r="9" fill="#fff" stroke="#334155" stroke-width="4"/>
    <circle cx="240" cy="220" r="9" fill="#fff" stroke="#334155" stroke-width="4"/>
    <line x1="173" y1="216" x2="225" y2="190" stroke="#334155" stroke-width="4"/>
    <text x="195" y="270" text-anchor="middle" font-size="16" fill="#475569">开关闭合 → 线圈通电</text>
    <rect x="415" y="125" width="270" height="180" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="550" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#155e75">电磁继电器</text>
    <path d="M470 220q12-32 24 0t24 0t24 0t24 0" fill="none" stroke="#0891b2" stroke-width="5"/>
    <line x1="595" y1="220" x2="650" y2="190" stroke="#334155" stroke-width="4"/>
    <text x="550" y="270" text-anchor="middle" font-size="16" fill="#475569">电流产生磁力，改变触点</text>
    <rect x="770" y="125" width="270" height="180" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="905" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#065f46">输出电路</text>
    <circle cx="865" cy="220" r="30" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    <path d="M865 175v-18M865 283v-18M820 220h-18M928 220h-18" stroke="#ca8a04" stroke-width="4"/>
    <text x="905" y="270" text-anchor="middle" font-size="16" fill="#475569">触点闭合 → 灯亮</text>
    <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
      <path d="M330 215H404"/><path d="M685 215H759"/>
    </g>
    <rect x="105" y="385" width="890" height="140" rx="18" fill="white" stroke="#cbd5e1" stroke-width="2"/>
    <text x="550" y="425" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">把继电器按不同方式连接，就能得到逻辑门</text>
    <text x="270" y="472" text-anchor="middle" font-size="18" fill="#4338ca">串联：全部闭合才导通 → AND</text>
    <text x="550" y="472" text-anchor="middle" font-size="18" fill="#0369a1">并联：任一闭合就导通 → OR</text>
    <text x="830" y="472" text-anchor="middle" font-size="18" fill="#047857">常闭触点：输入反转 → NOT</text>
    <text x="550" y="505" text-anchor="middle" font-size="16" fill="#64748b">晶体管后来替代了继电器，但“用开关实现逻辑”的思想没有改变</text>
  </g>
</svg>
