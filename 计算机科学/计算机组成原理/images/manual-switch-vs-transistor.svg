<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font:700 20px "Microsoft YaHei",sans-serif;fill:#fff}
      .t{font:15px "Microsoft YaHei",sans-serif;fill:#334155}
      .s{font:13px "Microsoft YaHei",sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1100" height="570" rx="24" fill="#f8fafc"/>
  <text x="550" y="48" text-anchor="middle" class="title">普通开关和晶体管开关</text>
  <text x="550" y="76" text-anchor="middle" class="s">相同点：都能控制通路；不同点：一个靠手推动，一个靠电压和电场控制</text>

  <g transform="translate(65,120)">
    <rect width="440" height="330" rx="20" fill="#2563eb"/>
    <text x="220" y="38" text-anchor="middle" class="h">普通机械开关</text>
    <rect x="25" y="65" width="390" height="190" rx="14" fill="#eff6ff"/>
    <circle cx="75" cy="160" r="22" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
    <path d="M75 138v-22M58 186h34" stroke="#ca8a04" stroke-width="4"/>
    <line x1="98" y1="160" x2="190" y2="160" stroke="#1d4ed8" stroke-width="5"/>
    <circle cx="200" cy="160" r="7" fill="#1d4ed8"/>
    <circle cx="305" cy="160" r="7" fill="#1d4ed8"/>
    <line x1="200" y1="160" x2="285" y2="105" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <line x1="305" y1="160" x2="360" y2="160" stroke="#1d4ed8" stroke-width="5"/>
    <rect x="360" y="135" width="32" height="50" rx="4" fill="#94a3b8"/>
    <text x="252" y="222" text-anchor="middle" class="t">手推动触点，接通或断开</text>
    <text x="220" y="286" text-anchor="middle" class="h" font-size="16">看得见、摸得到、速度较慢</text>
    <text x="220" y="311" text-anchor="middle" class="h" font-size="15">有机械部件移动</text>
  </g>

  <g transform="translate(595,120)">
    <rect width="440" height="330" rx="20" fill="#0f766e"/>
    <text x="220" y="38" text-anchor="middle" class="h">MOSFET 晶体管</text>
    <rect x="25" y="65" width="390" height="190" rx="14" fill="#f0fdfa"/>
    <rect x="92" y="162" width="256" height="35" rx="7" fill="#5eead4"/>
    <rect x="92" y="137" width="70" height="60" fill="#0d9488"/>
    <rect x="278" y="137" width="70" height="60" fill="#0d9488"/>
    <rect x="185" y="91" width="70" height="24" rx="5" fill="#14b8a6"/>
    <rect x="182" y="117" width="76" height="14" fill="#fef3c7"/>
    <text x="220" y="85" text-anchor="middle" class="t">栅极 G</text>
    <text x="127" y="224" text-anchor="middle" class="t">源极 S</text>
    <text x="313" y="224" text-anchor="middle" class="t">漏极 D</text>
    <path d="M220 53v30" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"/>
    <text x="220" y="248" text-anchor="middle" class="t">栅极电场控制导电沟道</text>
    <text x="220" y="286" text-anchor="middle" class="h" font-size="16">极小、极快、没有宏观机械运动</text>
    <text x="220" y="311" text-anchor="middle" class="h" font-size="15">可以大量制造在同一芯片上</text>
  </g>

  <rect x="175" y="490" width="750" height="48" rx="12" fill="#fee2e2"/>
  <text x="550" y="520" text-anchor="middle" class="t">注意：晶体管里的“开关”和“水龙头”都是帮助理解的类比，并不存在一扇真正的小门</text>
</svg>
