<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#475569"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#0f172a">一条指令经过的简化数据通路</text>
  <text x="600" y="82" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" fill="#64748b">以经典五阶段模型理解；真实处理器可拆分、合并或并行执行这些步骤</text>
  <g font-family="Microsoft YaHei" filter="url(#s)">
    <rect x="55" y="160" width="170" height="110" rx="16" fill="#4f46e5"/>
    <text x="140" y="204" text-anchor="middle" font-size="24" font-weight="700" fill="white">取指 IF</text>
    <text x="140" y="237" text-anchor="middle" font-size="15" fill="#e0e7ff">PC → 指令缓存</text>
    <rect x="285" y="160" width="170" height="110" rx="16" fill="#2563eb"/>
    <text x="370" y="204" text-anchor="middle" font-size="24" font-weight="700" fill="white">译码 ID</text>
    <text x="370" y="237" text-anchor="middle" font-size="15" fill="#dbeafe">解析并读取寄存器</text>
    <rect x="515" y="160" width="170" height="110" rx="16" fill="#0891b2"/>
    <text x="600" y="204" text-anchor="middle" font-size="24" font-weight="700" fill="white">执行 EX</text>
    <text x="600" y="237" text-anchor="middle" font-size="15" fill="#cffafe">ALU 运算或算地址</text>
    <rect x="745" y="160" width="170" height="110" rx="16" fill="#059669"/>
    <text x="830" y="204" text-anchor="middle" font-size="24" font-weight="700" fill="white">访存 MEM</text>
    <text x="830" y="237" text-anchor="middle" font-size="15" fill="#d1fae5">访问数据缓存</text>
    <rect x="975" y="160" width="170" height="110" rx="16" fill="#ca8a04"/>
    <text x="1060" y="204" text-anchor="middle" font-size="24" font-weight="700" fill="white">写回 WB</text>
    <text x="1060" y="237" text-anchor="middle" font-size="15" fill="#fef3c7">结果写入寄存器</text>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M225 215H278"/><path d="M455 215H508"/><path d="M685 215H738"/><path d="M915 215H968"/>
  </g>
  <g font-family="Microsoft YaHei">
    <rect x="285" y="370" width="630" height="170" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="408" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">贯穿数据通路的关键部件</text>
    <rect x="320" y="438" width="150" height="62" rx="10" fill="#eef2ff"/>
    <text x="395" y="477" text-anchor="middle" font-size="18" fill="#3730a3">PC / 控制逻辑</text>
    <rect x="525" y="438" width="150" height="62" rx="10" fill="#ecfeff"/>
    <text x="600" y="477" text-anchor="middle" font-size="18" fill="#155e75">寄存器组 / ALU</text>
    <rect x="730" y="438" width="150" height="62" rx="10" fill="#ecfdf5"/>
    <text x="805" y="477" text-anchor="middle" font-size="18" fill="#065f46">Cache / 总线接口</text>
    <path d="M140 270V455H278" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M915 455H1060V278" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="600" y="595" text-anchor="middle" font-size="17" fill="#475569">时钟推动状态更新；控制信号决定数据“从哪里来、做什么、到哪里去”</text>
  </g>
</svg>
