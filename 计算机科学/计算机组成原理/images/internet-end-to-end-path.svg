<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e0f2fe"/><stop offset="1" stop-color="#bae6fd"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#0369a1"/></marker>
    <style>
      .title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font:700 17px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .t{font:14px "Microsoft YaHei",sans-serif;fill:#334155}
      .s{font:13px "Microsoft YaHei",sans-serif;fill:#64748b}
      .path{stroke:#0369a1;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1300" height="700" rx="22" fill="#f8fafc"/>
  <text x="650" y="48" text-anchor="middle" class="title">一次跨地域网站访问经过的真实路径</text>
  <text x="650" y="76" text-anchor="middle" class="s">每一跳只需知道下一跳；端系统负责完整协议语义</text>

  <path d="M0 390 Q180 320 350 390T700 385T1030 390T1300 370V560H0Z" fill="url(#sea)"/>
  <path d="M350 430 Q650 520 980 430" stroke="#075985" stroke-width="8" fill="none"/>
  <text x="665" y="515" text-anchor="middle" class="h" fill="#075985">海底光缆：多波长并行传输</text>

  <g transform="translate(55,165)">
    <rect width="150" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <rect x="33" y="26" width="84" height="58" rx="6" fill="#fff" stroke="#2563eb" stroke-width="4"/>
    <path d="M75 84v20M48 104h54" stroke="#2563eb" stroke-width="5"/>
