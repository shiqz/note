    <text x="65" y="135" text-anchor="middle" class="h">家庭网关</text>
    <text x="65" y="158" text-anchor="middle" class="s">Wi-Fi / Ethernet</text>
  </g>
  <path d="M425 240h80" class="path"/>

  <g transform="translate(515,160)">
