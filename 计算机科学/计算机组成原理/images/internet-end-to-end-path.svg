  </g>
  <path d="M935 240h80" class="path"/>

  <g transform="translate(1025,145)">
    <rect width="220" height="190" rx="20" fill="#ffe4e6" stroke="#be123c" stroke-width="4"/>
    <rect x="30" y="25" width="160" height="35" rx="6" fill="#fff"/>
    <rect x="30" y="70" width="160" height="35" rx="6" fill="#fff"/>
    <rect x="30" y="115" width="160" height="35" rx="6" fill="#fff"/>
    <circle cx="49" cy="42" r="5" fill="#22c55e"/><circle cx="49" cy="87" r="5" fill="#22c55e"/><circle cx="49" cy="132" r="5" fill="#22c55e"/>
    <text x="110" y="177" text-anchor="middle" class="h">CDN / 数据中心</text>
  </g>

  <g transform="translate(75,580)">
    <rect width="1150" height="75" rx="14" fill="#e2e8f0"/>
