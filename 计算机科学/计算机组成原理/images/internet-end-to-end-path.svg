    <path d="M25 48h110M25 80h110M25 112h110" stroke="#d97706" stroke-width="7"/>
    <circle cx="44" cy="48" r="7" fill="#fff"/><circle cx="44" cy="80" r="7" fill="#fff"/><circle cx="44" cy="112" r="7" fill="#fff"/>
    <text x="80" y="145" text-anchor="middle" class="h">本地运营商</text>
  </g>
  <path d="M680 240h80" class="path"/>

  <g transform="translate(770,160)">
    <rect width="160" height="160" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
