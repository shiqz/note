<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font:700 19px "Microsoft YaHei",sans-serif;fill:#fff}
      .t{font:15px "Microsoft YaHei",sans-serif;fill:#334155}
      .s{font:13px "Microsoft YaHei",sans-serif;fill:#64748b}
      .line{stroke:#64748b;stroke-width:2;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="22" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" class="title">同一个 bit，在不同介质中是不同的物理状态</text>
  <text x="600" y="78" text-anchor="middle" class="s">越靠左越快、越昂贵；越靠右越适合大容量持久保存</text>

  <g transform="translate(45,125)">
    <rect width="190" height="340" rx="16" fill="#2563eb"/>
    <text x="95" y="37" text-anchor="middle" class="h">寄存器 / SRAM</text>
    <rect x="15" y="58" width="160" height="160" rx="12" fill="#eff6ff"/>
    <circle cx="63" cy="106" r="24" fill="#60a5fa"/>
    <circle cx="127" cy="106" r="24" fill="#1d4ed8"/>
    <path d="M84 100h18M106 112H88" class="line" fill="none"/>
    <text x="95" y="155" text-anchor="middle" class="t">反馈电路维持</text>
    <text x="95" y="180" text-anchor="middle" class="t">两个稳定状态</text>
    <text x="95" y="245" text-anchor="middle" class="h">极快</text>
    <text x="95" y="274" text-anchor="middle" class="h">断电丢失</text>
    <text x="95" y="306" text-anchor="middle" class="s" fill="#dbeafe">晶体管多、面积大</text>
  </g>

  <g transform="translate(275,125)">
    <rect width="190" height="340" rx="16" fill="#0f766e"/>
    <text x="95" y="37" text-anchor="middle" class="h">DRAM</text>
    <rect x="15" y="58" width="160" height="160" rx="12" fill="#f0fdfa"/>
    <line x1="46" y1="100" x2="86" y2="100" stroke="#0f766e" stroke-width="6"/>
    <line x1="86" y1="75" x2="86" y2="125" stroke="#0f766e" stroke-width="5"/>
    <line x1="101" y1="75" x2="101" y2="125" stroke="#0f766e" stroke-width="5"/>
    <line x1="101" y1="100" x2="145" y2="100" stroke="#0f766e" stroke-width="3"/>
    <text x="95" y="155" text-anchor="middle" class="t">电容中的电荷</text>
    <text x="95" y="180" text-anchor="middle" class="t">会泄漏，需刷新</text>
    <text x="95" y="245" text-anchor="middle" class="h">较快、容量大</text>
    <text x="95" y="274" text-anchor="middle" class="h">断电丢失</text>
    <text x="95" y="306" text-anchor="middle" class="s" fill="#ccfbf1">主内存的主要介质</text>
  </g>

  <g transform="translate(505,125)">
    <rect width="190" height="340" rx="16" fill="#7c3aed"/>
    <text x="95" y="37" text-anchor="middle" class="h">NAND 闪存</text>
    <rect x="15" y="58" width="160" height="160" rx="12" fill="#f5f3ff"/>
    <path d="M45 145h100M62 145V96h76v49" fill="none" stroke="#7c3aed" stroke-width="5"/>
    <rect x="75" y="73" width="50" height="22" rx="5" fill="#a78bfa"/>
    <circle cx="85" cy="84" r="4" fill="#fff"/><circle cx="100" cy="84" r="4" fill="#fff"/><circle cx="115" cy="84" r="4" fill="#fff"/>
    <text x="95" y="175" text-anchor="middle" class="t">电荷改变阈值电压</text>
    <text x="95" y="245" text-anchor="middle" class="h">微秒级访问</text>
    <text x="95" y="274" text-anchor="middle" class="h">断电保留</text>
    <text x="95" y="306" text-anchor="middle" class="s" fill="#ede9fe">需擦除、纠错与磨损均衡</text>
  </g>

  <g transform="translate(735,125)">
    <rect width="190" height="340" rx="16" fill="#c2410c"/>
    <text x="95" y="37" text-anchor="middle" class="h">HDD 磁盘</text>
    <rect x="15" y="58" width="160" height="160" rx="12" fill="#fff7ed"/>
    <circle cx="88" cy="132" r="55" fill="#fed7aa" stroke="#c2410c" stroke-width="5"/>
    <circle cx="88" cy="132" r="17" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
    <path d="M126 84L105 122" stroke="#9a3412" stroke-width="7"/>
    <rect x="119" y="70" width="38" height="18" rx="5" fill="#fb923c"/>
    <text x="95" y="205" text-anchor="middle" class="t">磁化方向保存状态</text>
    <text x="95" y="245" text-anchor="middle" class="h">毫秒级随机访问</text>
    <text x="95" y="274" text-anchor="middle" class="h">断电保留</text>
    <text x="95" y="306" text-anchor="middle" class="s" fill="#ffedd5">机械寻道、顺序传输较快</text>
  </g>

  <g transform="translate(965,125)">
    <rect width="190" height="340" rx="16" fill="#be123c"/>
    <text x="95" y="37" text-anchor="middle" class="h">网络 / 远程副本</text>
    <rect x="15" y="58" width="160" height="160" rx="12" fill="#fff1f2"/>
    <path d="M28 133c25-58 44 58 68 0s45 58 67 0" fill="none" stroke="#e11d48" stroke-width="6"/>
    <circle cx="32" cy="132" r="8" fill="#881337"/><circle cx="159" cy="132" r="8" fill="#881337"/>
    <text x="95" y="185" text-anchor="middle" class="t">信号传输编码副本</text>
    <text x="95" y="245" text-anchor="middle" class="h">毫秒级或更高</text>
    <text x="95" y="274" text-anchor="middle" class="h">可异地持久保存</text>
    <text x="95" y="306" text-anchor="middle" class="s" fill="#ffe4e6">容量扩展与容灾</text>
  </g>

  <g transform="translate(120,525)">
    <rect width="960" height="76" rx="14" fill="#e2e8f0"/>
    <text x="480" y="30" text-anchor="middle" class="t">存储层次的根本原因：速度、容量、成本、功耗和持久性无法由同一种介质同时做到最优</text>
    <text x="480" y="55" text-anchor="middle" class="s">系统用缓存和局部性，让大多数访问停留在更快的层级</text>
  </g>
</svg>
