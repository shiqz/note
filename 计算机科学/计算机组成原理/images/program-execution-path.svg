<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font:700 18px "Microsoft YaHei",sans-serif;fill:#fff}
      .t{font:14px "Microsoft YaHei",sans-serif;fill:#334155}
      .s{font:13px "Microsoft YaHei",sans-serif;fill:#64748b}
      .a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="22" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">程序从源代码到 CPU 提交结果</text>

  <g transform="translate(50,100)">
    <rect width="155" height="105" rx="14" fill="#0f766e"/>
    <text x="77" y="32" text-anchor="middle" class="h">源代码</text>
    <rect x="13" y="48" width="129" height="42" rx="7" fill="#f0fdfa"/>
    <text x="77" y="74" text-anchor="middle" class="t">函数、变量、算法</text>
  </g>
  <path d="M210 152h48" class="a"/>
  <g transform="translate(270,100)">
    <rect width="155" height="105" rx="14" fill="#2563eb"/>
    <text x="77" y="32" text-anchor="middle" class="h">编译与链接</text>
    <rect x="13" y="48" width="129" height="42" rx="7" fill="#eff6ff"/>
    <text x="77" y="74" text-anchor="middle" class="t">优化、机器码、库</text>
  </g>
  <path d="M430 152h48" class="a"/>
  <g transform="translate(490,100)">
    <rect width="155" height="105" rx="14" fill="#7c3aed"/>
    <text x="77" y="32" text-anchor="middle" class="h">可执行文件</text>
    <rect x="13" y="48" width="129" height="42" rx="7" fill="#f5f3ff"/>
    <text x="77" y="74" text-anchor="middle" class="t">代码、数据、元信息</text>
  </g>
  <path d="M650 152h48" class="a"/>
  <g transform="translate(710,100)">
    <rect width="155" height="105" rx="14" fill="#c2410c"/>
    <text x="77" y="32" text-anchor="middle" class="h">操作系统加载</text>
    <rect x="13" y="48" width="129" height="42" rx="7" fill="#fff7ed"/>
    <text x="77" y="74" text-anchor="middle" class="t">进程、页表、栈、库</text>
  </g>
  <path d="M870 152h48" class="a"/>
  <g transform="translate(930,100)">
    <rect width="220" height="105" rx="14" fill="#be123c"/>
    <text x="110" y="32" text-anchor="middle" class="h">线程进入 CPU</text>
    <rect x="13" y="48" width="194" height="42" rx="7" fill="#fff1f2"/>
    <text x="110" y="74" text-anchor="middle" class="t">PC 指向程序入口</text>
  </g>

  <path d="M1040 210v58H165v47" class="a"/>

  <g transform="translate(75,325)">
    <rect width="1050" height="270" rx="20" fill="white" stroke="#cbd5e1" stroke-width="2"/>
    <text x="525" y="35" text-anchor="middle" class="title" font-size="22">CPU 内部：许多指令同时位于不同阶段</text>
    <g transform="translate(40,75)">
      <rect width="155" height="125" rx="13" fill="#0284c7"/>
      <text x="77" y="30" text-anchor="middle" class="h">1. 取指</text>
      <text x="77" y="61" text-anchor="middle" class="h" font-size="14">PC / 分支预测</text>
      <text x="77" y="86" text-anchor="middle" class="h" font-size="14">TLB / 指令 Cache</text>
    </g>
    <path d="M240 462h35" class="a"/>
    <g transform="translate(285,400)">
      <rect width="155" height="125" rx="13" fill="#4f46e5"/>
      <text x="77" y="30" text-anchor="middle" class="h">2. 译码</text>
      <text x="77" y="61" text-anchor="middle" class="h" font-size="14">识别操作与操作数</text>
      <text x="77" y="86" text-anchor="middle" class="h" font-size="14">生成内部微操作</text>
    </g>
    <path d="M445 462h35" class="a"/>
    <g transform="translate(490,400)">
      <rect width="155" height="125" rx="13" fill="#7c3aed"/>
      <text x="77" y="30" text-anchor="middle" class="h">3. 调度执行</text>
      <text x="77" y="61" text-anchor="middle" class="h" font-size="14">重命名 / 乱序</text>
      <text x="77" y="86" text-anchor="middle" class="h" font-size="14">ALU / FPU / SIMD</text>
    </g>
    <path d="M650 462h35" class="a"/>
    <g transform="translate(695,400)">
      <rect width="155" height="125" rx="13" fill="#ea580c"/>
      <text x="77" y="30" text-anchor="middle" class="h">4. 访存</text>
      <text x="77" y="61" text-anchor="middle" class="h" font-size="14">L1 / L2 / L3</text>
      <text x="77" y="86" text-anchor="middle" class="h" font-size="14">未命中才访问 DRAM</text>
    </g>
    <path d="M855 462h35" class="a"/>
    <g transform="translate(900,400)">
      <rect width="110" height="125" rx="13" fill="#be123c"/>
      <text x="55" y="30" text-anchor="middle" class="h">5. 提交</text>
      <text x="55" y="61" text-anchor="middle" class="h" font-size="14">按序生效</text>
      <text x="55" y="86" text-anchor="middle" class="h" font-size="14">精确异常</text>
    </g>
  </g>

  <g transform="translate(180,630)">
    <rect width="840" height="55" rx="12" fill="#e2e8f0"/>
    <text x="420" y="23" text-anchor="middle" class="t">高性能来自：流水线 + 多发射 + 乱序执行 + 分支预测 + 缓存 + 向量化</text>
    <text x="420" y="43" text-anchor="middle" class="s">内部可以推测和乱序，最终必须保持 ISA 对程序承诺的可观察结果</text>
  </g>
</svg>
