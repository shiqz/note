<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font:700 18px "Microsoft YaHei",sans-serif;fill:#fff}
      .t{font:15px "Microsoft YaHei",sans-serif;fill:#334155}
      .s{font:13px "Microsoft YaHei",sans-serif;fill:#64748b}
      .a{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">晶体管怎样搭出能计算 1 + 1 的半加器</text>
  <text x="600" y="76" text-anchor="middle" class="s">晶体管先组成逻辑门，逻辑门再按规则组合</text>

  <g transform="translate(55,130)">
    <rect width="180" height="250" rx="18" fill="#0f766e"/>
    <text x="90" y="35" text-anchor="middle" class="h">输入</text>
    <rect x="25" y="65" width="130" height="55" rx="10" fill="#f0fdfa"/>
    <text x="90" y="100" text-anchor="middle" class="t" font-weight="700">A = 1</text>
    <rect x="25" y="140" width="130" height="55" rx="10" fill="#f0fdfa"/>
    <text x="90" y="175" text-anchor="middle" class="t" font-weight="700">B = 1</text>
    <text x="90" y="225" text-anchor="middle" class="h" font-size="14">两个二进制位</text>
  </g>
  <path d="M240 255h65" class="a"/>

  <g transform="translate(315,105)">
    <rect width="320" height="310" rx="20" fill="#2563eb"/>
    <text x="160" y="36" text-anchor="middle" class="h">半加器</text>
    <rect x="25" y="65" width="270" height="90" rx="12" fill="#eff6ff"/>
    <text x="70" y="96" text-anchor="middle" class="t">A</text>
    <text x="70" y="132" text-anchor="middle" class="t">B</text>
    <path d="M95 78h70c55 0 79 31 79 32s-24 32-79 32H95c18-23 18-42 0-64z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4"/>
    <text x="169" y="115" text-anchor="middle" class="t" font-weight="700">XOR</text>
    <text x="270" y="115" text-anchor="middle" class="t">Sum</text>
    <rect x="25" y="180" width="270" height="90" rx="12" fill="#eff6ff"/>
    <text x="70" y="211" text-anchor="middle" class="t">A</text>
    <text x="70" y="247" text-anchor="middle" class="t">B</text>
    <path d="M95 193h65c55 0 78 31 78 32s-23 32-78 32H95z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/>
    <text x="165" y="230" text-anchor="middle" class="t" font-weight="700">AND</text>
    <text x="266" y="230" text-anchor="middle" class="t">Carry</text>
    <text x="160" y="295" text-anchor="middle" class="h" font-size="14">每个门内部由多只晶体管组成</text>
  </g>

  <path d="M640 205h75" class="a"/>
  <path d="M640 320h75" class="a"/>
  <g transform="translate(725,130)">
    <rect width="190" height="250" rx="18" fill="#7c3aed"/>
    <text x="95" y="35" text-anchor="middle" class="h">门的输出</text>
    <rect x="25" y="65" width="140" height="55" rx="10" fill="#f5f3ff"/>
    <text x="95" y="100" text-anchor="middle" class="t" font-weight="700">Sum = 0</text>
    <rect x="25" y="140" width="140" height="55" rx="10" fill="#f5f3ff"/>
    <text x="95" y="175" text-anchor="middle" class="t" font-weight="700">Carry = 1</text>
    <text x="95" y="225" text-anchor="middle" class="h" font-size="14">进位在左，本位在右</text>
  </g>
  <path d="M920 255h65" class="a"/>
  <g transform="translate(995,130)">
    <rect width="150" height="250" rx="18" fill="#c2410c"/>
    <text x="75" y="35" text-anchor="middle" class="h">结果</text>
    <rect x="25" y="75" width="100" height="95" rx="12" fill="#fff7ed"/>
    <text x="75" y="115" text-anchor="middle" class="t" font-weight="700">10₂</text>
    <text x="75" y="145" text-anchor="middle" class="t">也就是 2</text>
    <text x="75" y="215" text-anchor="middle" class="h" font-size="16">1 + 1 = 10</text>
  </g>

  <rect x="150" y="470" width="900" height="78" rx="14" fill="#e2e8f0"/>
  <text x="600" y="501" text-anchor="middle" class="t">XOR 负责算本位：两个输入不同时为 1；AND 负责算进位：两个输入都为 1 时进位</text>
  <text x="600" y="528" text-anchor="middle" class="s">把更多全加器连接起来，就能计算更大的二进制整数</text>
</svg>
