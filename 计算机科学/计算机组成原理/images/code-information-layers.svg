<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#64748b"/>
    </marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1080" height="560" rx="24" fill="#f8fafc"/>
  <text x="540" y="52" text-anchor="middle" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#0f172a">编码：用约定赋予符号意义</text>
  <text x="540" y="82" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" fill="#64748b">信息没有消失，只是在不同层次换了一种表达</text>
  <g font-family="Microsoft YaHei" filter="url(#shadow)">
    <rect x="70" y="180" width="190" height="150" rx="18" fill="#4f46e5"/>
    <text x="165" y="230" text-anchor="middle" font-size="23" font-weight="700" fill="white">含义</text>
    <text x="165" y="268" text-anchor="middle" font-size="16" fill="#e0e7ff">“向我靠近”</text>
    <text x="165" y="298" text-anchor="middle" font-size="16" fill="#e0e7ff">字母 A、数字 65</text>
    <rect x="305" y="180" width="190" height="150" rx="18" fill="#2563eb"/>
    <text x="400" y="230" text-anchor="middle" font-size="23" font-weight="700" fill="white">符号规则</text>
    <text x="400" y="268" text-anchor="middle" font-size="16" fill="#dbeafe">摩尔斯码</text>
    <text x="400" y="298" text-anchor="middle" font-size="16" fill="#dbeafe">ASCII、二进制</text>
    <rect x="540" y="180" width="190" height="150" rx="18" fill="#0891b2"/>
    <text x="635" y="230" text-anchor="middle" font-size="23" font-weight="700" fill="white">物理状态</text>
    <text x="635" y="268" text-anchor="middle" font-size="16" fill="#cffafe">灯亮 / 灯灭</text>
    <text x="635" y="298" text-anchor="middle" font-size="16" fill="#cffafe">高电平 / 低电平</text>
    <rect x="775" y="180" width="235" height="150" rx="18" fill="#059669"/>
    <text x="892" y="230" text-anchor="middle" font-size="23" font-weight="700" fill="white">接收者解释</text>
    <text x="892" y="268" text-anchor="middle" font-size="16" fill="#d1fae5">使用同一套约定</text>
    <text x="892" y="298" text-anchor="middle" font-size="16" fill="#d1fae5">还原出原来的含义</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M260 255H296"/><path d="M495 255H531"/><path d="M730 255H766"/>
  </g>
  <rect x="190" y="405" width="700" height="85" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="540" y="440" text-anchor="middle" font-family="Microsoft YaHei" font-size="19" font-weight="700" fill="#334155">关键不在符号长什么样，而在通信双方是否遵守相同约定</text>
  <text x="540" y="470" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" fill="#64748b">电报码、盲文、文字和机器码，本质上都在解决同一个问题</text>
</svg>
