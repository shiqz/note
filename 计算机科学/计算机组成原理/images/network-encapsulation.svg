<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font:700 17px "Microsoft YaHei",sans-serif;fill:#fff}
      .t{font:14px "Microsoft YaHei",sans-serif;fill:#334155}
      .s{font:13px "Microsoft YaHei",sans-serif;fill:#64748b}
      .a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="22" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">网络封装：每一层只处理自己的职责</text>
  <text x="600" y="75" text-anchor="middle" class="s">发送端逐层加头部，接收端逐层检查并去除；中间路由器主要处理链路层和网络层</text>

  <g transform="translate(75,115)">
    <rect width="1050" height="70" rx="13" fill="#7c3aed"/>
    <text x="95" y="30" text-anchor="middle" class="h">应用层</text>
    <rect x="190" y="13" width="835" height="44" rx="8" fill="#f5f3ff"/>
    <text x="607" y="40" text-anchor="middle" class="t">HTTP 请求、JSON、图片、消息等应用数据</text>
  </g>
  <path d="M600 190v26" class="a"/>
  <g transform="translate(75,225)">
    <rect width="1050" height="70" rx="13" fill="#c026d3"/>
    <text x="95" y="30" text-anchor="middle" class="h">TLS</text>
    <rect x="190" y="13" width="180" height="44" rx="8" fill="#fce7f3"/>
    <text x="280" y="40" text-anchor="middle" class="t">TLS 记录头</text>
    <rect x="380" y="13" width="645" height="44" rx="8" fill="#f5f3ff"/>
    <text x="702" y="40" text-anchor="middle" class="t">加密后的应用数据 + 完整性标签</text>
  </g>
  <path d="M600 300v26" class="a"/>
  <g transform="translate(75,335)">
    <rect width="1050" height="70" rx="13" fill="#2563eb"/>
    <text x="95" y="30" text-anchor="middle" class="h">传输层</text>
    <rect x="190" y="13" width="180" height="44" rx="8" fill="#dbeafe"/>
    <text x="280" y="40" text-anchor="middle" class="t">TCP/UDP/QUIC 头</text>
    <rect x="380" y="13" width="645" height="44" rx="8" fill="#f5f3ff"/>
    <text x="702" y="40" text-anchor="middle" class="t">端口、序列号、确认信息 + 上层数据</text>
  </g>
  <path d="M600 410v26" class="a"/>
  <g transform="translate(75,445)">
    <rect width="1050" height="70" rx="13" fill="#0f766e"/>
    <text x="95" y="30" text-anchor="middle" class="h">网络层</text>
    <rect x="190" y="13" width="180" height="44" rx="8" fill="#ccfbf1"/>
    <text x="280" y="40" text-anchor="middle" class="t">IP 头</text>
    <rect x="380" y="13" width="645" height="44" rx="8" fill="#eff6ff"/>
    <text x="702" y="40" text-anchor="middle" class="t">源/目标 IP、跳数限制 + 传输层数据</text>
  </g>
  <path d="M600 520v26" class="a"/>
  <g transform="translate(75,555)">
    <rect width="1050" height="70" rx="13" fill="#c2410c"/>
    <text x="95" y="30" text-anchor="middle" class="h">链路/物理层</text>
    <rect x="190" y="13" width="155" height="44" rx="8" fill="#ffedd5"/>
    <text x="267" y="40" text-anchor="middle" class="t">帧头</text>
    <rect x="355" y="13" width="520" height="44" rx="8" fill="#ecfeff"/>
    <text x="615" y="40" text-anchor="middle" class="t">IP 包</text>
    <rect x="885" y="13" width="140" height="44" rx="8" fill="#fee2e2"/>
    <text x="955" y="40" text-anchor="middle" class="t">FCS/CRC</text>
  </g>

  <g transform="translate(1010,195)">
    <path d="M0 0h100v330h-100" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="55" y="155" text-anchor="middle" class="s" transform="rotate(90 55 155)">逐层加入控制信息</text>
  </g>
  <text x="600" y="655" text-anchor="middle" class="s">接收端执行相反过程：恢复信号 → 校验帧 → 处理 IP → 找到连接和端口 → 解密 → 交给应用</text>
</svg>
