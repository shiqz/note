<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <text x="490" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">K-Means 的失效场景：隐含"球形等大"假设</text>

  <rect x="20" y="75" width="300" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="340" y="75" width="300" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="660" y="75" width="300" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="170" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">非凸（半月形）簇</text>
  <text x="490" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">大小 / 密度不均</text>
  <text x="810" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">异常值拉偏质心</text>

  <!-- 面板 1：两个月牙 + 错误线性划分 -->
  <g fill="#2563eb">
    <circle cx="225" cy="273" r="6"/><circle cx="212" cy="249" r="6"/><circle cx="190" cy="230" r="6"/><circle cx="164" cy="222" r="6"/>
    <circle cx="136" cy="222" r="6"/><circle cx="110" cy="230" r="6"/><circle cx="88" cy="249" r="6"/><circle cx="75" cy="273" r="6"/>
  </g>
  <g fill="#e11d48">
    <circle cx="115" cy="367" r="6"/><circle cx="128" cy="391" r="6"/><circle cx="150" cy="409" r="6"/><circle cx="176" cy="418" r="6"/>
    <circle cx="204" cy="418" r="6"/><circle cx="230" cy="409" r="6"/><circle cx="252" cy="391" r="6"/><circle cx="265" cy="367" r="6"/>
  </g>
  <line x1="170" y1="180" x2="170" y2="470" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="170" y="172" text-anchor="middle" font-size="12" fill="#be123c">✗ K-Means 的线性划分</text>
  <text x="170" y="490" text-anchor="middle" font-size="12.5" fill="#64748b">决策边界是直线/超平面，</text>
  <text x="170" y="508" text-anchor="middle" font-size="12.5" fill="#64748b">环形、月牙等非凸簇切不开</text>

  <!-- 面板 2：大簇 + 两个小簇 -->
  <g fill="#2563eb">
    <circle cx="440" cy="300" r="6"/><circle cx="460" cy="290" r="6"/><circle cx="490" cy="300" r="6"/><circle cx="430" cy="325" r="6"/>
    <circle cx="455" cy="320" r="6"/><circle cx="485" cy="315" r="6"/><circle cx="510" cy="300" r="6"/><circle cx="445" cy="350" r="6"/>
    <circle cx="475" cy="345" r="6"/><circle cx="505" cy="340" r="6"/><circle cx="435" cy="365" r="6"/><circle cx="465" cy="370" r="6"/>
    <circle cx="500" cy="365" r="6"/><circle cx="480" cy="390" r="6"/><circle cx="450" cy="295" r="6"/><circle cx="520" cy="325" r="6"/>
    <circle cx="455" cy="395" r="6"/><circle cx="495" cy="385" r="6"/>
  </g>
  <g fill="#e11d48">
    <circle cx="585" cy="205" r="5"/><circle cx="610" cy="215" r="5"/><circle cx="595" cy="235" r="5"/><circle cx="620" cy="230" r="5"/><circle cx="600" cy="200" r="5"/>
  </g>
  <g fill="#059669">
    <circle cx="585" cy="405" r="5"/><circle cx="615" cy="415" r="5"/><circle cx="595" cy="435" r="5"/><circle cx="625" cy="430" r="5"/>
  </g>
  <!-- 错误质心与边界 -->
  <line x1="555" y1="150" x2="555" y2="470" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,5"/>
  <g>
    <circle cx="450" cy="310" r="10" fill="white"/><line x1="443" y1="303" x2="457" y2="317" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/><line x1="457" y1="303" x2="443" y2="317" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="505" cy="360" r="10" fill="white"/><line x1="498" y1="353" x2="512" y2="367" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/><line x1="512" y1="353" x2="498" y2="367" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="600" cy="330" r="10" fill="white"/><line x1="593" y1="323" x2="607" y2="337" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line x1="607" y1="323" x2="593" y2="337" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="490" y="490" text-anchor="middle" font-size="12.5" fill="#64748b">质心按"平方误差"分配，</text>
  <text x="490" y="508" text-anchor="middle" font-size="12.5" fill="#64748b">大簇容易被切碎、小簇被吞并</text>

  <!-- 面板 3：异常值 -->
  <g fill="#2563eb">
    <circle cx="770" cy="335" r="6"/><circle cx="790" cy="325" r="6"/><circle cx="820" cy="335" r="6"/><circle cx="760" cy="360" r="6"/>
    <circle cx="790" cy="355" r="6"/><circle cx="820" cy="355" r="6"/><circle cx="845" cy="345" r="6"/><circle cx="775" cy="385" r="6"/>
    <circle cx="805" cy="380" r="6"/><circle cx="835" cy="380" r="6"/><circle cx="790" cy="400" r="6"/><circle cx="825" cy="405" r="6"/>
  </g>
  <circle cx="930" cy="180" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="925" y="165" text-anchor="end" font-size="12" fill="#b45309">异常值</text>
  <!-- 真实中心 -->
  <circle cx="803" cy="363" r="13" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="755" y="430" font-size="12" fill="#15803d">真实簇中心（均值被带偏）</text>
  <!-- 被拉偏的质心 -->
  <g>
    <circle cx="845" cy="300" r="11" fill="white"/><line x1="837" y1="292" x2="853" y2="308" stroke="#be123c" stroke-width="3.5" stroke-linecap="round"/><line x1="853" y1="292" x2="837" y2="308" stroke="#be123c" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <line x1="812" y1="352" x2="838" y2="312" stroke="#be123c" stroke-width="2.5"/>
  <polygon points="841,306 830,310 838,317" fill="#be123c"/>
  <text x="810" y="490" text-anchor="middle" font-size="12.5" fill="#64748b">均值对极端值敏感，</text>
  <text x="810" y="508" text-anchor="middle" font-size="12.5" fill="#64748b">质心被异常值拖走</text>

  <!-- 底部建议条 -->
  <rect x="120" y="532" width="740" height="50" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="490" y="555" text-anchor="middle" font-size="13.5" fill="#3730a3">K-Means 假设：簇为凸形/各向同性（球形）、尺度与密度相近、无显著异常值</text>
  <text x="490" y="575" text-anchor="middle" font-size="13" fill="#4338ca">不满足时可考虑：GMM（椭球簇·软分配）、DBSCAN（任意形状·密度）、K-Medoids（抗异常值）</text>
</svg>
