  <!-- 底部公式 -->
  <rect x="180" y="505" width="620" height="52" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="490" y="538" text-anchor="middle" font-size="17" font-family="Consolas,monospace" fill="#78350f">P(x) = D(x)² / Σ D(x)² ，  D(x) = minₖ ‖x − μₖ‖²</text>
