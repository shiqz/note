<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <text x="490" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">目标函数 SSE：每一步都在"下山"，必然收敛</text>

  <!-- 左侧公式卡片 -->
  <rect x="40" y="85" width="430" height="410" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="255" y="125" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">簇内误差平方和（SSE / Inertia）</text>

  <rect x="80" y="150" width="350" height="64" rx="10" fill="white" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="255" y="190" text-anchor="middle" font-size="20" font-family="Consolas,monospace" fill="#1e3a8a">J = Σ(k=1..K) Σ(xᵢ∈Cₖ) ‖xᵢ − μₖ‖²</text>

  <g font-size="14" fill="#1e3a8a">
    <circle cx="92" cy="252" r="5" fill="#2563eb"/>
    <text x="108" y="257"><tspan font-weight="bold">E 步（分配）</tspan>：固定质心 μ，每个点归入最近质心 —— J 下降</text>
    <circle cx="92" cy="302" r="5" fill="#059669"/>
    <text x="108" y="307"><tspan font-weight="bold">M 步（更新）</tspan>：固定划分，μ 取簇内均值 —— J 下降</text>
    <circle cx="92" cy="352" r="5" fill="#f59e0b"/>
    <text x="108" y="357">J ≥ 0 有下界，且每轮迭代 J 单调不增</text>
    <circle cx="92" cy="402" r="5" fill="#e11d48"/>
    <text x="108" y="407">J 是非凸函数：收敛 ≠ 全局最优，</text>
    <text x="108" y="430">可能停在局部最优（对初值敏感）</text>
  </g>

  <!-- 右侧收敛曲线 -->
  <rect x="510" y="85" width="430" height="410" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="725" y="125" text-anchor="middle" font-size="17" font-weight="bold" fill="#334155">SSE 随迭代次数的变化</text>

  <!-- 坐标轴 -->
  <line x1="580" y1="440" x2="925" y2="440" stroke="#64748b" stroke-width="1.8"/>
  <line x1="580" y1="440" x2="580" y2="150" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="925,440 915,435 915,445" fill="#64748b"/>
  <polygon points="580,150 575,160 585,160" fill="#64748b"/>
  <text x="930" y="445" font-size="13" fill="#475569">迭代轮次</text>
  <text x="565" y="150" text-anchor="end" font-size="13" fill="#475569">SSE</text>

  <!-- 曲线 -->
  <polyline points="580,163 623,265 665,348 708,385 750,408 793,417 835,419 878,419 920,419"
            fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <circle cx="580" cy="163" r="4.5"/><circle cx="623" cy="265" r="4.5"/><circle cx="665" cy="348" r="4.5"/>
    <circle cx="708" cy="385" r="4.5"/><circle cx="750" cy="408" r="4.5"/><circle cx="793" cy="417" r="4.5"/>
    <circle cx="835" cy="419" r="4.5"/><circle cx="878" cy="419" r="4.5"/><circle cx="920" cy="419" r="4.5"/>
  </g>

  <line x1="793" y1="419" x2="920" y2="419" stroke="#15803d" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="858" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">收敛：J 不再下降</text>

  <text x="640" y="245" font-size="12.5" fill="#1d4ed8">分配步、更新步</text>
  <text x="640" y="263" font-size="12.5" fill="#1d4ed8">交替压低 J</text>

  <text x="725" y="475" text-anchor="middle" font-size="12.5" fill="#64748b">曲线只降不升（单调不增），所以算法一定会停下来</text>
</svg>
