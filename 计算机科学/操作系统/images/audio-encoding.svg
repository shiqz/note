<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2"/>
      <stop offset="100%" style="stop-color:#fee2e2"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg5)" rx="12"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#7f1d1d">音频编码：从声波到数字信号</text>
  
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="700" height="130" rx="10" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <text x="350" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#991b1b">PCM 编码三步骤：采样 → 量化 → 编码</text>
    
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="100" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">1. 采样 (Sampling)</text>
      <text x="100" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#b45309">时间轴离散化</text>
      <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#b45309">采样率: 44.1kHz, 48kHz</text>
    </g>
    
    <g transform="translate(250, 50)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="100" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">2. 量化 (Quantization)</text>
      <text x="100" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#1d4ed8">振幅离散化</text>
      <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d4ed8">位深: 16bit, 24bit</text>
    </g>
    
    <g transform="translate(470, 50)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#dcfce7" stroke="#4ade80"/>
      <text x="100" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#166534">3. 编码 (Encoding)</text>
      <text x="100" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#15803d">二进制表示</text>
      <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#15803d">补码/整数存储</text>
    </g>
  </g>
  
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="700" height="190" rx="10" fill="#fff" stroke="#f87171" stroke-width="2"/>
    
    <g transform="translate(30, 25)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">模拟声波（连续信号）</text>
      <path d="M 0,40 Q 30,10 60,40 T 120,40 T 180,40 T 240,40 T 300,40" stroke="#dc2626" stroke-width="2" fill="none"/>
      <line x1="0" y1="40" x2="310" y2="40" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4"/>
    </g>
    
    <g transform="translate(370, 25)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">采样点（离散时间）</text>
      <path d="M 0,40 Q 30,10 60,40 T 120,40 T 180,40 T 240,40 T 300,40" stroke="#fca5a5" stroke-width="1" fill="none"/>
      <g fill="#2563eb">
        <circle cx="0" cy="40" r="4"/><circle cx="30" cy="25" r="4"/><circle cx="60" cy="40" r="4"/>
        <circle cx="90" cy="55" r="4"/><circle cx="120" cy="40" r="4"/><circle cx="150" cy="25" r="4"/>
        <circle cx="180" cy="40" r="4"/><circle cx="210" cy="55" r="4"/><circle cx="240" cy="40" r="4"/>
        <circle cx="270" cy="25" r="4"/><circle cx="300" cy="40" r="4"/>
      </g>
    </g>
    
    <g transform="translate(30, 110)">
      <rect x="0" y="0" width="640" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="20" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#374151">码率计算：</text>
      <text x="20" y="42" font-family="monospace" font-size="11" fill="#6b7280">码率 = 采样率 × 位深 × 声道数</text>
      <text x="20" y="55" font-family="monospace" font-size="11" fill="#6b7280">CD音质: 44100Hz × 16bit × 2声道 = 1411.2 kbps</text>
    </g>
  </g>
</svg>