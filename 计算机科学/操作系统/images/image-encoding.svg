<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5"/>
      <stop offset="100%" style="stop-color:#d1fae5"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="480" fill="url(#bg4)" rx="12"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#064e3b">位图图像编码：从像素到图片</text>
  
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="280" height="350" rx="10" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#047857">像素矩阵表示</text>
    
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="200" height="150" fill="#f9fafb" stroke="#d1d5db"/>
      
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="30" height="30" fill="#ef4444"/>
        <rect x="35" y="0" width="30" height="30" fill="#f97316"/>
        <rect x="70" y="0" width="30" height="30" fill="#eab308"/>
        <rect x="105" y="0" width="30" height="30" fill="#22c55e"/>
        <rect x="140" y="0" width="30" height="30" fill="#3b82f6"/>
        
        <rect x="0" y="35" width="30" height="30" fill="#f97316"/>
        <rect x="35" y="35" width="30" height="30" fill="#eab308"/>
        <rect x="70" y="35" width="30" height="30" fill="#22c55e"/>
        <rect x="105" y="35" width="30" height="30" fill="#3b82f6"/>
        <rect x="140" y="35" width="30" height="30" fill="#8b5cf6"/>
        
        <rect x="0" y="70" width="30" height="30" fill="#eab308"/>
        <rect x="35" y="70" width="30" height="30" fill="#22c55e"/>
        <rect x="70" y="70" width="30" height="30" fill="#f9fafb" stroke="#d1d5db"/>
        <rect x="105" y="70" width="30" height="30" fill="#8b5cf6"/>
        <rect x="140" y="70" width="30" height="30" fill="#ec4899"/>
        
        <rect x="0" y="105" width="30" height="30" fill="#22c55e"/>
        <rect x="35" y="105" width="30" height="30" fill="#3b82f6"/>
        <rect x="70" y="105" width="30" height="30" fill="#8b5cf6"/>
        <rect x="105" y="105" width="30" height="30" fill="#ec4899"/>
        <rect x="140" y="105" width="30" height="30" fill="#f43f5e"/>
      </g>
      
      <text x="100" y="185" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#6b7280">放大后的像素网格</text>
    </g>
    
    <g transform="translate(20, 250)">
      <rect x="0" y="0" width="240" height="80" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="120" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#166534">每个像素 = RGB三原色</text>
      <text x="120" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#15803d">R: 0~255 (8位)</text>
      <text x="120" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#15803d">G: 0~255 (8位)</text>
      <text x="120" y="74" text-anchor="middle" font-family="monospace" font-size="11" fill="#15803d">B: 0~255 (8位) → 24位真彩色</text>
    </g>
  </g>
  
  <g transform="translate(350, 70)">
    <rect x="0" y="0" width="400" height="350" rx="10" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#047857">常见图像格式对比</text>
    
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="360" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="10" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#991b1b">BMP（无压缩）</text>
      <text x="10" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#b91c1c">直接存储每个像素的RGB值，文件大，无损失</text>
    </g>
    
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="360" height="65" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="10" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">PNG（无损压缩）</text>
      <text x="10" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#1d4ed8">DEFLATE压缩算法，支持透明通道(Alpha)</text>
      <text x="10" y="57" font-family="-apple-system, sans-serif" font-size="11" fill="#1d4ed8">适合图标、文字、图形等纯色区域多的图片</text>
    </g>
    
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="360" height="75" rx="6" fill="#fff7ed" stroke="#fdba74"/>
      <text x="10" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#9a3412">JPEG/JPG（有损压缩）</text>
      <text x="10" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#c2410c">基于DCT离散余弦变换，丢弃人眼不敏感信息</text>
      <text x="10" y="57" font-family="-apple-system, sans-serif" font-size="11" fill="#c2410c">质量可调，适合照片，不适合文字/线条图</text>
      <text x="10" y="74" font-family="-apple-system, sans-serif" font-size="11" fill="#c2410c">不支持透明</text>
    </g>
    
    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="360" height="55" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
      <text x="10" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#6b21a8">矢量图（SVG/AI）</text>
      <text x="10" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#7c3aed">存储数学描述（坐标、颜色、形状），无限缩放不失真</text>
    </g>
  </g>
</svg>