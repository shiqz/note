<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad)" rx="12"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#1e293b">现实世界信息到二进制的编码之路</text>
  
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="700" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="350" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#92400e">现实世界信息</text>
    <text x="350" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#b45309">文本 · 图片 · 音频 · 视频 · ...</text>
  </g>
  
  <line x1="400" y1="140" x2="400" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="165" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">采样/离散化</text>
  
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="700" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="350" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e40af">建立映射规则</text>
    <text x="350" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1d4ed8">字符集 · 色彩空间 · 音频采样率 · 视频帧率</text>
  </g>
  
  <line x1="400" y1="240" x2="400" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="265" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">编码/量化</text>
  
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="700" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="350" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#166534">数值表示</text>
    <text x="350" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#15803d">Unicode码点 · RGB值 · PCM采样值 · 帧数据</text>
  </g>
  
  <line x1="400" y1="340" x2="400" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="365" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">二进制序列化</text>
  
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="700" height="60" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="350" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#6b21a8">二进制存储/传输</text>
    <text x="350" y="45" text-anchor="middle" font-family="monospace" font-size="13" fill="#7c3aed">01001000 01100101 01101100 01101100 01101111...</text>
  </g>
</svg>