<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff"/>
      <stop offset="100%" style="stop-color:#e0f2fe"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0369a1"/>
    </marker>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad2)" rx="12"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#0c4a6e">字符集 vs 字符编码：两层抽象</text>
  
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="220" height="320" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="110" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#0369a1">字符集（Charset）</text>
    <text x="110" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#0284c7">"收录哪些字符 + 给每个字符分配唯一编号"</text>
    
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#f0f9ff" stroke="#7dd3fc"/>
      <text x="90" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#0369a1">字符 → 码点（Code Point）</text>
      <text x="90" y="33" text-anchor="middle" font-family="monospace" font-size="11" fill="#0284c7">A → U+0041</text>
      <text x="90" y="33" text-anchor="middle" font-family="monospace" font-size="11" fill="#0284c7" transform="translate(0, 0)">中 → U+4E2D</text>
    </g>
    
    <g transform="translate(20, 135)">
      <rect x="0" y="0" width="180" height="80" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="90" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#92400e">常见字符集</text>
      <text x="15" y="42" font-family="monospace" font-size="11" fill="#b45309">• ASCII: 128个字符</text>
      <text x="15" y="58" font-family="monospace" font-size="11" fill="#b45309">• GB2312/GBK: 中文</text>
      <text x="15" y="74" font-family="monospace" font-size="11" fill="#b45309">• Unicode: 全球文字</text>
    </g>
    
    <text x="110" y="250" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#64748b">→ 这是一本"字典"，定义了</text>
    <text x="110" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#64748b">字符和编号的对应关系</text>
  </g>
  
  <g transform="translate(290, 180)">
    <line x1="0" y1="0" x2="170" y2="0" stroke="#0369a1" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="85" y="-10" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#0369a1">编码（Encoding）</text>
    <text x="85" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#0284c7">"如何把编号存储为字节"</text>
  </g>
  
  <g transform="translate(480, 70)">
    <rect x="0" y="0" width="270" height="320" rx="10" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="135" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#047857">字符编码（Encoding）</text>
    <text x="135" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#059669">"码点如何转换为字节序列"</text>
    
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="230" height="55" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
      <text x="115" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#047857">码点 → 字节（Bytes）</text>
      <text x="115" y="38" text-anchor="middle" font-family="monospace" font-size="11" fill="#059669">U+4E2D(中) → UTF-8: E4 B8 AD</text>
      <text x="115" y="38" text-anchor="middle" font-family="monospace" font-size="11" fill="#059669" transform="translate(0, 0)">U+4E2D(中) → UTF-16: 4E 2D</text>
    </g>
    
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="230" height="100" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
      <text x="115" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#92400e">Unicode常见编码方案</text>
      <text x="20" y="45" font-family="monospace" font-size="11" fill="#b45309">• UTF-8: 变长1~4字节，兼容ASCII</text>
      <text x="20" y="62" font-family="monospace" font-size="11" fill="#b45309">• UTF-16: 2或4字节，Windows/Java常用</text>
      <text x="20" y="79" font-family="monospace" font-size="11" fill="#b45309">• UTF-32: 固定4字节，简单但浪费空间</text>
    </g>
    
    <text x="135" y="280" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#64748b">→ 这是"序列化规则"，决定编号</text>
    <text x="135" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-style="italic" fill="#64748b">在内存/磁盘中如何表示为字节</text>
  </g>
</svg>