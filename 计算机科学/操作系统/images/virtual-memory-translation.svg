<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}
      .label{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}
      .text{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#40566d}
      .box{fill:#edf7fd;stroke:#3f82ae;stroke-width:2;rx:12}
      .table{fill:#fff3df;stroke:#d68a29;stroke-width:2;rx:12}
      .mem{fill:#f1edfb;stroke:#7252aa;stroke-width:2;rx:12}
      .arrow{stroke:#526c80;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .miss{stroke:#b7584d;stroke-width:2.3;stroke-dasharray:7 5;fill:none;marker-end:url(#red)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526c80"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b7584d"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="44" text-anchor="middle" class="title">虚拟地址翻译、TLB 与缺页处理</text>

  <rect x="45" y="100" width="220" height="110" class="box"/>
  <text x="155" y="135" text-anchor="middle" class="label">CPU 产生虚拟地址</text>
  <text x="155" y="167" text-anchor="middle" class="text">虚拟页号 VPN</text>
  <text x="155" y="192" text-anchor="middle" class="text">+ 页内偏移 Offset</text>

  <rect x="340" y="100" width="220" height="110" class="box"/>
  <text x="450" y="135" text-anchor="middle" class="label">TLB 查询</text>
  <text x="450" y="167" text-anchor="middle" class="text">缓存近期 VPN → PPN</text>
  <text x="450" y="192" text-anchor="middle" class="text">同时缓存页权限</text>

  <rect x="635" y="100" width="220" height="110" class="table"/>
  <text x="745" y="135" text-anchor="middle" class="label">多级页表</text>
  <text x="745" y="167" text-anchor="middle" class="text">逐级索引页表项 PTE</text>
  <text x="745" y="192" text-anchor="middle" class="text">得到 PPN、权限、状态位</text>

  <rect x="930" y="100" width="220" height="110" class="mem"/>
  <text x="1040" y="135" text-anchor="middle" class="label">物理地址</text>
  <text x="1040" y="167" text-anchor="middle" class="text">物理页号 PPN</text>
  <text x="1040" y="192" text-anchor="middle" class="text">+ 原页内偏移</text>

  <path d="M265 155 H337" class="arrow"/>
  <path d="M560 130 H632" class="miss"/>
  <text x="596" y="116" text-anchor="middle" class="text">TLB 未命中</text>
  <path d="M560 180 H900 V155 H927" class="arrow"/>
  <text x="745" y="203" text-anchor="middle" class="text">TLB 命中</text>
  <path d="M855 155 H927" class="arrow"/>

  <rect x="65" y="340" width="280" height="150" class="table"/>
  <text x="205" y="375" text-anchor="middle" class="label">PTE 有效且权限允许</text>
  <text x="205" y="408" text-anchor="middle" class="text">填充 TLB</text>
  <text x="205" y="434" text-anchor="middle" class="text">重新执行内存访问</text>
  <text x="205" y="460" text-anchor="middle" class="text">最终访问 Cache / DRAM</text>

  <rect x="460" y="330" width="280" height="170" class="table"/>
  <text x="600" y="365" text-anchor="middle" class="label">PTE 无效：缺页异常</text>
  <text x="600" y="398" text-anchor="middle" class="text">CPU 转入内核缺页处理器</text>
  <text x="600" y="424" text-anchor="middle" class="text">判断地址是否合法</text>
  <text x="600" y="450" text-anchor="middle" class="text">分配页、读文件或执行写时复制</text>
  <text x="600" y="476" text-anchor="middle" class="text">更新页表后重试原指令</text>

  <rect x="855" y="340" width="280" height="150" fill="#fceeed" stroke="#b7584d" stroke-width="2" rx="12"/>
  <text x="995" y="375" text-anchor="middle" class="label">非法地址或权限冲突</text>
  <text x="995" y="408" text-anchor="middle" class="text">例如写只读页、执行 NX 页</text>
  <text x="995" y="434" text-anchor="middle" class="text">内核向进程报告访问异常</text>
  <text x="995" y="460" text-anchor="middle" class="text">未处理则终止进程</text>

  <path d="M745 210 V275 H205 V337" class="arrow"/>
  <path d="M745 210 V275 H600 V327" class="miss"/>
  <path d="M745 210 V275 H995 V337" class="miss"/>

  <rect x="125" y="585" width="950" height="85" fill="#f8fafc" stroke="#a8b7c3" rx="12"/>
  <text x="600" y="617" text-anchor="middle" class="label">虚拟内存同时解决三类问题</text>
  <text x="600" y="645" text-anchor="middle" class="text">地址隔离与保护、物理内存的灵活映射、文件和匿名页的统一按需加载；它不只是“内存不够时使用磁盘”。</text>
</svg>
