<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2"/>
      <stop offset="100%" style="stop-color:#fecaca"/>
    </linearGradient>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  
  <rect width="800" height="400" fill="url(#bg7)" rx="12"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#991b1b">乱码是怎么产生的？编码/解码不一致</text>
  
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <text x="160" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#991b1b">正常流程（编码=解码）</text>
    
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#dcfce7" stroke="#22c55e"/>
      <text x="140" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#166534">文本："中"</text>
    </g>
    
    <line x1="160" y1="95" x2="160" y2="120" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowred)"/>
    <text x="175" y="110" font-family="-apple-system, sans-serif" font-size="10" fill="#15803d">UTF-8编码</text>
    
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="140" y="25" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">E4 B8 AD</text>
    </g>
    
    <line x1="160" y1="160" x2="160" y2="185" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowred)"/>
    <text x="175" y="175" font-family="-apple-system, sans-serif" font-size="10" fill="#15803d">UTF-8解码</text>
    
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#dcfce7" stroke="#22c55e"/>
      <text x="140" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#166534">正确显示："中"</text>
    </g>
  </g>
  
  <g transform="translate(430, 80)">
    <rect x="0" y="0" width="320" height="260" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <text x="160" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#991b1b">乱码流程（编码≠解码）</text>
    
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#dcfce7" stroke="#22c55e"/>
      <text x="140" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#166534">文本："中"</text>
    </g>
    
    <line x1="160" y1="95" x2="160" y2="120" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowred)"/>
    <text x="175" y="110" font-family="-apple-system, sans-serif" font-size="10" fill="#15803d">UTF-8编码</text>
    
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="140" y="25" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">E4 B8 AD</text>
    </g>
    
    <line x1="160" y1="160" x2="160" y2="185" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
    <text x="175" y="175" font-family="-apple-system, sans-serif" font-size="10" fill="#dc2626">GBK解码（错误！）</text>
    
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="#fee2e2" stroke="#ef4444"/>
      <text x="140" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#991b1b">���� 或 "涓"</text>
    </g>
    
    <text x="160" y="245" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#dc2626">编码用UTF-8，解码用GBK → 规则不匹配 → 乱码</text>
  </g>
</svg>