<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#2563eb"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:24px;font-weight:700}.s{font-size:16px}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.g{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.l{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="580" rx="20" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" class="t">DNS：客户端递归查询，解析器迭代查询</text>
  <g text-anchor="middle">
    <rect x="35" y="220" width="160" height="80" rx="12" class="b"/><text x="115" y="252" class="t">客户端</text><text x="115" y="279" class="s">www.example.com?</text>
    <rect x="265" y="205" width="190" height="110" rx="12" class="g"/><text x="360" y="245" class="t">递归解析器</text><text x="360" y="274" class="s">缓存命中则直接返回</text><text x="360" y="298" class="s">未命中则代为查询</text>
    <rect x="555" y="75" width="180" height="75" rx="12" class="b"/><text x="645" y="107" class="t">根 DNS</text><text x="645" y="132" class="s">返回 .com 服务器</text>
    <rect x="810" y="205" width="200" height="75" rx="12" class="b"/><text x="910" y="237" class="t">.com 顶级域</text><text x="910" y="262" class="s">返回权威服务器</text>
    <rect x="555" y="380" width="210" height="85" rx="12" class="b"/><text x="660" y="414" class="t">权威 DNS</text><text x="660" y="442" class="s">返回 A / AAAA / CNAME</text>
  </g>
  <path d="M195 245H255M455 220C495 170 530 135 545 120M735 120C790 145 835 170 870 195M870 290C825 335 780 375 765 395M545 430C500 400 460 340 420 315M265 280H205" class="l"/>
  <text x="550" y="520" text-anchor="middle" class="s">响应按 TTL 缓存：减少延迟和上游压力，但也使记录变更无法立即全网生效</text>
</svg>
