<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:24px;font-weight:700}.s{font-size:16px}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.g{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.o{fill:#fff7ed;stroke:#ea580c;stroke-width:2}</style></defs>
  <rect width="1100" height="520" rx="20" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" class="t">HTTP/1.1、HTTP/2 与 HTTP/3 的并发模型</text>
  <g text-anchor="middle">
    <text x="180" y="92" class="t">HTTP/1.1</text><rect x="55" y="115" width="250" height="280" rx="12" class="o"/>
    <text x="180" y="150" class="s">TCP 连接 1：请求 → 响应</text><text x="180" y="190" class="s">TCP 连接 2：请求 → 响应</text><text x="180" y="230" class="s">常开多个连接提高并发</text><text x="180" y="300" class="s">同一连接通常按顺序处理</text>
    <text x="550" y="92" class="t">HTTP/2</text><rect x="390" y="115" width="320" height="280" rx="12" class="b"/>
    <text x="550" y="150" class="s">一条 TCP 连接</text><text x="550" y="195" class="s">流 1 ━━━╋━━━━</text><text x="550" y="235" class="s">流 3 ━╋━━━━━━</text><text x="550" y="275" class="s">流 5 ━━━━━╋━━</text><text x="550" y="325" class="s">应用层多路复用</text><text x="550" y="355" class="s">TCP 丢包仍可能阻塞所有流</text>
    <text x="920" y="92" class="t">HTTP/3</text><rect x="795" y="115" width="250" height="280" rx="12" class="g"/>
    <text x="920" y="150" class="s">一条 QUIC 连接</text><text x="920" y="195" class="s">独立可靠流 1</text><text x="920" y="235" class="s">独立可靠流 3</text><text x="920" y="275" class="s">独立可靠流 5</text><text x="920" y="325" class="s">某流丢包主要阻塞自身</text><text x="920" y="355" class="s">内建 TLS 1.3</text>
  </g>
  <text x="550" y="455" text-anchor="middle" class="s">协议升级优化连接建立与并发调度，但服务端处理、物理 RTT 和拥塞仍然存在</text>
</svg>
