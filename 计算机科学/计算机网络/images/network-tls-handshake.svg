<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="650" viewBox="0 0 1050 650">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#7c3aed"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:24px;font-weight:700}.s{font-size:16px}.l{stroke:#7c3aed;stroke-width:2.5;marker-end:url(#a)}.d{stroke:#64748b;stroke-width:3;stroke-dasharray:8 7}.b{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2}</style></defs>
  <rect width="1050" height="650" rx="20" fill="#f8fafc"/><text x="525" y="40" text-anchor="middle" class="t">TLS 1.3：认证身份并协商临时会话密钥</text>
  <text x="195" y="85" text-anchor="middle" class="t">客户端</text><text x="855" y="85" text-anchor="middle" class="t">服务端</text>
  <path d="M195 105V590M855 105V590" class="d"/>
  <path d="M195 135L855 190M855 230L195 310M195 350L855 395M855 455L195 500M195 540L855 580" class="l"/>
  <g text-anchor="middle" class="s">
    <text x="525" y="145">ClientHello：版本、套件、随机数、SNI、临时公钥 A</text>
    <text x="525" y="243">ServerHello：临时公钥 B</text><text x="525" y="270">证书链 + CertificateVerify + Finished</text>
    <text x="525" y="363">校验证书与签名；发送 Finished</text>
    <rect x="315" y="415" width="420" height="55" rx="10" class="b"/><text x="525" y="448">双方用 A/B 计算共享秘密并派生会话密钥</text>
    <text x="525" y="515">使用对称认证加密传输 HTTP 数据</text><text x="525" y="555">加密应用数据与加密应用数据双向流动</text>
  </g>
  <text x="525" y="620" text-anchor="middle" class="s">证书私钥用于证明身份，不直接加密全部业务数据；大流量使用高效的对称密钥</text>
</svg>
