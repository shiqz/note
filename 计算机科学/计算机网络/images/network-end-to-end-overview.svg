<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#2563eb"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.s{font-size:16px}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.g{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.o{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.l{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="500" rx="20" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" class="t">一次 HTTPS 请求跨越互联网的完整路径</text>
  <g text-anchor="middle">
    <rect x="35" y="155" width="150" height="100" rx="14" class="b"/><text x="110" y="193" class="t">浏览器</text><text x="110" y="225" class="s">HTTP / TLS</text>
    <rect x="225" y="155" width="150" height="100" rx="14" class="b"/><text x="300" y="193" class="t">操作系统</text><text x="300" y="225" class="s">Socket / TCP / IP</text>
    <rect x="415" y="155" width="130" height="100" rx="14" class="g"/><text x="480" y="193" class="t">网卡</text><text x="480" y="225" class="s">帧 → 信号</text>
    <rect x="585" y="155" width="130" height="100" rx="14" class="g"/><text x="650" y="193" class="t">交换机</text><text x="650" y="225" class="s">按 MAC 转发</text>
    <rect x="755" y="155" width="130" height="100" rx="14" class="o"/><text x="820" y="193" class="t">路由器</text><text x="820" y="225" class="s">按 IP 转发</text>
    <rect x="925" y="155" width="110" height="100" rx="14" class="o"/><text x="980" y="193" class="t">互联网</text><text x="980" y="225" class="s">多跳路由</text>
    <rect x="1075" y="155" width="90" height="100" rx="14" class="b"/><text x="1120" y="193" class="t">服务</text><text x="1120" y="225" class="s">反向解封装</text>
  </g>
  <path d="M185 205H215M375 205H405M545 205H575M715 205H745M885 205H915M1035 205H1065" class="l"/>
  <path d="M1120 285 C900 430 300 430 110 285" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="600" y="375" text-anchor="middle" class="t">响应沿可达路径返回</text>
  <text x="600" y="415" text-anchor="middle" class="s">应用消息 → TCP/QUIC → IP 包 → 链路帧 → 物理信号；接收端反向处理</text>
</svg>
