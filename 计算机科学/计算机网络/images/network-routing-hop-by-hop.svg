<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="530" viewBox="0 0 1150 530">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#2563eb"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:23px;font-weight:700}.s{font-size:15px}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.o{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.l{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1150" height="530" rx="20" fill="#f8fafc"/><text x="575" y="42" text-anchor="middle" class="t">IP 端到端寻址，链路层逐跳重写</text>
  <g text-anchor="middle">
    <rect x="35" y="190" width="180" height="100" rx="12" class="b"/><text x="125" y="227" class="t">客户端 A</text><text x="125" y="255" class="s">IP 10.0.0.2</text><text x="125" y="278" class="s">MAC AA</text>
    <rect x="300" y="190" width="170" height="100" rx="12" class="o"/><text x="385" y="227" class="t">路由器 R1</text><text x="385" y="255" class="s">MAC R1a / R1b</text>
    <rect x="555" y="190" width="170" height="100" rx="12" class="o"/><text x="640" y="227" class="t">路由器 R2</text><text x="640" y="255" class="s">MAC R2a / R2b</text>
    <rect x="810" y="190" width="170" height="100" rx="12" class="o"/><text x="895" y="227" class="t">路由器 R3</text><text x="895" y="255" class="s">MAC R3a / R3b</text>
    <rect x="1030" y="190" width="90" height="100" rx="12" class="b"/><text x="1075" y="227" class="t">服务</text><text x="1075" y="255" class="s">IP 8.8.8.8</text><text x="1075" y="278" class="s">MAC SS</text>
  </g>
  <path d="M215 240H290M470 240H545M725 240H800M980 240H1020" class="l"/>
  <g text-anchor="middle" class="s">
    <text x="255" y="330">AA → R1a</text><text x="510" y="330">R1b → R2a</text><text x="765" y="330">R2b → R3a</text><text x="1000" y="330">R3b → SS</text>
    <text x="575" y="385" class="t">每一跳：去掉旧帧 → TTL - 1 → 查路由表 → 构造新帧</text>
    <text x="575" y="430">IP 源 10.0.0.2、目的 8.8.8.8 保持不变（此图暂不考虑 NAT）</text>
    <text x="575" y="463">MAC 地址只描述当前链路两端，因此随每一跳变化</text>
  </g>
</svg>
