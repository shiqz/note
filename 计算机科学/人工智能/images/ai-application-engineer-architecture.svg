<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#0f172a">AI 应用工程核心架构</text>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">工程目标：让模型能力可用、可靠、可控、可评测、可运维</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" filter="url(#shadow)">
    <rect x="70" y="160" width="220" height="112" rx="18" fill="#ffffff" stroke="#cffafe"/>
    <text x="180" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#0e7490">用户入口</text>
    <text x="180" y="232" text-anchor="middle" font-size="15" fill="#334155">Web / App / API / IM</text>

    <rect x="380" y="160" width="220" height="112" rx="18" fill="#ffffff" stroke="#cffafe"/>
    <text x="490" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#0e7490">业务编排层</text>
    <text x="490" y="232" text-anchor="middle" font-size="15" fill="#334155">鉴权 / 会话 / 路由 / 状态</text>

    <rect x="690" y="160" width="220" height="112" rx="18" fill="#ffffff" stroke="#cffafe"/>
    <text x="800" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#0e7490">模型网关</text>
    <text x="800" y="232" text-anchor="middle" font-size="15" fill="#334155">Prompt / Tool / 限流 / 降级</text>

    <rect x="690" y="340" width="220" height="112" rx="18" fill="#ffffff" stroke="#cffafe"/>
    <text x="800" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#0e7490">LLM 服务</text>
    <text x="800" y="412" text-anchor="middle" font-size="15" fill="#334155">API 模型 / 私有模型 / 多模态</text>

    <rect x="380" y="340" width="220" height="112" rx="18" fill="#ffffff" stroke="#cffafe"/>
    <text x="490" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#0e7490">RAG 检索层</text>
    <text x="490" y="412" text-anchor="middle" font-size="15" fill="#334155">向量库 / BM25 / Rerank</text>

    <rect x="70" y="340" width="220" height="112" rx="18" fill="#ffffff" stroke="#cffafe"/>
    <text x="180" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#0e7490">知识处理层</text>
    <text x="180" y="412" text-anchor="middle" font-size="15" fill="#334155">解析 / 清洗 / 切分 / 索引</text>

    <rect x="960" y="250" width="170" height="292" rx="18" fill="#0f172a" stroke="#164e63"/>
    <text x="1045" y="294" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">横切能力</text>
    <text x="1045" y="340" text-anchor="middle" font-size="15" fill="#ccfbf1">日志追踪</text>
    <text x="1045" y="376" text-anchor="middle" font-size="15" fill="#ccfbf1">模型评测</text>
    <text x="1045" y="412" text-anchor="middle" font-size="15" fill="#ccfbf1">成本监控</text>
    <text x="1045" y="448" text-anchor="middle" font-size="15" fill="#ccfbf1">数据安全</text>
    <text x="1045" y="484" text-anchor="middle" font-size="15" fill="#ccfbf1">灰度发布</text>

    <rect x="170" y="590" width="860" height="108" rx="18" fill="#ffffff" stroke="#cffafe"/>
    <text x="600" y="632" text-anchor="middle" font-size="22" font-weight="700" fill="#0e7490">基础设施</text>
    <text x="600" y="666" text-anchor="middle" font-size="16" fill="#334155">Docker / Kubernetes / Redis / MQ / PostgreSQL / MinIO / Prometheus / Grafana</text>
  </g>

  <g stroke="#0891b2" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="290" y1="216" x2="380" y2="216"/>
    <line x1="600" y1="216" x2="690" y2="216"/>
    <line x1="800" y1="272" x2="800" y2="340"/>
    <path d="M690 396 H600"/>
    <path d="M380 396 H290"/>
    <path d="M180 452 V590"/>
    <path d="M490 452 V590"/>
    <path d="M800 452 V590"/>
    <path d="M910 216 C960 216 960 300 960 300"/>
    <path d="M910 396 C945 396 945 396 960 396"/>
  </g>

  <text x="600" y="760" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">学习时不要只会调 API，要能解释一次请求从入口到模型、检索、评测、监控的完整链路。</text>
</svg>
