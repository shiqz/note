<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Agent 本质：模型在"思考 ↔ 调工具"之间循环，直到能回答</text>

  <!-- 左侧：循环示意 -->
  <rect x="30" y="80" width="440" height="470" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">create_agent 内部循环（LangGraph 驱动）</text>

  <!-- 模型节点 -->
  <rect x="150" y="145" width="200" height="70" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="250" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">模型节点 model</text>
  <text x="250" y="198" text-anchor="middle" font-size="12" fill="#1e40af">LLM 决定：直接回答 or 调工具？</text>

  <!-- 工具节点 -->
  <rect x="150" y="345" width="200" height="70" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="250" y="376" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">工具节点 tools</text>
  <text x="250" y="398" text-anchor="middle" font-size="12" fill="#166534">真正执行：搜索 / 计算 / 查库</text>

  <!-- 向下箭头：tool_calls -->
  <line x1="250" y1="215" x2="250" y2="340" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="250,345 242,333 258,333" fill="#f59e0b"/>
  <text x="330" y="275" font-size="13" font-weight="bold" fill="#d97706">返回 tool_calls</text>
  <text x="330" y="295" font-size="11.5" fill="#b45309">（要调哪个工具、参数是什么）</text>

  <!-- 向上箭头：ToolMessage -->
  <line x1="120" y1="380" x2="120" y2="180" stroke="#16a34a" stroke-width="3"/>
  <line x1="120" y1="180" x2="145" y2="180" stroke="#16a34a" stroke-width="3"/>
  <polygon points="150,180 138,174 138,186" fill="#16a34a"/>
  <text x="60" y="275" font-size="13" font-weight="bold" fill="#15803d">ToolMessage</text>
  <text x="60" y="295" font-size="11.5" fill="#166534">工具结果回灌</text>
  <text x="60" y="313" font-size="11.5" fill="#166534">给模型继续推理</text>

  <!-- 结束出口 -->
  <line x1="350" y1="180" x2="420" y2="180" stroke="#4338ca" stroke-width="3"/>
  <polygon points="425,180 413,174 413,186" fill="#4338ca"/>
  <text x="385" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4338ca">不再调工具</text>
  <rect x="425" y="150" width="40" height="60" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="445" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">输出</text>

  <text x="250" y="465" text-anchor="middle" font-size="12.5" fill="#475569">循环上限：recursion_limit（默认 25 步，防死循环）</text>
  <text x="250" y="495" text-anchor="middle" font-size="12.5" fill="#475569">整个循环由 LangGraph 状态图驱动，状态 = messages 列表</text>
  <text x="250" y="525" text-anchor="middle" font-size="12.5" fill="#475569">@tool 定义工具 → bind_tools 告知模型 → 框架自动执行循环</text>

  <!-- 右侧：消息序列 -->
  <rect x="500" y="80" width="450" height="470" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="725" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">状态 messages：每轮循环追加消息</text>

  <g font-size="12.5">
    <rect x="540" y="135" width="370" height="44" rx="9" fill="#e2e8f0"/>
    <text x="558" y="156" font-weight="bold" fill="#334155">SystemMessage</text>
    <text x="558" y="172" font-size="11" fill="#475569">你是天气助手，可调用 get_weather 工具</text>

    <rect x="540" y="190" width="370" height="44" rx="9" fill="#dbeafe"/>
    <text x="558" y="211" font-weight="bold" fill="#1d4ed8">HumanMessage</text>
    <text x="558" y="227" font-size="11" fill="#1e40af">"北京今天天气怎么样？"</text>

    <rect x="540" y="245" width="370" height="56" rx="9" fill="#fef3c7"/>
    <text x="558" y="266" font-weight="bold" fill="#b45309">AIMessage（含 tool_calls）</text>
    <text x="558" y="282" font-size="11" font-family="Consolas,monospace" fill="#92400e">get_weather(city="北京")</text>
    <text x="558" y="296" font-size="10.5" fill="#92400e">模型不直接编答案，而是请求调工具</text>

    <rect x="540" y="312" width="370" height="56" rx="9" fill="#dcfce7"/>
    <text x="558" y="333" font-weight="bold" fill="#15803d">ToolMessage（工具返回）</text>
    <text x="558" y="349" font-size="11" fill="#166534">{"temp": 28, "weather": "晴", "city": "北京"}</text>
    <text x="558" y="363" font-size="10.5" fill="#166534">框架执行真实函数，结果按 tool_call_id 回传</text>

    <rect x="540" y="379" width="370" height="60" rx="9" fill="#dbeafe"/>
    <text x="558" y="400" font-weight="bold" fill="#1d4ed8">AIMessage（最终回答）</text>
    <text x="558" y="416" font-size="11" fill="#1e40af">"北京今天晴天，气温 28°C，适合出行。"</text>
    <text x="558" y="432" font-size="10.5" fill="#1e40af">模型拿到工具结果后生成自然语言，循环结束</text>
  </g>

  <text x="725" y="480" text-anchor="middle" font-size="12.5" fill="#64748b">关键：工具调用由模型发起（function calling），</text>
  <text x="725" y="502" text-anchor="middle" font-size="12.5" fill="#64748b">框架负责执行与回传——模型只做决策，不碰真实 API</text>
  <text x="725" y="530" text-anchor="middle" font-size="12" fill="#94a3b8">v1 入口：langchain.agents.create_agent（底层即 LangGraph 状态图）</text>
</svg>
