<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">三种常用相似度度量：怎么定义"向量相近"</text>

  <!-- 余弦 -->
  <rect x="40" y="75" width="290" height="330" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="185" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">余弦相似度 Cosine</text>

  <line x1="185" y1="330" x2="185" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="185" y1="330" x2="300" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 向量 a b -->
  <line x1="185" y1="330" x2="265" y2="200" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="265,200 256,205 262,212" fill="#2563eb"/>
  <text x="272" y="205" font-size="13" font-weight="bold" fill="#2563eb">a</text>
  <line x1="185" y1="330" x2="285" y2="270" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="285,270 275,270 279,279" fill="#dc2626"/>
  <text x="290" y="275" font-size="13" font-weight="bold" fill="#dc2626">b</text>
  <!-- 夹角弧 -->
  <path d="M225 315 A42 42 0 0 0 215 288" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="238" y="305" font-size="14" font-weight="bold" fill="#d97706">θ</text>

  <text x="185" y="362" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#1e3a8a">cosθ = (a·b) / (‖a‖‖b‖)</text>
  <text x="185" y="390" text-anchor="middle" font-size="12" fill="#1e40af">只看方向（夹角），不看长度</text>

  <!-- 欧氏 -->
  <rect x="345" y="75" width="290" height="330" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="490" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#15803d">欧氏距离 L2</text>

  <line x1="490" y1="340" x2="490" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="400" y1="340" x2="590" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="440" cy="230" r="7" fill="#2563eb"/>
  <text x="420" y="225" text-anchor="end" font-size="13" font-weight="bold" fill="#2563eb">a</text>
  <circle cx="550" cy="285" r="7" fill="#dc2626"/>
  <text x="568" y="290" font-size="13" font-weight="bold" fill="#dc2626">b</text>
  <line x1="440" y1="230" x2="550" y2="285" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="497" y="245" font-size="13" font-weight="bold" fill="#d97706">d</text>

  <text x="490" y="362" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#14532d">d = √Σ(aᵢ − bᵢ)²</text>
  <text x="490" y="390" text-anchor="middle" font-size="12" fill="#166534">直线距离，同时受方向和模长影响</text>

  <!-- 点积 -->
  <rect x="650" y="75" width="290" height="330" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="795" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">点积 Dot Product</text>

  <line x1="795" y1="330" x2="795" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="700" y1="330" x2="890" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="795" y1="330" x2="860" y2="210" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="860,210 851,215 857,222" fill="#2563eb"/>
  <text x="868" y="215" font-size="13" font-weight="bold" fill="#2563eb">a</text>
  <line x1="795" y1="330" x2="875" y2="255" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="875,255 865,254 870,263" fill="#dc2626"/>
  <text x="884" y="258" font-size="13" font-weight="bold" fill="#dc2626">b</text>
  <!-- 投影 -->
  <line x1="875" y1="255" x2="837" y2="172" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="852" y="180" font-size="11.5" fill="#d97706">b 在 a 上投影</text>

  <text x="795" y="362" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#78350f">a·b = ‖a‖‖b‖cosθ = Σaᵢbᵢ</text>
  <text x="795" y="390" text-anchor="middle" font-size="12" fill="#92400e">夹角 + 模长共同决定；</text>
  <text x="795" y="410" text-anchor="middle" font-size="12" fill="#92400e">向量已归一化时 ≡ 余弦</text>

  <!-- 底部选型建议 -->
  <rect x="40" y="430" width="900" height="105" rx="12" fill="#1e293b"/>
  <text x="65" y="462" font-size="14" font-weight="bold" fill="#f1f5f9">怎么选？</text>
  <text x="65" y="490" font-size="13" fill="#cbd5e1">• 文本语义检索（RAG）：<tspan fill="#6ee7b7" font-weight="bold">余弦相似度</tspan>最常用——只关心语义方向，Embedding 归一化后与点积等价、计算更快</text>
  <text x="65" y="514" font-size="13" fill="#cbd5e1">• 推荐系统/特征向量：<tspan fill="#fcd34d" font-weight="bold">点积/欧氏</tspan>更常见——模长本身携带信息（如用户活跃度、向量置信度）</text>
</svg>
