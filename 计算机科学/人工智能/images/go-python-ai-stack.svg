<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="goCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00add8"/>
      <stop offset="100%" stop-color="#007d9c"/>
    </linearGradient>
    <linearGradient id="pyCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3776ab"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
    <linearGradient id="infraCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">Go / Python 在 AI 技术栈中的分工</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">不是二选一，而是各司其职：Python 做 AI 逻辑，Go 做高并发基础设施</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" filter="url(#shadow)">
    <rect x="60" y="120" width="520" height="580" rx="18" fill="#ffffff" stroke="#7dd3fc"/>
    <rect x="60" y="120" width="520" height="56" rx="18" fill="url(#pyCol)"/>
    <rect x="60" y="150" width="520" height="26" fill="url(#pyCol)"/>
    <text x="320" y="157" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Python 层 · AI 逻辑与实验</text>

    <g font-size="14" fill="#334155">
      <rect x="85" y="195" width="470" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="105" y="220" font-weight="700" fill="#1e40af">数据处理与实验</text>
      <text x="105" y="243" font-size="13" fill="#334155">Pandas · NumPy · Jupyter · Matplotlib · Hugging Face Datasets</text>

      <rect x="85" y="270" width="470" height="62" rx="12" fill="#faf5ff" stroke="#ddd6fe"/>
      <text x="105" y="295" font-weight="700" fill="#6d28d9">模型与 Embedding</text>
      <text x="105" y="318" font-size="13" fill="#334155">PyTorch · Transformers · Sentence-Transformers · 微调(LoRA/QLoRA)</text>

      <rect x="85" y="345" width="470" height="62" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="105" y="370" font-weight="700" fill="#047857">RAG 链路编排</text>
      <text x="105" y="393" font-size="13" fill="#334155">文档解析 · Chunk 切分 · 检索策略 · Rerank · 引用溯源 · LangChain/LlamaIndex</text>

      <rect x="85" y="420" width="470" height="62" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="105" y="445" font-weight="700" fill="#c2410c">Agent 与 Prompt</text>
      <text x="105" y="468" font-size="13" fill="#334155">Prompt 模板管理 · ReAct/Plan-Execute · 工具注册 · 评测脚本(RAGAS)</text>

      <rect x="85" y="495" width="470" height="62" rx="12" fill="#fef2f2" stroke="#fecaca"/>
      <text x="105" y="520" font-weight="700" fill="#b91c1c">AI 业务服务</text>
      <text x="105" y="543" font-size="13" fill="#334155">FastAPI · Pydantic 校验 · 模型客户端封装 · gRPC(grpcio) · 流式 SSE</text>

      <rect x="85" y="570" width="470" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="6,4"/>
      <text x="105" y="598" font-weight="700" fill="#475569">Python 的优势与边界</text>
      <text x="105" y="622" font-size="13" fill="#64748b">✓ AI/ML 生态最完整，库和框架最丰富</text>
      <text x="105" y="644" font-size="13" fill="#64748b">✓ 快速实验、交互式探索、数据处理效率高</text>
      <text x="105" y="666" font-size="13" fill="#64748b">✗ GIL 限制 CPU 并发 · 不适合高并发网关 · 内存占用大</text>
    </g>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" filter="url(#shadow)">
    <rect x="620" y="120" width="520" height="580" rx="18" fill="#ffffff" stroke="#67e8f9"/>
    <rect x="620" y="120" width="520" height="56" rx="18" fill="url(#goCol)"/>
    <rect x="620" y="150" width="520" height="26" fill="url(#goCol)"/>
    <text x="880" y="157" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Go 层 · 高并发基础设施</text>

    <g font-size="14" fill="#334155">
      <rect x="645" y="195" width="470" height="62" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="665" y="220" font-weight="700" fill="#0e7490">LLM API 网关</text>
      <text x="665" y="243" font-size="13" fill="#334155">多模型路由 · 多 Key 轮询 · 限流 · 熔断 · 认证 · 语义缓存 · 流式透传</text>

      <rect x="645" y="270" width="470" height="62" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="665" y="295" font-weight="700" fill="#0e7490">高并发代理与负载均衡</text>
      <text x="665" y="318" font-size="13" fill="#334155">goroutine 海量并发 · 连接池 · 重试退避 · 故障转移 · 请求排队</text>

      <rect x="645" y="345" width="470" height="62" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="665" y="370" font-weight="700" fill="#15803d">工具服务 / gRPC 微服务</text>
      <text x="665" y="393" font-size="13" fill="#334155">订单/物流/业务 API · Agent 工具后端 · 高并发、低延迟、类型安全</text>

      <rect x="645" y="420" width="470" height="62" rx="12" fill="#fffbeb" stroke="#fde68a"/>
      <text x="665" y="445" font-weight="700" fill="#a16207">异步任务与数据管道</text>
      <text x="665" y="468" font-size="13" fill="#334155">Asynq/Machinery · 文档批量处理 Worker · 评测任务调度 · 消费 Kafka</text>

      <rect x="645" y="495" width="470" height="62" rx="12" fill="#fef2f2" stroke="#fecaca"/>
      <text x="665" y="520" font-weight="700" fill="#b91c1c">可观测性与运维工具</text>
      <text x="665" y="543" font-size="13" fill="#334155">Prometheus 指标 · OpenTelemetry Collector · 成本计费 · CLI 运维工具</text>

      <rect x="645" y="570" width="470" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="6,4"/>
      <text x="665" y="598" font-weight="700" fill="#475569">Go 的优势与边界</text>
      <text x="665" y="622" font-size="13" fill="#64748b">✓  goroutine 原生高并发，单进程承载数万连接</text>
      <text x="665" y="644" font-size="13" fill="#64748b">✓ 编译为单二进制、低内存、启动快，适合容器和网关</text>
      <text x="665" y="666" font-size="13" fill="#64748b">✗ AI/ML 库远不如 Python 丰富，不适合写模型训练和 RAG 编排</text>
    </g>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="80" y="720" width="1040" height="78" rx="16" fill="url(#infraCol)"/>
    <text x="600" y="750" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">服务间通信：gRPC（Go ↔ Python） · HTTP/REST · 消息队列（Kafka/Redis Stream）</text>
    <text x="600" y="778" text-anchor="middle" font-size="14" fill="#cbd5e1">基础设施层：PostgreSQL · Qdrant/Milvus · Redis · MinIO · vLLM · Docker · Kubernetes</text>
  </g>
</svg>
