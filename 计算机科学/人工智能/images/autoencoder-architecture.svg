<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="encGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="latentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1000" height="560" rx="16" fill="url(#bgGrad2)"/>
  <text x="500" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">自编码器（Autoencoder）：编码-解码的经典范式</text>

  <!-- 输入层 -->
  <g transform="translate(50, 110)" filter="url(#shadow2)">
    <rect x="0" y="0" width="110" height="320" rx="12" fill="url(#inputGrad)"/>
    <text x="55" y="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">输入 x</text>
    <line x1="15" y1="42" x2="95" y2="42" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <g font-family="monospace" font-size="10" fill="#ffffff">
      <circle cx="55" cy="68" r="10" fill="rgba(255,255,255,0.25)"/>
      <text x="55" y="72" text-anchor="middle">x₁</text>
      <circle cx="55" cy="98" r="10" fill="rgba(255,255,255,0.25)"/>
      <text x="55" y="102" text-anchor="middle">x₂</text>
      <circle cx="55" cy="128" r="10" fill="rgba(255,255,255,0.25)"/>
      <text x="55" y="132" text-anchor="middle">x₃</text>
      <text x="55" y="160" text-anchor="middle" fill="rgba(255,255,255,0.7)">⋮</text>
      <circle cx="55" cy="188" r="10" fill="rgba(255,255,255,0.25)"/>
      <text x="55" y="192" text-anchor="middle">xₙ</text>
    </g>
    <text x="55" y="280" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">维度: 784</text>
    <text x="55" y="300" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">(28×28 图像)</text>
  </g>

  <line x1="160" y1="270" x2="200" y2="270" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- 编码器隐藏层 -->
  <g transform="translate(210, 150)" filter="url(#shadow2)">
    <rect x="0" y="0" width="100" height="240" rx="12" fill="url(#encGrad)"/>
    <text x="50" y="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">编码器</text>
    <text x="50" y="46" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">f_θ</text>
    <line x1="15" y1="58" x2="85" y2="58" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <g font-family="monospace" font-size="9" fill="#ffffff">
      <circle cx="50" cy="82" r="8" fill="rgba(255,255,255,0.25)"/>
      <circle cx="50" cy="106" r="8" fill="rgba(255,255,255,0.25)"/>
      <circle cx="50" cy="130" r="8" fill="rgba(255,255,255,0.25)"/>
      <circle cx="50" cy="154" r="8" fill="rgba(255,255,255,0.25)"/>
      <circle cx="50" cy="178" r="8" fill="rgba(255,255,255,0.25)"/>
    </g>
    <text x="50" y="215" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">线性层 + ReLU</text>
    <text x="50" y="232" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">逐层降维</text>
  </g>

  <line x1="310" y1="270" x2="360" y2="270" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- 潜在向量层（瓶颈） -->
  <g transform="translate(370, 190)" filter="url(#shadow2)">
    <rect x="0" y="0" width="120" height="160" rx="12" fill="url(#latentGrad)" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="60" y="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">潜在空间 z</text>
    <text x="60" y="48" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Bottleneck</text>
    <line x1="15" y1="60" x2="105" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <g font-family="monospace" font-size="10" fill="#ffffff">
      <circle cx="60" cy="84" r="9" fill="rgba(255,255,255,0.3)"/>
      <text x="60" y="88" text-anchor="middle">z₁</text>
      <circle cx="60" cy="108" r="9" fill="rgba(255,255,255,0.3)"/>
      <text x="60" y="112" text-anchor="middle">z₂</text>
      <text x="60" y="132" text-anchor="middle" fill="rgba(255,255,255,0.7)">⋮</text>
      <circle cx="60" cy="148" r="9" fill="rgba(255,255,255,0.3)"/>
      <text x="60" y="152" text-anchor="middle">z_d</text>
    </g>
  </g>

  <line x1="490" y1="270" x2="540" y2="270" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- 解码器隐藏层 -->
  <g transform="translate(550, 150)" filter="url(#shadow2)">
    <rect x="0" y="0" width="100" height="240" rx="12" fill="url(#decGrad)"/>
    <text x="50" y="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">解码器</text>
    <text x="50" y="46" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">g_φ</text>
    <line x1="15" y1="58" x2="85" y2="58" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <g font-family="monospace" font-size="9" fill="#ffffff">
      <circle cx="50" cy="82" r="8" fill="rgba(255,255,255,0.25)"/>
      <circle cx="50" cy="106" r="8" fill="rgba(255,255,255,0.25)"/>
      <circle cx="50" cy="130" r="8" fill="rgba(255,255,255,0.25)"/>
      <circle cx="50" cy="154" r="8" fill="rgba(255,255,255,0.25)"/>
      <circle cx="50" cy="178" r="8" fill="rgba(255,255,255,0.25)"/>
    </g>
    <text x="50" y="215" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">线性层 + ReLU</text>
    <text x="50" y="232" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">逐层升维</text>
  </g>

  <line x1="650" y1="270" x2="700" y2="270" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- 输出层 -->
  <g transform="translate(710, 110)" filter="url(#shadow2)">
    <rect x="0" y="0" width="110" height="320" rx="12" fill="url(#outGrad)"/>
    <text x="55" y="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">重建 x̂</text>
    <line x1="15" y1="42" x2="95" y2="42" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <g font-family="monospace" font-size="10" fill="#ffffff">
      <circle cx="55" cy="68" r="10" fill="rgba(255,255,255,0.25)"/>
      <text x="55" y="72" text-anchor="middle">x̂₁</text>
      <circle cx="55" cy="98" r="10" fill="rgba(255,255,255,0.25)"/>
      <text x="55" y="102" text-anchor="middle">x̂₂</text>
      <circle cx="55" cy="128" r="10" fill="rgba(255,255,255,0.25)"/>
      <text x="55" y="132" text-anchor="middle">x̂₃</text>
      <text x="55" y="160" text-anchor="middle" fill="rgba(255,255,255,0.7)">⋮</text>
      <circle cx="55" cy="188" r="10" fill="rgba(255,255,255,0.25)"/>
      <text x="55" y="192" text-anchor="middle">x̂ₙ</text>
    </g>
    <text x="55" y="280" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">维度: 784</text>
    <text x="55" y="300" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">(重建图像)</text>
  </g>

  <!-- 损失函数反馈 -->
  <path d="M 765 430 Q 765 490 500 490 Q 235 490 235 430" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrow2)"/>
  <g transform="translate(400, 475)">
    <rect x="0" y="0" width="200" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="100" y="18" font-family="Georgia, serif" font-size="12" fill="#991b1b" text-anchor="middle">重建损失 L = ‖x - x̂‖²</text>
    <text x="100" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">反向传播同时更新 θ 和 φ</text>
  </g>

  <!-- 维度变化标注 -->
  <g transform="translate(50, 80)">
    <text x="55" y="0" font-family="monospace" font-size="11" fill="#6366f1" text-anchor="middle" font-weight="bold">784 维</text>
  </g>
  <g transform="translate(210, 120)">
    <text x="50" y="0" font-family="monospace" font-size="11" fill="#ec4899" text-anchor="middle" font-weight="bold">256 → 64</text>
  </g>
  <g transform="translate(370, 160)">
    <text x="60" y="0" font-family="monospace" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="bold">d = 32</text>
  </g>
  <g transform="translate(550, 120)">
    <text x="50" y="0" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">64 → 256</text>
  </g>
  <g transform="translate(710, 80)">
    <text x="55" y="0" font-family="monospace" font-size="11" fill="#059669" text-anchor="middle" font-weight="bold">784 维</text>
  </g>

  <!-- 底部关键洞察 -->
  <g transform="translate(100, 525)">
    <text x="400" y="0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#475569" text-anchor="middle">
      核心思想：强制网络通过窄瓶颈重建输入，迫使 z 学习数据中最关键的语义特征
    </text>
  </g>
</svg>
