<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="boss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4f46e5"/>
    </marker>
    <marker id="ar4g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#bg4)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">多 Agent 协作的四种编排模式</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">多 Agent 解决的是"单 Agent 上下文过载 + 专业分工"问题；模式没有优劣，只有是否匹配任务结构</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" filter="url(#shadow4)">
    <!-- 卡片 1：主管模式 -->
    <rect x="56" y="116" width="530" height="286" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="321" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">① 主管模式 Supervisor</text>
    <text x="321" y="174" text-anchor="middle" font-size="12.5" fill="#64748b">主管 Agent 统一分派任务、汇总结果，专家 Agent 各管一摊</text>

    <rect x="246" y="192" width="150" height="50" rx="12" fill="url(#boss)"/>
    <text x="321" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">主管 Agent</text>
    <text x="321" y="234" text-anchor="middle" font-size="10.5" fill="#e0e7ff">规划 · 分派 · 汇总</text>

    <rect x="90" y="300" width="140" height="58" rx="11" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="160" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">检索 Agent</text>
    <text x="160" y="344" text-anchor="middle" font-size="10.5" fill="#059669">搜索 / 查资料</text>

    <rect x="251" y="300" width="140" height="58" rx="11" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="321" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">计算 Agent</text>
    <text x="321" y="344" text-anchor="middle" font-size="10.5" fill="#059669">代码 / 数据分析</text>

    <rect x="412" y="300" width="140" height="58" rx="11" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="482" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">操作 Agent</text>
    <text x="482" y="344" text-anchor="middle" font-size="10.5" fill="#059669">写文件 / 调 API</text>

    <g stroke="#4f46e5" stroke-width="2" fill="none">
      <line x1="292" y1="242" x2="178" y2="298" marker-end="url(#ar4)"/>
      <line x1="321" y1="242" x2="321" y2="298" marker-end="url(#ar4)"/>
      <line x1="350" y1="242" x2="464" y2="298" marker-end="url(#ar4)"/>
    </g>
    <text x="321" y="280" text-anchor="middle" font-size="10.5" fill="#4f46e5">↓ 分派任务　　↑ 上报结果</text>
    <text x="321" y="384" text-anchor="middle" font-size="11.5" fill="#64748b">最常用模式：中心化控制，路由清晰，便于加权限和审计</text>

    <!-- 卡片 2：流水线模式 -->
    <rect x="614" y="116" width="530" height="286" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="879" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">② 流水线模式 Pipeline</text>
    <text x="879" y="174" text-anchor="middle" font-size="12.5" fill="#64748b">任务沿固定顺序传递，前一个 Agent 的输出是后一个的输入</text>

    <rect x="654" y="238" width="140" height="64" rx="11" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="724" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">研究员 Agent</text>
    <text x="724" y="285" text-anchor="middle" font-size="10.5" fill="#4f46e5">检索 · 收集资料</text>

    <rect x="809" y="238" width="140" height="64" rx="11" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="879" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">写作员 Agent</text>
    <text x="879" y="285" text-anchor="middle" font-size="10.5" fill="#4f46e5">起草 · 组织内容</text>

    <rect x="964" y="238" width="140" height="64" rx="11" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="1034" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">审校员 Agent</text>
    <text x="1034" y="285" text-anchor="middle" font-size="10.5" fill="#4f46e5">校对 · 润色</text>

    <g stroke="#4f46e5" stroke-width="2.5" fill="none">
      <line x1="794" y1="270" x2="807" y2="270" marker-end="url(#ar4)"/>
      <line x1="949" y1="270" x2="962" y2="270" marker-end="url(#ar4)"/>
    </g>
    <text x="879" y="344" text-anchor="middle" font-size="11.5" fill="#64748b">适合流程固定、可线性拆分的任务（如：调研 → 写稿 → 审稿）</text>
    <text x="879" y="372" text-anchor="middle" font-size="11.5" fill="#059669">可控性最高：每步可检查、可重试、可单独替换</text>

    <!-- 卡片 3：层级模式 -->
    <rect x="56" y="426" width="530" height="286" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="321" y="460" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">③ 层级模式 Hierarchical</text>
    <text x="321" y="484" text-anchor="middle" font-size="12.5" fill="#64748b">树形管理，每层只对上级负责，适合大规模任务的逐层拆解</text>

    <rect x="241" y="506" width="160" height="46" rx="11" fill="url(#boss)"/>
    <text x="321" y="535" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">项目经理 Agent</text>

    <rect x="151" y="587" width="130" height="44" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="216" y="614" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">研发组长 Agent</text>

    <rect x="361" y="587" width="130" height="44" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="426" y="614" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">测试组长 Agent</text>

    <rect x="78" y="660" width="96" height="40" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="126" y="685" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">前端</text>

    <rect x="198" y="660" width="96" height="40" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="246" y="685" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">后端</text>

    <rect x="348" y="660" width="96" height="40" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="396" y="685" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">用例设计</text>

    <rect x="468" y="660" width="96" height="40" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="516" y="685" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">回归执行</text>

    <g stroke="#4f46e5" stroke-width="1.8" fill="none">
      <line x1="290" y1="552" x2="230" y2="585" marker-end="url(#ar4)"/>
      <line x1="352" y1="552" x2="412" y2="585" marker-end="url(#ar4)"/>
      <line x1="196" y1="631" x2="140" y2="658" marker-end="url(#ar4)"/>
      <line x1="236" y1="631" x2="240" y2="658" marker-end="url(#ar4)"/>
      <line x1="406" y1="631" x2="398" y2="658" marker-end="url(#ar4)"/>
      <line x1="446" y1="631" x2="500" y2="658" marker-end="url(#ar4)"/>
    </g>

    <!-- 卡片 4：网络模式 -->
    <rect x="614" y="426" width="530" height="286" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="879" y="460" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">④ 网络模式 Network（对等协作）</text>
    <text x="879" y="484" text-anchor="middle" font-size="12.5" fill="#64748b">去中心化，Agent 间按需自由通信，靠共享"黑板"传递状态</text>

    <!-- 网状连线 -->
    <g stroke="#cbd5e1" stroke-width="1.8" fill="none">
      <line x1="879" y1="558" x2="748" y2="590"/>
      <line x1="879" y1="558" x2="1010" y2="590"/>
      <line x1="734" y1="628" x2="786" y2="666"/>
      <line x1="1024" y1="628" x2="972" y2="666"/>
      <line x1="818" y1="700" x2="940" y2="700"/>
      <line x1="760" y1="600" x2="998" y2="600"/>
      <line x1="872" y1="558" x2="810" y2="668"/>
      <line x1="886" y1="558" x2="950" y2="668"/>
    </g>

    <rect x="829" y="514" width="100" height="44" rx="22" fill="url(#boss)"/>
    <text x="879" y="542" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">客服 Agent</text>

    <rect x="684" y="584" width="100" height="44" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="734" y="612" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4338ca">技术 Agent</text>

    <rect x="974" y="584" width="100" height="44" rx="22" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="1024" y="612" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4338ca">销售 Agent</text>

    <rect x="744" y="678" width="100" height="44" rx="22" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="794" y="706" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">售后 Agent</text>

    <rect x="914" y="678" width="100" height="44" rx="22" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="964" y="706" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">数据 Agent</text>

    <text x="879" y="748" text-anchor="middle" font-size="11.5" fill="#b91c1c">最灵活但最难调试：链路不确定，需更强的追踪与步数约束</text>
  </g>

  <!-- 底部总结条 -->
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="56" y="742" width="1088" height="86" rx="16" fill="#0f172a" opacity="0.95"/>
    <text x="600" y="774" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">选型原则：能用单 Agent 就别上多 Agent</text>
    <text x="600" y="802" text-anchor="middle" font-size="13.5" fill="#cbd5e1">多 Agent 的收益是"上下文隔离 + 专业分工"，代价是协调成本、Token 消耗、延迟和不确定性的层层叠加。</text>
    <text x="600" y="824" text-anchor="middle" font-size="12.5" fill="#a5b4fc">建议路径：固定流程 → 流水线；需要动态分派 → 主管模式；任务规模大 → 层级；探索性协作 → 网络模式。</text>
  </g>
</svg>
