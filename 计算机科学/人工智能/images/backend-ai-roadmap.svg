    <linearGradient id="pyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3776ab"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
  <text x="700" y="56" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#0f172a">后端开发者 AI 学习路线全景</text>
  <text x="700" y="92" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">发挥 Go/Python 后端优势，从工程视角切入 AI，5~7 个月成为 AI 应用架构师</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
