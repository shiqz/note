      <text x="780" y="614" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">消息队列 / 工作流</text>
      <text x="780" y="638" text-anchor="middle" font-size="13" fill="#334155">→ Agent 编排、异步推理</text>
      <text x="780" y="654" text-anchor="middle" font-size="13" fill="#334155">→ 状态机、人工介入点</text>
    </g>
    <g>
