      <text x="1224" y="310" font-size="13" fill="#334155">• LLM可观测性</text>
      <text x="1224" y="334" font-size="13" fill="#334155">• Trace/Token/成本</text>
      <text x="1224" y="358" font-size="13" fill="#334155">• 评测驱动/CI回归</text>
      <text x="1224" y="382" font-size="13" fill="#334155">• Prompt注入防御</text>
      <text x="1224" y="406" font-size="13" fill="#334155">• A/B测试/灰度</text>
      <text x="1224" y="430" font-size="13" fill="#334155">• 数据飞轮/合规</text>
