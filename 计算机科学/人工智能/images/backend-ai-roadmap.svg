      <text x="490" y="638" text-anchor="middle" font-size="13" fill="#334155">→ 向量数据库、ANN 索引</text>
      <text x="490" y="654" text-anchor="middle" font-size="13" fill="#334155">→ 混合检索、分片一致性</text>
    </g>
    <g>
