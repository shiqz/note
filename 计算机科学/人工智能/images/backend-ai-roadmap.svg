      <text x="56" y="334" font-size="13" fill="#334155">• Python 数据科学生态</text>
      <text x="56" y="358" font-size="13" fill="#334155">• NumPy / Pandas</text>
      <text x="56" y="382" font-size="13" fill="#334155">• 线性代数/概率直觉</text>
      <text x="56" y="406" font-size="13" fill="#334155">• GPU/显存基础认知</text>
      <text x="56" y="430" font-size="13" fill="#334155">• Conda/Jupyter</text>
