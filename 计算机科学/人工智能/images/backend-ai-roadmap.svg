      <text x="446" y="334" font-size="13" fill="#334155">• 重试/限流/熔断/降级</text>
      <text x="446" y="358" font-size="13" fill="#334155">• Prompt 工程化</text>
      <text x="446" y="382" font-size="13" fill="#334155">• 结构化输出/Function Call</text>
      <text x="446" y="406" font-size="13" fill="#334155">• SSE流式响应</text>
      <text x="446" y="430" font-size="13" fill="#334155">• 上下文管理/Token预算</text>
      <rect x="446" y="450" width="56" height="24" rx="12" fill="url(#goGrad)"/>
