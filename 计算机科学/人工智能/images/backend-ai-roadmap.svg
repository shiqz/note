      <text x="930" y="808" font-size="12" fill="#94a3b8">评测 · 灰度 · 安全 · 成本优化</text>
    </g>

    <line x1="80" y1="830" x2="1320" y2="830" stroke="#334155" stroke-width="1"/>
    <text x="700" y="852" text-anchor="middle" font-size="14" fill="#cbd5e1">核心原则：不要只证明你会调 API，要证明你能把 AI 做成可靠的软件系统。</text>
