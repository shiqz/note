    <line x1="410" y1="345" x2="430" y2="345"/>
    <line x1="605" y1="345" x2="625" y2="345"/>
    <line x1="800" y1="345" x2="820" y2="345"/>
    <line x1="995" y1="345" x2="1015" y2="345"/>
    <line x1="1190" y1="345" x2="1210" y2="345"/>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
