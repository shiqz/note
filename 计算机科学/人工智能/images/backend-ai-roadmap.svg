  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="40" y="710" width="1320" height="150" rx="18" fill="#0f172a" opacity="0.94"/>
    <text x="700" y="748" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">实战项目里程碑（每个都要可运行、可测试、可部署）</text>

    <g fill="#e2e8f0" font-size="14">
      <text x="80" y="786">① 工单分类器</text>
      <text x="80" y="808" font-size="12" fill="#94a3b8">Prompt工程 · 结构化输出 · 评测</text>

      <text x="290" y="786">② 企业知识库 RAG</text>
      <text x="290" y="808" font-size="12" fill="#94a3b8">文档处理 · 混合检索 · 权限溯源</text>

      <text x="530" y="786">③ 售后 Agent</text>
      <text x="530" y="808" font-size="12" fill="#94a3b8">工具调用 · 状态管理 · 安全确认</text>

      <text x="720" y="786">④ Go LLM 网关</text>
      <text x="720" y="808" font-size="12" fill="#94a3b8">多模型路由 · 限流缓存 · 监控</text>

