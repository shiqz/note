<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <marker id="ca2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Chroma 数据模型：Client → Collection → 记录四要素</text>

  <!-- Client -->
  <rect x="60" y="80" width="180" height="70" rx="12" fill="#1e293b"/>
  <text x="150" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#f1f5f9">Client</text>
  <text x="150" y="134" text-anchor="middle" font-size="11.5" fill="#94a3b8">PersistentClient()</text>

  <line x1="240" y1="115" x2="300" y2="115" stroke="#64748b" stroke-width="2.5" marker-end="url(#ca2)"/>

  <!-- Collections -->
  <rect x="300" y="65" width="620" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="610" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Collections（集合：类似关系库的"表"，互相隔离）</text>
  <rect x="325" y="105" width="170" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="410" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">docs_知识库</text>
  <rect x="525" y="105" width="170" height="42" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="610" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">products_商品</text>
  <rect x="725" y="105" width="170" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="810" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">faq_问答对</text>

  <line x1="410" y1="167" x2="410" y2="205" stroke="#64748b" stroke-width="2.5" marker-end="url(#ca2)"/>

  <!-- 记录四要素 -->
  <rect x="80" y="210" width="660" height="310" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">一条记录（Record）的四个字段</text>

  <!-- id -->
  <rect x="110" y="262" width="290" height="56" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="125" y="286" font-size="13" font-weight="bold" fill="#991b1b">id（必填，唯一主键）</text>
  <text x="125" y="306" font-size="11.5" font-family="Consolas,monospace" fill="#7f1d1d">"doc-001"　字符串，自己指定</text>

  <!-- document -->
  <rect x="420" y="262" width="290" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="435" y="286" font-size="13" font-weight="bold" fill="#1e3a8a">document（原文文本）</text>
  <text x="435" y="306" font-size="11.5" font-family="Consolas,monospace" fill="#1e40af">"年假政策：正式员工 10 天…"</text>

  <!-- metadata -->
  <rect x="110" y="334" width="290" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="125" y="358" font-size="13" font-weight="bold" fill="#92400e">metadata（元数据字典）</text>
  <text x="125" y="378" font-size="11.5" font-family="Consolas,monospace" fill="#78350f">{"dept":"人事", "year":2025}</text>
  <text x="125" y="397" font-size="11" fill="#a16207">值只能是 str / int / float / bool</text>

  <!-- embedding -->
  <rect x="420" y="334" width="290" height="76" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="435" y="358" font-size="13" font-weight="bold" fill="#14532d">embedding（向量）</text>
  <text x="435" y="378" font-size="11.5" font-family="Consolas,monospace" fill="#166534">[0.023, -0.87, 0.41, …] 384/1024 维</text>
  <text x="435" y="397" font-size="11" fill="#15803d">可不传 → 由 Embedding Function 自动生成</text>

  <!-- 关键提示 -->
  <rect x="110" y="430" width="600" height="62" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="130" y="456" font-size="12.5" fill="#14532d">✓ add 时只传 documents，Chroma 会<tspan font-weight="bold">自动调用 Embedding Function</tspan> 生成向量；</text>
  <text x="130" y="478" font-size="12.5" fill="#14532d">✓ 同一个 Collection 内向量维度必须一致；查询和入库必须用同一个 Embedding 模型。</text>

  <!-- 右侧配置 -->
  <rect x="760" y="210" width="180" height="310" rx="14" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <text x="850" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">Collection 配置</text>
  <text x="780" y="275" font-size="12" fill="#6b21a8">metadata：</text>
  <text x="780" y="298" font-size="11" font-family="Consolas,monospace" fill="#7e22ce">{"hnsw:space":</text>
  <text x="790" y="316" font-size="11" font-family="Consolas,monospace" fill="#7e22ce">"cosine"}</text>
  <text x="780" y="346" font-size="12" fill="#6b21a8">距离度量：</text>
  <text x="790" y="368" font-size="11.5" fill="#7e22ce">• l2（默认，平方欧氏）</text>
  <text x="790" y="388" font-size="11.5" fill="#7e22ce">• cosine（RAG 推荐）</text>
  <text x="790" y="408" font-size="11.5" fill="#7e22ce">• ip（点积）</text>
  <text x="780" y="440" font-size="11.5" fill="#7e22ce">hnsw:M</text>
  <text x="780" y="460" font-size="11.5" fill="#7e22ce">hnsw:construction_ef</text>
  <text x="780" y="480" font-size="11.5" fill="#7e22ce">hnsw:search_ef</text>
  <text x="780" y="504" font-size="11" fill="#a855f7">创建后不可改度量，改需重建</text>
</svg>
