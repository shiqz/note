<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.t{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 17px Arial,sans-serif;fill:#172554}.p{font:15px Arial,sans-serif;fill:#334155}.l{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="550" fill="#f8fafc"/><text x="600" y="45" class="t" text-anchor="middle">多头注意力：在多个表示子空间并行学习不同的关联模式</text>
  <rect x="55" y="210" width="180" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145" y="250" class="h" text-anchor="middle">输入 X</text><text x="145" y="278" class="p" text-anchor="middle">(n, d_model)</text>
  <path d="M235 260 H320" class="l"/>
  <text x="278" y="242" class="p" text-anchor="middle">分别投影</text>
  <g><rect x="350" y="100" width="190" height="80" rx="9" fill="#fef3c7" stroke="#d97706"/><text x="445" y="132" class="h" text-anchor="middle">Head 1</text><text x="445" y="158" class="p" text-anchor="middle">Attention(Q1,K1,V1)</text><rect x="350" y="220" width="190" height="80" rx="9" fill="#f3e8ff" stroke="#9333ea"/><text x="445" y="252" class="h" text-anchor="middle">Head 2</text><text x="445" y="278" class="p" text-anchor="middle">Attention(Q2,K2,V2)</text><rect x="350" y="340" width="190" height="80" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="445" y="372" class="h" text-anchor="middle">Head h</text><text x="445" y="398" class="p" text-anchor="middle">Attention(Qh,Kh,Vh)</text></g>
  <path d="M540 140 H650 M540 260 H650 M540 380 H650" class="l"/>
  <rect x="680" y="185" width="175" height="150" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="767" y="227" class="h" text-anchor="middle">Concat</text><text x="767" y="260" class="p" text-anchor="middle">拼接各头输出</text><text x="767" y="292" class="p" text-anchor="middle">(n, h * dv)</text>
  <path d="M855 260 H935" class="l"/><text x="895" y="242" class="p" text-anchor="middle">WO</text>
  <rect x="965" y="210" width="180" height="100" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="1055" y="250" class="h" text-anchor="middle">输出</text><text x="1055" y="278" class="p" text-anchor="middle">(n, d_model)</text>
  <text x="600" y="495" class="p" text-anchor="middle">常见设置：d_model = h * d_head。不同头可分别学习局部关系、语法依赖、指代关系或长距离语义，但不能简单把每个头解释为固定的人类语言规则。</text>
</svg>
