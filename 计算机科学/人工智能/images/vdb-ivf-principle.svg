<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">IVF 索引原理：先聚类分桶，查询只搜最近的几个桶</text>

  <!-- 聚类空间 -->
  <rect x="50" y="80" width="560" height="400" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="330" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">向量空间被 K-Means 划分为 nlist 个簇（Voronoi 分区）</text>

  <!-- 簇底色 -->
  <ellipse cx="200" cy="220" rx="130" ry="100" fill="#dbeafe" opacity="0.7"/>
  <ellipse cx="430" cy="210" rx="120" ry="95" fill="#dcfce7" opacity="0.7"/>
  <ellipse cx="320" cy="390" rx="140" ry="80" fill="#fef3c7" opacity="0.7"/>

  <!-- 质心 -->
  <rect x="188" y="200" width="24" height="24" rx="4" fill="#2563eb"/>
  <text x="200" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">C1</text>
  <rect x="418" y="190" width="24" height="24" rx="4" fill="#16a34a"/>
  <text x="430" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">C2</text>
  <rect x="308" y="370" width="24" height="24" rx="4" fill="#d97706"/>
  <text x="320" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">C3</text>

  <!-- 数据点 -->
  <g fill="#60a5fa">
    <circle cx="150" cy="170" r="5"/><circle cx="240" cy="180" r="5"/><circle cx="170" cy="260" r="5"/>
    <circle cx="260" cy="270" r="5"/><circle cx="120" cy="230" r="5"/><circle cx="220" cy="240" r="5"/>
    <circle cx="270" cy="220" r="5"/>
  </g>
  <g fill="#4ade80">
    <circle cx="380" cy="170" r="5"/><circle cx="470" cy="180" r="5"/><circle cx="400" cy="260" r="5"/>
    <circle cx="490" cy="250" r="5"/><circle cx="450" cy="290" r="5"/><circle cx="360" cy="220" r="5"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="260" cy="380" r="5"/><circle cx="350" cy="420" r="5"/><circle cx="390" cy="370" r="5"/>
    <circle cx="300" cy="430" r="5"/><circle cx="400" cy="420" r="5"/><circle cx="240" cy="420" r="5"/>
  </g>

  <!-- 查询点 -->
  <text x="368" y="252" text-anchor="middle" font-size="20" fill="#dc2626">★</text>
  <text x="380" y="248" font-size="12.5" font-weight="bold" fill="#dc2626">查询 q</text>
  <!-- q 到各质心距离 -->
  <line x1="370" y1="246" x2="212" y2="216" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="370" y1="246" x2="420" y2="208" stroke="#dc2626" stroke-width="2"/>
  <line x1="370" y1="246" x2="322" y2="372" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="285" y="225" font-size="11" fill="#94a3b8">远</text>
  <text x="400" y="232" font-size="11" font-weight="bold" fill="#dc2626">最近</text>
  <text x="330" y="320" font-size="11" fill="#94a3b8">远</text>

  <text x="330" y="465" text-anchor="middle" font-size="12.5" fill="#475569">查询时：q 先与所有质心比距离 → 只在最近的 nprobe 个簇内做精确搜索</text>

  <!-- 右侧说明 -->
  <rect x="640" y="80" width="300" height="400" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="790" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">关键参数与权衡</text>

  <text x="665" y="158" font-size="13.5" font-weight="bold" fill="#92400e">nlist（簇数量）</text>
  <text x="665" y="182" font-size="12.5" fill="#78350f">建索引时 K-Means 聚多少类</text>
  <text x="665" y="202" font-size="12.5" fill="#78350f">经验值：√N ~ 4√N（N 为向量数）</text>

  <text x="665" y="244" font-size="13.5" font-weight="bold" fill="#92400e">nprobe（探测簇数）</text>
  <text x="665" y="268" font-size="12.5" fill="#78350f">查询时搜索最近的几个簇</text>
  <text x="665" y="288" font-size="12.5" fill="#78350f">↑ nprobe 越大：召回越高、速度越慢</text>

  <!-- 权衡条 -->
  <text x="665" y="330" font-size="12.5" fill="#78350f">nprobe = 1</text>
  <rect x="665" y="342" width="230" height="14" rx="7" fill="#fde68a"/>
  <rect x="665" y="342" width="60" height="14" rx="7" fill="#ef4444"/>
  <rect x="835" y="342" width="60" height="14" rx="7" fill="#22c55e"/>
  <text x="665" y="372" font-size="12.5" fill="#b91c1c">快但可能漏（边界点在相邻簇）</text>
  <text x="895" y="372" text-anchor="end" font-size="12.5" fill="#15803d">慢但准</text>
  <text x="895" y="400" text-anchor="end" font-size="12.5" fill="#92400e">nprobe = nlist（全搜）</text>

  <rect x="665" y="418" width="250" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="790" y="438" text-anchor="middle" font-size="12" fill="#92400e">常与 PQ 量化组合成 IVF_PQ：</text>
  <text x="790" y="456" text-anchor="middle" font-size="12" fill="#92400e">先缩小范围，再压缩向量算距离</text>
</svg>
