<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <marker id="arrow6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9f1239"/>
    </marker>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="540" rx="16" fill="url(#bgGrad6)"/>
  <text x="500" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#9f1239" text-anchor="middle">信息瓶颈：向量维度、重建质量与语义保留的权衡</text>

  <!-- 左侧：维度漏斗 -->
  <g transform="translate(40, 80)">
    <text x="180" y="0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#881337" text-anchor="middle">编码：维度压缩的信息漏斗</text>

    <!-- 原始数据 -->
    <rect x="20" y="20" width="320" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="180" y="45" font-family="monospace" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">原始数据 x</text>
    <text x="180" y="65" font-family="monospace" font-size="11" fill="#1d4ed8" text-anchor="middle">图像: 3×224×224 = 150,528 维 · 文本: 1024×768 = 786,432 维</text>

    <!-- 箭头压缩 -->
    <path d="M 180 80 L 140 110 L 220 110 Z" fill="#94a3b8"/>

    <!-- 高维向量 -->
    <rect x="50" y="115" width="260" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="180" y="137" font-family="monospace" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="bold">高维向量 d=4096</text>
    <text x="180" y="155" font-family="monospace" font-size="10" fill="#4338ca" text-anchor="middle">保留细节多 · 存储成本高 · 检索慢</text>

    <path d="M 180 165 L 150 190 L 210 190 Z" fill="#94a3b8"/>

    <!-- 中等向量 -->
    <rect x="80" y="195" width="200" height="50" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="180" y="217" font-family="monospace" font-size="11" fill="#9d174d" text-anchor="middle" font-weight="bold">中等向量 d=768</text>
    <text x="180" y="235" font-family="monospace" font-size="10" fill="#be185d" text-anchor="middle">语义与效率的平衡点（最常用）</text>

    <path d="M 180 245 L 160 270 L 200 270 Z" fill="#94a3b8"/>

    <!-- 低维向量 -->
    <rect x="110" y="275" width="140" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="180" y="297" font-family="monospace" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold">低维向量 d=128</text>
    <text x="180" y="315" font-family="monospace" font-size="10" fill="#b45309" text-anchor="middle">存储省 · 检索快 · 细节丢失多</text>

    <path d="M 180 325 L 165 350 L 195 350 Z" fill="#94a3b8"/>

    <!-- 极低维 -->
    <rect x="140" y="355" width="80" height="45" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="180" y="378" font-family="monospace" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="bold">d=8~32</text>
    <text x="180" y="393" font-family="monospace" font-size="9" fill="#b91c1c" text-anchor="middle">信息瓶颈</text>
  </g>

  <!-- 右侧：质量-维度曲线 -->
  <g transform="translate(430, 80)" filter="url(#shadow6)">
    <rect x="0" y="0" width="530" height="400" rx="14" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
    <text x="265" y="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#9f1239" text-anchor="middle">重建质量 vs 向量维度</text>

    <!-- 坐标轴 -->
    <line x1="60" y1="340" x2="490" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="60" y1="340" x2="60" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="490" y="360" font-family="monospace" font-size="11" fill="#64748b">向量维度 d</text>
    <text x="30" y="65" font-family="monospace" font-size="11" fill="#64748b" transform="rotate(-90, 30, 65)">质量</text>

    <!-- 轴刻度 -->
    <g font-family="monospace" font-size="9" fill="#94a3b8">
      <text x="60" y="358" text-anchor="middle">8</text>
      <text x="160" y="358" text-anchor="middle">128</text>
      <text x="280" y="358" text-anchor="middle">768</text>
      <text x="400" y="358" text-anchor="middle">2048</text>
      <text x="480" y="358" text-anchor="middle">4096</text>

      <text x="50" y="340" text-anchor="end">低</text>
      <text x="50" y="200" text-anchor="end">中</text>
      <text x="50" y="70" text-anchor="end">高</text>
    </g>

    <!-- 重建质量曲线（PSNR/SSIM） -->
    <path d="M 60 320 Q 120 280 160 200 Q 220 120 280 90 Q 350 75 480 70"
          fill="none" stroke="#ec4899" stroke-width="3"/>
    <text x="350" y="100" font-family="monospace" font-size="11" fill="#be185d" font-weight="bold">重建质量</text>

    <!-- 语义检索质量曲线 -->
    <path d="M 60 300 Q 120 200 160 130 Q 220 90 280 80 Q 350 75 480 75"
          fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="200" y="145" font-family="monospace" font-size="11" fill="#1d4ed8" font-weight="bold">语义检索质量</text>

    <!-- 存储/计算成本曲线 -->
    <path d="M 60 330 L 160 310 L 280 250 L 400 160 L 480 100"
          fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="2,3"/>
    <text x="380" y="240" font-family="monospace" font-size="11" fill="#b45309" font-weight="bold">存储与计算成本</text>

    <!-- 甜点区域 -->
    <rect x="220" y="60" width="120" height="280" fill="#22c55e" opacity="0.08"/>
    <text x="280" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">工程甜点区 (256~1024)</text>
  </g>

  <!-- 底部关键洞察 -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="880" height="30" rx="8" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
    <text x="440" y="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9f1239" text-anchor="middle">
      关键认知：<tspan font-weight="bold">检索场景不要求无损解码</tspan>——768 维向量足以保留语义相似性，而生成场景需要更多维度保留细节
    </text>
  </g>
</svg>
