<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.t{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 17px Arial,sans-serif;fill:#172554}.p{font:15px Arial,sans-serif;fill:#334155}.l{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.c{stroke:#fff;stroke-width:2}</style></defs>
  <rect width="1200" height="540" fill="#f8fafc"/><text x="600" y="45" class="t" text-anchor="middle">缩放点积注意力：分数矩阵的每一行是一处 Query 对全部 Key 的关注</text>
  <rect x="50" y="150" width="180" height="150" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="140" y="195" class="h" text-anchor="middle">Q</text><text x="140" y="228" class="p" text-anchor="middle">(n, dk)</text><text x="140" y="258" class="p" text-anchor="middle">n 个查询</text>
  <path d="M230 225 H315" class="l"/><text x="272" y="206" class="p" text-anchor="middle">乘 K^T</text>
  <rect x="340" y="105" width="265" height="265" rx="9" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="472" y="137" class="h" text-anchor="middle">S = QK^T / sqrt(dk)</text>
  <g class="c"><rect x="380" y="165" width="45" height="45" fill="#c4b5fd"/><rect x="425" y="165" width="45" height="45" fill="#ede9fe"/><rect x="470" y="165" width="45" height="45" fill="#ddd6fe"/><rect x="515" y="165" width="45" height="45" fill="#f3e8ff"/><rect x="380" y="210" width="45" height="45" fill="#f3e8ff"/><rect x="425" y="210" width="45" height="45" fill="#8b5cf6"/><rect x="470" y="210" width="45" height="45" fill="#ede9fe"/><rect x="515" y="210" width="45" height="45" fill="#ddd6fe"/><rect x="380" y="255" width="45" height="45" fill="#ddd6fe"/><rect x="425" y="255" width="45" height="45" fill="#f3e8ff"/><rect x="470" y="255" width="45" height="45" fill="#7c3aed"/><rect x="515" y="255" width="45" height="45" fill="#ede9fe"/><rect x="380" y="300" width="45" height="45" fill="#ede9fe"/><rect x="425" y="300" width="45" height="45" fill="#ddd6fe"/><rect x="470" y="300" width="45" height="45" fill="#f3e8ff"/><rect x="515" y="300" width="45" height="45" fill="#a78bfa"/></g>
  <text x="472" y="397" class="p" text-anchor="middle">shape: (n, n)</text>
  <path d="M605 237 H690" class="l"/><text x="647" y="216" class="p" text-anchor="middle">softmax(每行)</text>
  <rect x="715" y="150" width="180" height="150" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="805" y="195" class="h" text-anchor="middle">A：注意力权重</text><text x="805" y="228" class="p" text-anchor="middle">(n, n)</text><text x="805" y="258" class="p" text-anchor="middle">每行和为 1</text>
  <path d="M895 225 H970" class="l"/><text x="932" y="206" class="p" text-anchor="middle">乘 V</text>
  <rect x="995" y="150" width="160" height="150" rx="9" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="1075" y="195" class="h" text-anchor="middle">O = AV</text><text x="1075" y="228" class="p" text-anchor="middle">(n, dv)</text><text x="1075" y="258" class="p" text-anchor="middle">聚合后的输出</text>
  <text x="600" y="475" class="p" text-anchor="middle">除以 sqrt(dk) 防止 dk 较大时点积方差过大，使 softmax 过度尖锐并造成梯度变小。n 个 Token 两两计算，时间和显存复杂度约为 O(n^2)。</text>
</svg>
