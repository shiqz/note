<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs><style>.t{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 18px Arial,sans-serif;fill:#172554}.p{font:15px Arial,sans-serif;fill:#334155}.c{stroke:#fff;stroke-width:2}</style></defs>
  <rect width="1200" height="540" fill="#f8fafc"/><text x="600" y="45" class="t" text-anchor="middle">掩码：在 softmax 前把不允许关注的位置加上极小值</text>
  <text x="300" y="95" class="h" text-anchor="middle">Padding Mask：屏蔽补齐 Token</text>
  <g class="c"><rect x="180" y="130" width="60" height="60" fill="#86efac"/><rect x="240" y="130" width="60" height="60" fill="#86efac"/><rect x="300" y="130" width="60" height="60" fill="#86efac"/><rect x="360" y="130" width="60" height="60" fill="#fca5a5"/><rect x="420" y="130" width="60" height="60" fill="#fca5a5"/></g>
  <g class="p" text-anchor="middle"><text x="210" y="165">我</text><text x="270" y="165">爱</text><text x="330" y="165">AI</text><text x="390" y="165">PAD</text><text x="450" y="165">PAD</text></g>
  <text x="300" y="225" class="p" text-anchor="middle">有效位置保留；PAD 对应的注意力 logits 加 -inf</text>
  <rect x="120" y="260" width="360" height="145" rx="9" fill="#fff" stroke="#94a3b8"/><text x="300" y="295" class="p" text-anchor="middle">避免填充位参与计算，保证批处理</text><text x="300" y="325" class="p" text-anchor="middle">长度不同的序列不会互相污染</text><text x="300" y="365" class="p" text-anchor="middle">常见于编码器与解码器输入</text>
  <text x="875" y="95" class="h" text-anchor="middle">Causal Mask：屏蔽未来 Token</text>
  <g class="c"><rect x="725" y="130" width="60" height="60" fill="#86efac"/><rect x="785" y="130" width="60" height="60" fill="#fca5a5"/><rect x="845" y="130" width="60" height="60" fill="#fca5a5"/><rect x="905" y="130" width="60" height="60" fill="#fca5a5"/><rect x="725" y="190" width="60" height="60" fill="#86efac"/><rect x="785" y="190" width="60" height="60" fill="#86efac"/><rect x="845" y="190" width="60" height="60" fill="#fca5a5"/><rect x="905" y="190" width="60" height="60" fill="#fca5a5"/><rect x="725" y="250" width="60" height="60" fill="#86efac"/><rect x="785" y="250" width="60" height="60" fill="#86efac"/><rect x="845" y="250" width="60" height="60" fill="#86efac"/><rect x="905" y="250" width="60" height="60" fill="#fca5a5"/><rect x="725" y="310" width="60" height="60" fill="#86efac"/><rect x="785" y="310" width="60" height="60" fill="#86efac"/><rect x="845" y="310" width="60" height="60" fill="#86efac"/><rect x="905" y="310" width="60" height="60" fill="#86efac"/></g>
  <text x="845" y="420" class="p" text-anchor="middle">绿色：允许关注（自己与过去）；红色：未来位置加 -inf</text>
  <rect x="650" y="445" width="450" height="45" rx="7" fill="#fff" stroke="#94a3b8"/><text x="875" y="474" class="p" text-anchor="middle">GPT 等自回归模型使用下三角因果掩码，训练时防止“偷看答案”。</text>
</svg>
