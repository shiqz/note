<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="attn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ffn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">Transformer 与大模型核心机制</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">从 Token 到 Attention 到自回归生成——后端工程师需要理解的工程含义</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="600" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">文本如何流经大模型</text>

    <g filter="url(#shadow)">
      <rect x="60" y="155" width="160" height="80" rx="14" fill="url(#card)" stroke="#ddd6fe"/>
      <text x="140" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">原始文本</text>
      <text x="140" y="208" text-anchor="middle" font-size="13" fill="#64748b">"你好，世界"</text>
      <text x="140" y="225" text-anchor="middle" font-size="11" fill="#94a3b8">用户输入</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="290" y="155" width="160" height="80" rx="14" fill="url(#card)" stroke="#ddd6fe"/>
      <text x="370" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Tokenizer</text>
      <text x="370" y="203" text-anchor="middle" font-size="13" fill="#64748b">[你好, ，, 世界]</text>
      <text x="370" y="222" text-anchor="middle" font-size="11" fill="#94a3b8">切成子词 Token → ID</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="520" y="155" width="160" height="80" rx="14" fill="url(#card)" stroke="#ddd6fe"/>
      <text x="600" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Embedding</text>
      <text x="600" y="203" text-anchor="middle" font-size="13" fill="#64748b">Token → 高维向量</text>
      <text x="600" y="222" text-anchor="middle" font-size="11" fill="#94a3b8">+ 位置编码</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="750" y="140" width="200" height="110" rx="14" fill="url(#attn)"/>
      <text x="850" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">× N 层 Transformer</text>
      <text x="850" y="198" text-anchor="middle" font-size="13" fill="#ede9fe">Self-Attention (Q,K,V)</text>
      <text x="850" y="220" text-anchor="middle" font-size="13" fill="#ede9fe">+ Feed Forward Network</text>
      <text x="850" y="240" text-anchor="middle" font-size="11" fill="#c4b5fd">LayerNorm + Residual</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1010" y="155" width="140" height="80" rx="14" fill="url(#card)" stroke="#ddd6fe"/>
      <text x="1080" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">LM Head</text>
      <text x="1080" y="203" text-anchor="middle" font-size="13" fill="#64748b">向量 → 词表概率</text>
      <text x="1080" y="222" text-anchor="middle" font-size="11" fill="#94a3b8">Softmax</text>
    </g>

    <line x1="220" y1="195" x2="290" y2="195" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="450" y1="195" x2="520" y2="195" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="680" y1="195" x2="750" y2="195" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="950" y1="195" x2="1010" y2="195" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="60" y="290" width="520" height="240" rx="16" fill="#ffffff" stroke="#e9d5ff" filter="url(#shadow)"/>
    <text x="320" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">Self-Attention 的工程含义</text>

    <g font-size="14" fill="#334155">
      <text x="82" y="356">• 每个 Token 和序列中所有其他 Token 计算关联度（Attention 权重）</text>
      <text x="82" y="384">• Q（查询）、K（键）、V（值）三个矩阵，类比数据库检索：</text>
      <text x="100" y="408" font-size="13" fill="#64748b">Q = 我在找什么    K = 我有什么    V = 实际内容</text>
      <text x="82" y="438">• 计算复杂度 O(n²)：上下文越长，计算和显存成本平方级增长</text>
      <text x="82" y="466">• KV Cache：缓存历史 Token 的 K/V，避免重复计算（推理加速关键）</text>
      <text x="82" y="494">• Multi-Head：多组注意力并行，捕捉不同类型的语义关系</text>
    </g>

    <rect x="82" y="506" width="476" height="14" rx="7" fill="#f3e8ff"/>
    <rect x="82" y="506" width="340" height="14" rx="7" fill="url(#attn)"/>
    <text x="570" y="518" text-anchor="end" font-size="11" fill="#7c3aed">KV Cache 占推理显存大头</text>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="620" y="290" width="520" height="240" rx="16" fill="#ffffff" stroke="#a5f3fc" filter="url(#shadow)"/>
    <text x="880" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#0e7490">自回归生成（逐 Token 输出）</text>

    <g font-size="14" fill="#334155">
      <text x="642" y="356">模型不是一次生成整段话，而是：</text>
      <text x="660" y="382" font-size="13" fill="#6366f1">Step 1: 输入["你好"] → 输出"，"</text>
      <text x="660" y="406" font-size="13" fill="#6366f1">Step 2: 输入["你好","，"] → 输出"世界"</text>
      <text x="660" y="430" font-size="13" fill="#6366f1">Step 3: 输入["你好","，","世界"] → 输出"！"</text>
      <text x="660" y="454" font-size="13" fill="#64748b">... 直到生成 EOS（结束标记）</text>

      <text x="642" y="486" fill="#0e7490" font-weight="600">这解释了：</text>
      <text x="642" y="508" font-size="13" fill="#334155">→ 为什么流式输出是一个字一个字的（SSE 逐 Token）</text>
      <text x="642" y="526" font-size="13" fill="#334155">→ 为什么输出 Token 比输入慢（Prefill 快，Decode 逐字）</text>
    </g>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="60" y="560" width="1080" height="220" rx="18" fill="#0f172a" opacity="0.95"/>
    <text x="600" y="598" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">后端工程师必须掌握的模型参数与工程约束</text>

    <g font-size="14">
      <rect x="90" y="620" width="240" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="210" y="646" text-anchor="middle" fill="#a78bfa" font-weight="700">Temperature / Top-p</text>
      <text x="210" y="668" text-anchor="middle" fill="#cbd5e1" font-size="12">控制随机性：问答用低温(0.1~0.3)</text>
      <text x="210" y="684" text-anchor="middle" fill="#cbd5e1" font-size="12">创作可用高温(0.7~1.0)</text>

      <rect x="360" y="620" width="240" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="480" y="646" text-anchor="middle" fill="#22d3ee" font-weight="700">Max Tokens</text>
      <text x="480" y="668" text-anchor="middle" fill="#cbd5e1" font-size="12">限制输出长度，控制成本和延迟</text>
      <text x="480" y="684" text-anchor="middle" fill="#cbd5e1" font-size="12">finish_reason=length 表示被截断</text>

      <rect x="630" y="620" width="240" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="750" y="646" text-anchor="middle" fill="#f472b6" font-weight="700">Context Window</text>
      <text x="750" y="668" text-anchor="middle" fill="#cbd5e1" font-size="12">系统+历史+检索+输入+预留输出</text>
      <text x="750" y="684" text-anchor="middle" fill="#cbd5e1" font-size="12">总和不能超过窗口大小</text>

      <rect x="900" y="620" width="220" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="1010" y="646" text-anchor="middle" fill="#fb923c" font-weight="700">Streaming</text>
      <text x="1010" y="668" text-anchor="middle" fill="#cbd5e1" font-size="12">SSE/WebSocket 推送</text>
      <text x="1010" y="684" text-anchor="middle" fill="#cbd5e1" font-size="12">TTFT 是关键体验指标</text>
    </g>

    <text x="600" y="730" text-anchor="middle" font-size="14" fill="#94a3b8">7B 模型 FP16 ≈ 14GB 显存 | 70B 模型 INT4 ≈ 35GB 显存 | KV Cache 随上下文长度和并发线性增长</text>
    <text x="600" y="758" text-anchor="middle" font-size="13" fill="#c4b5fd">理解这些约束，你才能做好容量规划、超时设置、成本估算和降级策略。</text>
  </g>
</svg>
