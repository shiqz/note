<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <marker id="eoa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="500" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">文本变成向量：Embedding 模型的推理管线总览</text>

  <!-- 输入文本 -->
  <rect x="250" y="62" width="500" height="50" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="500" y="93" text-anchor="middle" font-size="14" fill="#991b1b">输入文本（字符串）："年假有多少天？"</text>

  <line x1="500" y1="114" x2="500" y2="138" stroke="#475569" stroke-width="2.5" marker-end="url(#eoa)"/>

  <!-- Step 1 Tokenizer -->
  <rect x="120" y="142" width="760" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="145" y="168" font-size="14.5" font-weight="bold" fill="#92400e">① Tokenizer 分词</text>
  <text x="145" y="190" font-size="12.5" fill="#78350f">文本 → 子词 Token 序列，查词表 → Token IDs（[101, 1962, 6607, …]）+ Attention Mask</text>
  <text x="855" y="180" text-anchor="middle" font-size="11.5" fill="#a16207">规则固定</text>

  <line x1="500" y1="210" x2="500" y2="234" stroke="#475569" stroke-width="2.5" marker-end="url(#eoa)"/>

  <!-- Step 2 查表+位置 -->
  <rect x="120" y="238" width="760" height="66" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="145" y="264" font-size="14.5" font-weight="bold" fill="#1e40af">② Embedding 查表 + 位置编码</text>
  <text x="145" y="286" font-size="12.5" fill="#1e3a8a">每个 ID 查嵌入矩阵得到初始向量（d 维），叠加位置编码告知词序 → 向量矩阵 [序列长 L × d]</text>

  <line x1="500" y1="306" x2="500" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#eoa)"/>

  <!-- Step 3 Transformer -->
  <rect x="120" y="334" width="760" height="86" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="2.5"/>
  <text x="145" y="360" font-size="14.5" font-weight="bold" fill="#15803d">③ Transformer 编码器（N 层自注意力）</text>
  <text x="145" y="382" font-size="12.5" fill="#14532d">每个 Token 通过注意力聚合上下文信息，逐层提炼语义；输出仍是 L 个"上下文相关"的 Token 向量</text>
  <text x="145" y="404" font-size="12.5" fill="#166534">语义计算的核心，参数占模型 99% 以上</text>

  <line x1="500" y1="422" x2="500" y2="446" stroke="#475569" stroke-width="2.5" marker-end="url(#eoa)"/>

  <!-- Step 4 Pooling -->
  <rect x="120" y="450" width="760" height="60" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <text x="145" y="476" font-size="14.5" font-weight="bold" fill="#7e22ce">④ Pooling 池化</text>
  <text x="145" y="498" font-size="12.5" fill="#6b21a8">把 L 个 Token 向量压缩成 1 个句向量：CLS 取首位 / Mean 平均 / Max 逐维取最大</text>

  <line x1="500" y1="512" x2="500" y2="536" stroke="#475569" stroke-width="2.5" marker-end="url(#eoa)"/>

  <!-- Step 5 归一化 -->
  <rect x="120" y="540" width="760" height="60" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="145" y="566" font-size="14.5" font-weight="bold" fill="#0e7490">⑤ L2 归一化（多数模型内置/推荐）</text>
  <text x="145" y="588" font-size="12.5" fill="#155e75">向量除以自身模长 → 单位向量；此后点积 = 余弦相似度，检索排序一致且更高效</text>

  <!-- 输出 -->
  <rect x="330" y="608" width="340" height="26" rx="13" fill="#1e293b"/>
  <text x="500" y="626" text-anchor="middle" font-size="12.5" fill="#6ee7b7">输出：一个 d 维稠密向量，如 [0.021, -0.37, 0.84, …]（d = 384/768/1024/1536）</text>
</svg>
