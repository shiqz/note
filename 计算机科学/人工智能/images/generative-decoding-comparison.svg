<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <marker id="arrow5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c2d12"/>
    </marker>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1050" height="600" rx="16" fill="url(#bgGrad5)"/>
  <text x="525" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#7c2d12" text-anchor="middle">从向量到内容：三种生成式解码范式对比</text>

  <!-- VAE 列 -->
  <g transform="translate(30, 70)" filter="url(#shadow5)">
    <rect x="0" y="0" width="310" height="480" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="50" rx="14" fill="#ea580c"/>
    <rect x="0" y="36" width="310" height="14" fill="#ea580c"/>
    <text x="155" y="32" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">VAE 变分自编码器</text>

    <g transform="translate(20, 70)">
      <text x="0" y="0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#9a3412">输入：潜在向量 z ~ N(μ, σ²)</text>

      <!-- 概率分布示意 -->
      <g transform="translate(40, 20)">
        <path d="M 0 60 Q 50 0 100 60 Q 150 0 200 60" fill="none" stroke="#ea580c" stroke-width="2"/>
        <line x1="0" y1="60" x2="200" y2="60" stroke="#fdba74" stroke-width="1"/>
        <text x="100" y="80" font-family="monospace" font-size="10" fill="#c2410c" text-anchor="middle">z = μ + σ·ε, ε~N(0,1)</text>
      </g>

      <line x1="135" y1="110" x2="135" y2="135" stroke="#7c2d12" stroke-width="2" marker-end="url(#arrow5)"/>

      <rect x="55" y="140" width="160" height="50" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
      <text x="135" y="162" font-family="monospace" font-size="11" fill="#9a3412" text-anchor="middle">解码器 D(z)</text>
      <text x="135" y="180" font-family="monospace" font-size="10" fill="#c2410c" text-anchor="middle">转置卷积 / 线性层</text>

      <line x1="135" y1="190" x2="135" y2="215" stroke="#7c2d12" stroke-width="2" marker-end="url(#arrow5)"/>

      <rect x="55" y="220" width="160" height="80" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
      <text x="135" y="245" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#7c2d12" text-anchor="middle">输出 x̂</text>
      <text x="135" y="265" font-family="monospace" font-size="10" fill="#9a3412" text-anchor="middle">单次前向传播生成</text>
      <text x="135" y="282" font-family="monospace" font-size="10" fill="#9a3412" text-anchor="middle">连续值（概率像素）</text>

      <line x1="20" y1="320" x2="290" y2="320" stroke="#fed7aa" stroke-width="1"/>
      <text x="20" y="340" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#9a3412">特点：</text>
      <text x="20" y="360" font-family="monospace" font-size="10" fill="#c2410c">• 概率建模，潜在空间连续</text>
      <text x="20" y="378" font-family="monospace" font-size="10" fill="#c2410c">• 支持插值和算术运算</text>
      <text x="20" y="396" font-family="monospace" font-size="10" fill="#c2410c">• 生成速度快（一次前向）</text>
      <text x="20" y="414" font-family="monospace" font-size="10" fill="#c2410c">• 输出通常较模糊</text>
    </g>
  </g>

  <!-- GAN 列 -->
  <g transform="translate(370, 70)" filter="url(#shadow5)">
    <rect x="0" y="0" width="310" height="480" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="50" rx="14" fill="#16a34a"/>
    <rect x="0" y="36" width="310" height="14" fill="#16a34a"/>
    <text x="155" y="32" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">GAN 生成对抗网络</text>

    <g transform="translate(20, 70)">
      <text x="0" y="0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#14532d">输入：随机噪声 z ~ N(0, I)</text>

      <g transform="translate(40, 18)">
        <circle cx="30" cy="40" r="4" fill="#22c55e" opacity="0.4"/>
        <circle cx="80" cy="25" r="4" fill="#22c55e" opacity="0.5"/>
        <circle cx="130" cy="45" r="4" fill="#22c55e" opacity="0.3"/>
        <circle cx="170" cy="30" r="4" fill="#22c55e" opacity="0.6"/>
        <circle cx="55" cy="50" r="4" fill="#22c55e" opacity="0.4"/>
        <circle cx="110" cy="55" r="4" fill="#22c55e" opacity="0.5"/>
        <text x="100" y="80" font-family="monospace" font-size="10" fill="#16a34a" text-anchor="middle">随机向量 z</text>
      </g>

      <line x1="135" y1="110" x2="135" y2="135" stroke="#7c2d12" stroke-width="2" marker-end="url(#arrow5)"/>

      <rect x="55" y="140" width="160" height="50" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
      <text x="135" y="162" font-family="monospace" font-size="11" fill="#14532d" text-anchor="middle">生成器 G(z)</text>
      <text x="135" y="180" font-family="monospace" font-size="10" fill="#16a34a" text-anchor="middle">转置卷积上采样</text>

      <line x1="135" y1="190" x2="135" y2="215" stroke="#7c2d12" stroke-width="2" marker-end="url(#arrow5)"/>

      <rect x="55" y="220" width="160" height="80" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
      <text x="135" y="245" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">输出 x̂ （伪造样本）</text>
      <text x="135" y="265" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">单次前向传播</text>
      <text x="135" y="282" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">锐利清晰的图像</text>

      <!-- 判别器 -->
      <rect x="30" y="315" width="210" height="45" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="135" y="335" font-family="monospace" font-size="11" fill="#991b1b" text-anchor="middle">判别器 D(x) / D(G(z))</text>
      <text x="135" y="352" font-family="monospace" font-size="9" fill="#b91c1c" text-anchor="middle">对抗训练：真/假二分类</text>

      <line x1="20" y1="375" x2="290" y2="375" stroke="#bbf7d0" stroke-width="1"/>
      <text x="20" y="393" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#14532d">特点：</text>
      <text x="20" y="411" font-family="monospace" font-size="10" fill="#166534">• 博弈训练，生成质量高</text>
      <text x="20" y="429" font-family="monospace" font-size="10" fill="#166534">• 潜在空间不连续、难控制</text>
      <text x="20" y="447" font-family="monospace" font-size="10" fill="#166534">• 模式坍塌（Mode Collapse）</text>
    </g>
  </g>

  <!-- Diffusion 列 -->
  <g transform="translate(710, 70)" filter="url(#shadow5)">
    <rect x="0" y="0" width="310" height="480" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="50" rx="14" fill="#2563eb"/>
    <rect x="0" y="36" width="310" height="14" fill="#2563eb"/>
    <text x="155" y="32" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Diffusion 扩散模型</text>

    <g transform="translate(20, 70)">
      <text x="0" y="0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">输入：纯噪声 x_T ~ N(0, I)</text>

      <!-- 去噪迭代示意 -->
      <g transform="translate(10, 18)">
        <text x="0" y="15" font-family="monospace" font-size="9" fill="#1d4ed8">x_T (纯噪声)</text>
        <circle cx="120" cy="12" r="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>

        <text x="0" y="42" font-family="monospace" font-size="9" fill="#1d4ed8">x_{T-1}</text>
        <circle cx="120" cy="39" r="11" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1"/>

        <text x="0" y="67" font-family="monospace" font-size="9" fill="#1d4ed8">...</text>

        <text x="0" y="92" font-family="monospace" font-size="9" fill="#1d4ed8">x_{t}</text>
        <circle cx="120" cy="89" r="9" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>

        <text x="0" y="117" font-family="monospace" font-size="9" fill="#1d4ed8">...</text>

        <text x="0" y="142" font-family="monospace" font-size="9" fill="#1d4ed8">x_0 (清晰图像)</text>
        <circle cx="120" cy="139" r="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>

        <!-- 迭代箭头 -->
        <line x1="120" y1="24" x2="120" y2="28" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow5)"/>
        <line x1="120" y1="50" x2="120" y2="75" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow5)"/>
        <line x1="120" y1="98" x2="120" y2="103" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow5)"/>
        <line x1="120" y1="125" x2="120" y2="131" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow5)"/>

        <text x="220" y="80" font-family="monospace" font-size="9" fill="#1e40af">ε_θ 预测噪声</text>
        <text x="220" y="95" font-family="monospace" font-size="9" fill="#1e40af">逐步去噪</text>
        <text x="220" y="110" font-family="monospace" font-size="9" fill="#1e40af">T = 20~1000 步</text>
      </g>

      <rect x="55" y="175" width="160" height="45" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="135" y="197" font-family="monospace" font-size="11" fill="#1e3a8a" text-anchor="middle">U-Net 去噪网络</text>
      <text x="135" y="214" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">x_{t-1} = x_t - ε_θ</text>

      <rect x="55" y="235" width="160" height="65" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="135" y="258" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">输出 x_0</text>
      <text x="135" y="278" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="middle">迭代 T 步后生成</text>
      <text x="135" y="293" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="middle">质量最高 · 多样性好</text>

      <line x1="20" y1="320" x2="290" y2="320" stroke="#bfdbfe" stroke-width="1"/>
      <text x="20" y="340" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">特点：</text>
      <text x="20" y="358" font-family="monospace" font-size="10" fill="#1e40af">• 数学理论优美，训练稳定</text>
      <text x="20" y="376" font-family="monospace" font-size="10" fill="#1e40af">• 生成质量 SOTA（SD/MD）</text>
      <text x="20" y="394" font-family="monospace" font-size="10" fill="#1e40af">• 支持文本条件控制</text>
      <text x="20" y="412" font-family="monospace" font-size="10" fill="#1e40af">• 采样慢（需多步迭代）</text>
      <text x="20" y="430" font-family="monospace" font-size="10" fill="#1e40af">• DDIM/DPM-Solver 加速采样</text>
    </g>
  </g>

  <!-- 底部对比总结 -->
  <g transform="translate(50, 570)">
    <text x="475" y="0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#7c2d12" text-anchor="middle">
      核心区别：VAE 直接解码概率分布；GAN 通过对抗博弈一次生成；Diffusion 从噪声迭代去噪 T 步
    </text>
  </g>
</svg>
