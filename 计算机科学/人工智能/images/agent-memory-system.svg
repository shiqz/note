<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
    <marker id="ar3b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#bg3)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">Agent 记忆系统：让 Agent 跨步骤、跨会话积累经验</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">上下文窗口是"工作台"（短期记忆），外部存储是"档案室"（长期记忆）；记忆的本质是：写入、检索、注入、遗忘</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" filter="url(#shadow3)">
    <!-- 短期记忆 -->
    <rect x="56" y="116" width="1088" height="148" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="76" y="136" width="160" height="32" rx="16" fill="#eef2ff" stroke="#818cf8"/>
    <text x="156" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">短期记忆 · 工作记忆</text>
    <text x="252" y="158" font-size="13" fill="#475569">存活于当前任务循环中，就是 LLM 上下文窗口里的 messages</text>

    <g>
      <rect x="76" y="182" width="330" height="64" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
      <text x="92" y="206" font-size="13" font-weight="700" fill="#3730a3">装了什么</text>
      <text x="92" y="228" font-size="11.5" fill="#3730a3">系统提示 · 对话历史 · ReAct 轨迹</text>

      <rect x="435" y="182" width="330" height="64" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
      <text x="451" y="206" font-size="13" font-weight="700" fill="#3730a3">核心约束</text>
      <text x="451" y="228" font-size="11.5" fill="#3730a3">上下文窗口有限 · Token 随步数线性增长</text>

      <rect x="794" y="182" width="330" height="64" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
      <text x="810" y="206" font-size="13" font-weight="700" fill="#3730a3">管理手段</text>
      <text x="810" y="228" font-size="11.5" fill="#3730a3">滑动窗口 · 历史摘要 · 工具结果截断 · 只留关键信息</text>
    </g>

    <!-- 长期记忆三卡 -->
    <!-- 情景记忆 -->
    <rect x="56" y="292" width="344" height="186" rx="16" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <rect x="76" y="312" width="150" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="151" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">情景记忆 Episodic</text>
    <text x="76" y="366" font-size="12.5" fill="#78350f">记住"发生过什么"</text>
    <text x="76" y="392" font-size="11.5" fill="#92400e">· 历史对话、任务执行轨迹</text>
    <text x="76" y="414" font-size="11.5" fill="#92400e">· 成功/失败的经验教训</text>
    <text x="76" y="436" font-size="11.5" fill="#92400e">· 用户偏好与历史决策</text>
    <text x="76" y="462" font-size="11" font-weight="700" fill="#b45309">实现：向量库存 Embedding + 时间/人物元数据</text>

    <!-- 语义记忆 -->
    <rect x="428" y="292" width="344" height="186" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="448" y="312" width="150" height="30" rx="15" fill="#d1fae5" stroke="#059669"/>
    <text x="523" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">语义记忆 Semantic</text>
    <text x="448" y="366" font-size="12.5" fill="#065f46">记住"事实是什么"</text>
    <text x="448" y="392" font-size="11.5" fill="#047857">· 领域知识、业务规则</text>
    <text x="448" y="414" font-size="11.5" fill="#047857">· 产品文档、FAQ、制度</text>
    <text x="448" y="436" font-size="11.5" fill="#047857">· 实体与关系（知识图谱）</text>
    <text x="448" y="462" font-size="11" font-weight="700" fill="#047857">实现：RAG 检索 + 向量库 / 知识图谱</text>

    <!-- 程序记忆 -->
    <rect x="800" y="292" width="344" height="186" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="820" y="312" width="150" height="30" rx="15" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="895" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">程序记忆 Procedural</text>
    <text x="820" y="366" font-size="12.5" fill="#5b21b6">记住"事情怎么做"</text>
    <text x="820" y="392" font-size="11.5" fill="#6d28d9">· 工具的使用方法与组合套路</text>
    <text x="820" y="414" font-size="11.5" fill="#6d28d9">· 沉淀下来的 Prompt 模板</text>
    <text x="820" y="436" font-size="11.5" fill="#6d28d9">· 标准作业流程（SOP）</text>
    <text x="820" y="462" font-size="11" font-weight="700" fill="#6d28d9">实现：技能库 / 工作流模板 / 工具描述</text>
  </g>

  <!-- 记忆运作流水线 -->
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" filter="url(#shadow3)">
    <rect x="56" y="510" width="1088" height="146" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="76" y="542" font-size="16" font-weight="700" fill="#0f172a">记忆运作流程</text>

    <g>
      <rect x="76" y="562" width="176" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="164" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">① 捕获写入</text>
      <text x="164" y="612" text-anchor="middle" font-size="11" fill="#475569">交互结束后提炼要点</text>

      <rect x="288" y="562" width="176" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="376" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">② 向量化存储</text>
      <text x="376" y="612" text-anchor="middle" font-size="11" fill="#475569">Embedding + 元数据入向量库</text>

      <rect x="500" y="562" width="176" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="588" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">③ 按需检索</text>
      <text x="588" y="612" text-anchor="middle" font-size="11" fill="#475569">新任务时语义召回相关记忆</text>

      <rect x="712" y="562" width="176" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="800" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">④ 注入上下文</text>
      <text x="800" y="612" text-anchor="middle" font-size="11" fill="#475569">作为背景信息拼进 Prompt</text>

      <rect x="924" y="562" width="200" height="70" rx="10" fill="#fef2f2" stroke="#fecaca"/>
      <text x="1024" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">⑤ 遗忘与更新</text>
      <text x="1024" y="612" text-anchor="middle" font-size="11" fill="#7f1d1d">去重 · 衰减 · 过期清理 · 纠错</text>
    </g>

    <g stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ar3)">
      <line x1="252" y1="597" x2="284" y2="597"/>
      <line x1="464" y1="597" x2="496" y2="597"/>
      <line x1="676" y1="597" x2="708" y2="597"/>
      <line x1="888" y1="597" x2="920" y2="597"/>
    </g>
  </g>

  <!-- 底部总结条 -->
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="56" y="688" width="1088" height="130" rx="16" fill="#0f172a" opacity="0.95"/>
    <text x="600" y="724" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">记忆与 RAG 的区别</text>
    <text x="600" y="756" text-anchor="middle" font-size="14" fill="#cbd5e1">RAG 是"查资料"——检索外部客观知识；Agent 记忆是"回忆"——检索自己过去的经历、偏好和教训。</text>
    <text x="600" y="784" text-anchor="middle" font-size="13.5" fill="#fde68a">工程上两者实现几乎一样（向量库 + 检索 + 注入），区别在于数据来源和用途：知识文档 vs 交互沉淀。</text>
    <text x="600" y="808" text-anchor="middle" font-size="12.5" fill="#94a3b8">记忆不是越多越好：无关记忆会污染上下文、干扰决策，检索质量和"断舍离"比存储量更重要。</text>
  </g>
</svg>
