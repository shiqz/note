<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <marker id="en1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="500" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">L2 归一化：把向量投影到单位球面</text>

  <!-- 左：归一化前 -->
  <rect x="40" y="70" width="430" height="420" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="255" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#475569">归一化前：向量长度参差不齐</text>

  <!-- 轴 -->
  <line x1="120" y1="440" x2="430" y2="440" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="440" x2="120" y2="150" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 单位圆 -->
  <circle cx="120" cy="440" r="90" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="218" y="400" font-size="11.5" fill="#16a34a">单位球面（‖v‖=1）</text>

  <!-- 向量 a 长 -->
  <line x1="120" y1="440" x2="280" y2="320" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="280,320 270,322 275,331" fill="#3b82f6"/>
  <text x="285" y="318" font-size="12.5" font-weight="bold" fill="#1d4ed8">a（长）</text>
  <!-- 向量 b 短但同方向 -->
  <line x1="120" y1="440" x2="200" y2="380" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="200,380 191,381 195,389" fill="#f59e0b"/>
  <text x="205" y="380" font-size="12.5" font-weight="bold" fill="#b45309">b（短，同方向）</text>
  <!-- 向量 c 不同方向 -->
  <line x1="120" y1="440" x2="180" y2="470" stroke="#ef4444" stroke-width="3"/>
  <polygon points="180,470 172,464 171,473" fill="#ef4444"/>
  <text x="185" y="486" font-size="12.5" font-weight="bold" fill="#b91c1c">c（方向差异大）</text>

  <text x="255" y="160" text-anchor="middle" font-size="12.5" fill="#64748b">点积 a·b 受长度影响：</text>
  <text x="255" y="182" text-anchor="middle" font-size="12.5" fill="#64748b">a、b 语义相同但长度不同 → 点积差异大</text>

  <!-- 右：归一化后 -->
  <rect x="530" y="70" width="430" height="420" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2.5"/>
  <text x="745" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">归一化后：v' = v / ‖v‖</text>

  <line x1="620" y1="440" x2="930" y2="440" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="620" y1="440" x2="620" y2="150" stroke="#94a3b8" stroke-width="1.5"/>

  <circle cx="620" cy="440" r="90" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 同方向两向量归一化后重合 -->
  <line x1="620" y1="440" x2="694" y2="384" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="694,384 684,385 688,394" fill="#3b82f6"/>
  <text x="700" y="380" font-size="12.5" font-weight="bold" fill="#1d4ed8">a' = b'</text>
  <text x="700" y="398" font-size="11.5" fill="#2563eb">语义同 → 同一点</text>

  <line x1="620" y1="440" x2="680" y2="470" stroke="#ef4444" stroke-width="3"/>
  <polygon points="680,470 672,464 671,473" fill="#ef4444"/>
  <text x="688" y="486" font-size="12.5" font-weight="bold" fill="#b91c1c">c'</text>

  <text x="745" y="160" text-anchor="middle" font-size="12.5" fill="#14532d">所有向量长度 = 1 后：</text>
  <text x="745" y="186" text-anchor="middle" font-size="13" font-family="Consolas,monospace" fill="#15803d">a'·b' = cos θ （点积 ≡ 余弦相似度）</text>

  <rect x="570" y="210" width="350" height="120" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="745" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">工程意义</text>
  <text x="590" y="270" font-size="12.5" fill="#166534">① 语义只由"方向"决定，消除模长干扰</text>
  <text x="590" y="294" font-size="12.5" fill="#166534">② 向量库可直接用点积排序，比余弦更快</text>
  <text x="590" y="318" font-size="12.5" fill="#166534">③ OpenAI / BGE 等多数 API 返回已归一化向量</text>

  <rect x="570" y="350" width="350" height="110" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="745" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">坑：自定义/本地模型若未归一化</text>
  <text x="590" y="404" font-size="12" fill="#991b1b">而向量库按 cosine 配置 → 结果通常仍正确</text>
  <text x="590" y="426" font-size="12" fill="#991b1b">但按 ip（点积）配置且未归一化 → 排序错乱</text>
  <text x="590" y="448" font-size="12" fill="#991b1b">保险做法：入库/查询前手动 L2 归一化</text>
</svg>
