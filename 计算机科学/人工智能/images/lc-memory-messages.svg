<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">多轮对话记忆：历史消息注入 + thread_id 持久化</text>

  <!-- 左：消息列表累积 -->
  <rect x="40" y="80" width="480" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="280" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">每轮对话都把完整历史带给模型</text>

  <g font-size="12.5">
    <rect x="80" y="135" width="400" height="40" rx="9" fill="#e2e8f0"/>
    <text x="98" y="160" font-weight="bold" fill="#334155">System：你是有帮助的客服助手</text>

    <rect x="80" y="185" width="280" height="40" rx="9" fill="#dbeafe"/>
    <text x="98" y="210" fill="#1d4ed8">用户：我想查订单 123 的物流</text>

    <rect x="200" y="235" width="280" height="40" rx="9" fill="#f1f5f9"/>
    <text x="218" y="260" fill="#475569">AI：订单 123 已到达上海中转站</text>

    <rect x="80" y="285" width="280" height="40" rx="9" fill="#dbeafe"/>
    <text x="98" y="310" fill="#1d4ed8">用户：那它明天能到吗？ ← 省略了"123"</text>

    <rect x="200" y="335" width="280" height="40" rx="9" fill="#f1f5f9"/>
    <text x="218" y="360" fill="#475569">AI：根据历史，预计明天送达</text>

    <rect x="80" y="400" width="400" height="40" rx="9" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
    <text x="280" y="425" text-anchor="middle" font-weight="bold" fill="#854d0e">MessagesPlaceholder("history")</text>

    <rect x="80" y="450" width="400" height="40" rx="9" fill="#dbeafe"/>
    <text x="98" y="475" fill="#1d4ed8">Human：最新问题（history 之后拼接）</text>
  </g>
  <text x="280" y="505" text-anchor="middle" font-size="12" fill="#64748b">LLM 本身无状态——"记忆"就是每次请求重新带上历史消息</text>

  <!-- 右：持久化机制 -->
  <rect x="560" y="80" width="380" height="430" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="750" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">v1 推荐：Checkpointer + thread_id</text>

  <!-- 两个会话 -->
  <g font-size="12">
    <rect x="590" y="135" width="150" height="52" rx="10" fill="white" stroke="#86efac"/>
    <text x="665" y="158" text-anchor="middle" font-weight="bold" fill="#15803d">thread_id = "user-A"</text>
    <text x="665" y="176" text-anchor="middle" fill="#166534">A 的对话历史</text>

    <rect x="760" y="135" width="150" height="52" rx="10" fill="white" stroke="#86efac"/>
    <text x="835" y="158" text-anchor="middle" font-weight="bold" fill="#15803d">thread_id = "user-B"</text>
    <text x="835" y="176" text-anchor="middle" fill="#166534">B 的对话历史</text>
  </g>

  <line x1="665" y1="190" x2="700" y2="250" stroke="#15803d" stroke-width="2"/>
  <line x1="835" y1="190" x2="800" y2="250" stroke="#15803d" stroke-width="2"/>

  <rect x="600" y="250" width="300" height="80" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="750" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Checkpointer（检查点）</text>
  <text x="750" y="306" text-anchor="middle" font-size="12" fill="#166534">自动按 thread_id 存取 messages 状态</text>
  <text x="750" y="324" text-anchor="middle" font-size="11.5" fill="#166534">同一会话自动续接，无需手动拼历史</text>

  <line x1="750" y1="330" x2="750" y2="365" stroke="#15803d" stroke-width="2"/>
  <polygon points="750,370 743,359 757,359" fill="#15803d"/>

  <g font-size="12" text-anchor="middle">
    <rect x="590" y="375" width="150" height="46" rx="9" fill="white" stroke="#86efac"/>
    <text x="665" y="397" font-family="Consolas,monospace" fill="#166534">InMemorySaver</text>
    <text x="665" y="414" font-size="10.5" fill="#15803d">开发调试（重启即失）</text>

    <rect x="760" y="375" width="150" height="46" rx="9" fill="white" stroke="#86efac"/>
    <text x="835" y="397" font-family="Consolas,monospace" fill="#166534">SqliteSaver / PG</text>
    <text x="835" y="414" font-size="10.5" fill="#15803d">生产持久化</text>
  </g>

  <text x="750" y="460" text-anchor="middle" font-size="12" fill="#166534">调用时传入：</text>
  <text x="750" y="482" text-anchor="middle" font-size="11.5" font-family="Consolas,monospace" fill="#14532d">config={"configurable": {"thread_id": "user-A"}}</text>

  <text x="490" y="545" text-anchor="middle" font-size="12.5" fill="#64748b">历史消息会持续累积并占用 token，生产中需配合"窗口截断 / 摘要压缩"策略</text>
</svg>
