<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e6f3ff"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30cfd0"/>
      <stop offset="100%" stop-color="#330867"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="520" rx="20" fill="url(#bgGrad)"/>
  <text x="500" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" text-anchor="middle">从原始语料到可计算词向量的完整流水线</text>

  <!-- 阶段1 语料采集 -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="url(#boxGrad1)"/>
    <text x="70" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 可靠语料采集</text>
    <line x1="20" y1="60" x2="120" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="70" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Wikipedia</text>
    <text x="70" y="98" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Common Crawl / 领域语料</text>
  </g>

  <line x1="190" y1="145" x2="230" y2="145" stroke="#555555" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- 阶段2 清洗 -->
  <g transform="translate(240, 90)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="url(#boxGrad2)"/>
    <text x="70" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 清洗与标准化</text>
    <line x1="20" y1="60" x2="120" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="70" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">去重 · 去噪 · 编码统一</text>
    <text x="70" y="98" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">大小写折叠 · 占位符</text>
  </g>

  <line x1="380" y1="145" x2="420" y2="145" stroke="#555555" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- 阶段3 分词 -->
  <g transform="translate(430, 90)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="url(#boxGrad3)"/>
    <text x="70" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 分词/子词切分</text>
    <line x1="20" y1="60" x2="120" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="70" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">BPE · SentencePiece</text>
    <text x="70" y="98" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">jieba · 最大匹配</text>
  </g>

  <line x1="570" y1="145" x2="610" y2="145" stroke="#555555" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- 阶段4 词表ID -->
  <g transform="translate(620, 90)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="url(#boxGrad4)"/>
    <text x="70" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4. 词表与ID映射</text>
    <line x1="20" y1="60" x2="120" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="70" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">词频统计 · 低频截断</text>
    <text x="70" y="98" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">特殊Token · ID分配</text>
  </g>

  <line x1="760" y1="145" x2="800" y2="145" stroke="#555555" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- 阶段5 训练 -->
  <g transform="translate(810, 90)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="url(#boxGrad5)"/>
    <text x="70" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5. 模型训练</text>
    <line x1="20" y1="60" x2="120" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="70" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">静态: W2V / GloVe</text>
    <text x="70" y="98" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">上下文: BERT / GPT</text>
  </g>

  <!-- 向下箭头 -->
  <line x1="880" y1="200" x2="880" y2="250" stroke="#555555" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- 输出向量 -->
  <g transform="translate(570, 260)">
    <rect x="0" y="0" width="380" height="120" rx="14" fill="url(#boxGrad6)"/>
    <text x="190" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">6. 可计算的稠密向量输出</text>
    <line x1="30" y1="60" x2="350" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <g transform="translate(50, 78)">
      <rect x="0" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.85)"/>
      <rect x="24" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.75)"/>
      <rect x="48" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.9)"/>
      <rect x="72" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.7)"/>
      <rect x="96" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.85)"/>
      <rect x="120" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.78)"/>
      <rect x="144" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.92)"/>
      <text x="180" y="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#ffffff">···</text>
      <rect x="220" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.8)"/>
      <rect x="244" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.88)"/>
      <rect x="268" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.76)"/>
      <rect x="292" y="0" width="18" height="26" rx="3" fill="rgba(255,255,255,0.82)"/>
    </g>
    <text x="190" y="108" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">E[猫] = [0.21, -0.37, 0.84, 0.12, -0.05, 0.63, 0.28, ···, 0.77]</text>
  </g>

  <!-- 左侧控制点 -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="480" height="230" rx="14" fill="#ffffff" stroke="#d0d9e6" stroke-width="1.5"/>
    <text x="240" y="35" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">各阶段关键质量控制点</text>
    <line x1="30" y1="50" x2="450" y2="50" stroke="#eeeeee" stroke-width="1"/>

    <g transform="translate(30, 68)">
      <circle cx="10" cy="8" r="8" fill="#667eea"/>
      <text x="8" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="28" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2c3e50">语料覆盖度 &amp; 均衡度：目标领域关键词占比是否达标</text>
    </g>

    <g transform="translate(30, 100)">
      <circle cx="10" cy="8" r="8" fill="#f5576c"/>
      <text x="8" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="28" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2c3e50">MinHash + LSH 近似去重，重复率需低于 5%</text>
    </g>

    <g transform="translate(30, 132)">
      <circle cx="10" cy="8" r="8" fill="#00c6fb"/>
      <text x="8" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="28" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2c3e50">子词粒度平衡：词表大小 (32K~50K) vs OOV 率 &lt; 1%</text>
    </g>

    <g transform="translate(30, 164)">
      <circle cx="10" cy="8" r="8" fill="#43e97b"/>
      <text x="8" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="28" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2c3e50">[PAD]=0, [UNK]=1, &lt;[BOS_never_used_51bce0c785ca2f68081bfa7d91973934]&gt;=2, [SEP]=3</text>
    </g>

    <g transform="translate(30, 196)">
      <circle cx="10" cy="8" r="8" fill="#fa709a"/>
      <text x="8" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
      <text x="28" y="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2c3e50">静态/上下文模型选择 + 维度/层数权衡</text>
    </g>
  </g>
</svg>