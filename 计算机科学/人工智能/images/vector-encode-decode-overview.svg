<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="encoderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30cfd0"/>
      <stop offset="100%" stop-color="#330867"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1100" height="600" rx="20" fill="url(#bgGrad)"/>
  <text x="550" y="45" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">高维复杂数据的向量化编码与反向重建全景</text>

  <!-- 原始数据 -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="180" rx="16" fill="url(#dataGrad)"/>
    <text x="85" y="35" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">原始高维数据</text>
    <line x1="20" y1="50" x2="150" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="85" y="75" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">📝 文本: 1024 tokens</text>
    <text x="85" y="98" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">🖼️ 图像: 3×224×224</text>
    <text x="85" y="121" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">🎵 音频: 16000×1</text>
    <text x="85" y="144" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">🎬 视频: T×3×H×W</text>
    <text x="85" y="167" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">📊 结构化: 10000+ 维</text>
  </g>

  <line x1="210" y1="190" x2="260" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#arrowHead)"/>
  <text x="235" y="175" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569" text-anchor="middle">编码</text>

  <!-- 编码器 -->
  <g transform="translate(270, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="180" rx="16" fill="url(#encoderGrad)"/>
    <text x="85" y="35" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">编码器 Encoder</text>
    <line x1="20" y1="50" x2="150" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="85" y="75" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">Transformer</text>
    <text x="85" y="98" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">CNN / ViT</text>
    <text x="85" y="121" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">ResNet</text>
    <text x="85" y="144" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">CLIP / BERT</text>
    <text x="85" y="167" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">Whisper</text>
  </g>

  <line x1="440" y1="190" x2="490" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#arrowHead)"/>

  <!-- 向量表示 -->
  <g transform="translate(500, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="180" rx="16" fill="url(#vectorGrad)"/>
    <text x="100" y="35" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">稠密向量 z</text>
    <line x1="20" y1="50" x2="180" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="100" y="80" font-family="monospace" font-size="13" fill="#ffffff" text-anchor="middle">z ∈ ℝᵈ</text>
    <text x="100" y="108" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">[0.23, -0.87, 0.45, ...]</text>
    <text x="100" y="133" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">维度 d: 128 ~ 4096</text>
    <text x="100" y="158" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle">语义浓缩 · 可计算 · 可检索</text>
  </g>

  <line x1="700" y1="190" x2="750" y2="190" stroke="#475569" stroke-width="3" marker-end="url(#arrowHead)"/>

  <!-- 向量存储 -->
  <g transform="translate(760, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="180" rx="16" fill="url(#storageGrad)"/>
    <text x="85" y="35" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">向量数据库</text>
    <line x1="20" y1="50" x2="150" y2="50" stroke="rgba(30,41,59,0.2)" stroke-width="1"/>
    <text x="85" y="75" font-family="monospace" font-size="11" fill="#1e293b" text-anchor="middle">Milvus / Pinecone</text>
    <text x="85" y="98" font-family="monospace" font-size="11" fill="#1e293b" text-anchor="middle">Weaviate / Qdrant</text>
    <text x="85" y="121" font-family="monospace" font-size="11" fill="#1e293b" text-anchor="middle">HNSW / IVF / PQ</text>
    <text x="85" y="144" font-family="monospace" font-size="11" fill="#1e293b" text-anchor="middle">余弦 / L2 / 内积</text>
    <text x="85" y="167" font-family="monospace" font-size="11" fill="#1e293b" text-anchor="middle">ANN 近似最近邻</text>
  </g>

  <!-- 向下箭头（存储到检索/解码） -->
  <path d="M 845 280 L 845 340 L 235 340 L 235 400" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrowHead)" stroke-dasharray="8,4"/>
  <text x="540" y="328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569" text-anchor="middle">检索相似向量 / 取目标向量</text>

  <!-- 解码器 -->
  <g transform="translate(150, 410)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="140" rx="16" fill="url(#decoderGrad)"/>
    <text x="85" y="35" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">解码器 Decoder</text>
    <line x1="20" y1="50" x2="150" y2="50" stroke="rgba(30,41,59,0.2)" stroke-width="1"/>
    <text x="85" y="75" font-family="monospace" font-size="11" fill="#1e293b" text-anchor="middle">Autoencoder Decoder</text>
    <text x="85" y="98" font-family="monospace" font-size="11" fill="#1e293b" text-anchor="middle">VAE / GAN / Diffusion</text>
    <text x="85" y="121" font-family="monospace" font-size="11" fill="#1e293b" text-anchor="middle">GPT 自回归生成</text>
  </g>

  <line x1="320" y1="480" x2="370" y2="480" stroke="#475569" stroke-width="3" marker-end="url(#arrowHead)"/>

  <!-- 重建输出 -->
  <g transform="translate(380, 410)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="140" rx="16" fill="url(#outputGrad)"/>
    <text x="100" y="35" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">重建/生成数据 x̂</text>
    <line x1="20" y1="50" x2="180" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="100" y="78" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">重建文本 / 生成图像</text>
    <text x="100" y="101" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">语音合成 / 视频生成</text>
    <text x="100" y="124" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.95)" text-anchor="middle">x̂ ≈ x （有损 vs 无损）</text>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(650, 410)">
    <rect x="0" y="0" width="400" height="140" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="20" y="35" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">两条路径的本质区别</text>
    <line x1="20" y1="48" x2="380" y2="48" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">
      <tspan x="20" dy="0">• <tspan font-weight="bold" fill="#f5576c">编码</tspan>：确定映射 x → z，信息压缩，必有损失</tspan>
    </text>
    <text x="20" y="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">
      <tspan x="20" dy="0">• <tspan font-weight="bold" fill="#43e97b">检索</tspan>：在向量空间找近邻，不要求精确解码</tspan>
    </text>
    <text x="20" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">
      <tspan x="20" dy="0">• <tspan font-weight="bold" fill="#fa709a">解码</tspan>：z → x̂ 可能是一对多映射，生成新内容</tspan>
    </text>
  </g>

  <!-- 底部公式 -->
  <g transform="translate(200, 570)">
    <text x="350" y="0" font-family="Georgia, serif" font-size="14" fill="#64748b" text-anchor="middle" font-style="italic">
      编码 z = f_θ(x)， 存储 {z_i, metadata_i}， 解码 x̂ = g_φ(z)，目标 min ‖x - x̂‖² + 正则项
    </text>
  </g>
</svg>
