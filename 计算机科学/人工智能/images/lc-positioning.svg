<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <text x="490" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">LangChain 的定位：大模型应用的"编排胶水层"</text>

  <!-- 顶层：应用场景 -->
  <text x="490" y="82" text-anchor="middle" font-size="14" fill="#64748b">—— 你要构建的应用 ——</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="70" y="95" width="180" height="42" rx="21" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="160" y="122" fill="#4338ca">RAG 知识问答</text>
    <rect x="300" y="95" width="180" height="42" rx="21" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="390" y="122" fill="#4338ca">Agent 智能体</text>
    <rect x="530" y="95" width="180" height="42" rx="21" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="620" y="122" fill="#4338ca">数据分析 / 摘要翻译</text>
    <rect x="760" y="95" width="160" height="42" rx="21" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="840" y="122" fill="#4338ca">多轮对话机器人</text>
  </g>

  <line x1="490" y1="145" x2="490" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="490,182 483,170 497,170" fill="#94a3b8"/>

  <!-- 中间：LangChain 编排层 -->
  <rect x="60" y="185" width="860" height="230" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="490" y="220" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d4ed8">LangChain：把离散能力"积木式"组装成流水线</text>

  <g font-size="13.5" text-anchor="middle">
    <rect x="90" y="245" width="150" height="62" rx="10" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="165" y="272" font-weight="bold" fill="#1e40af">Prompt 模板</text>
    <text x="165" y="292" font-size="11.5" fill="#3b82f6">提示词工程复用</text>

    <rect x="265" y="245" width="150" height="62" rx="10" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="340" y="272" font-weight="bold" fill="#1e40af">Chat Model</text>
    <text x="340" y="292" font-size="11.5" fill="#3b82f6">统一各家大模型接口</text>

    <rect x="440" y="245" width="150" height="62" rx="10" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="515" y="272" font-weight="bold" fill="#1e40af">Retriever 检索</text>
    <text x="515" y="292" font-size="11.5" fill="#3b82f6">向量库 / 文档接入</text>

    <rect x="615" y="245" width="150" height="62" rx="10" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="690" y="272" font-weight="bold" fill="#1e40af">Tools 工具</text>
    <text x="690" y="292" font-size="11.5" fill="#3b82f6">搜索 / 计算 / API</text>

    <rect x="790" y="245" width="110" height="62" rx="10" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="845" y="272" font-weight="bold" fill="#1e40af">Memory</text>
    <text x="845" y="292" font-size="11.5" fill="#3b82f6">对话记忆</text>
  </g>

  <!-- LCEL 管道示意 -->
  <rect x="120" y="330" width="740" height="58" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <g font-size="14" font-family="Consolas,monospace" fill="#1e3a8a" text-anchor="middle">
    <text x="220" y="366">prompt</text>
    <text x="320" y="366" font-size="20" fill="#2563eb">|</text>
    <text x="420" y="366">model</text>
    <text x="520" y="366" font-size="20" fill="#2563eb">|</text>
    <text x="640" y="366">output_parser</text>
  </g>
  <text x="490" y="380" text-anchor="middle" font-size="11.5" fill="#1d4ed8" dy="0"> </text>
  <text x="490" y="405" text-anchor="middle" font-size="12.5" fill="#2563eb">LCEL 管道：组件用 | 串成链，自动获得流式、异步、批量、重试能力</text>

  <line x1="490" y1="425" x2="490" y2="455" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="490,462 483,450 497,450" fill="#94a3b8"/>

  <!-- 底层：模型与数据工具 -->
  <rect x="60" y="465" width="420" height="105" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="270" y="492" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">大模型（可互换）</text>
  <g font-size="12.5" text-anchor="middle" fill="#166534">
    <rect x="85" y="508" width="80" height="34" rx="8" fill="white" stroke="#86efac"/><text x="125" y="530">OpenAI</text>
    <rect x="178" y="508" width="80" height="34" rx="8" fill="white" stroke="#86efac"/><text x="218" y="530">Claude</text>
    <rect x="271" y="508" width="80" height="34" rx="8" fill="white" stroke="#86efac"/><text x="311" y="530">DeepSeek</text>
    <rect x="364" y="508" width="90" height="34" rx="8" fill="white" stroke="#86efac"/><text x="409" y="530">Ollama 本地</text>
  </g>

  <rect x="500" y="465" width="420" height="105" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="710" y="492" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">数据与外部能力</text>
  <g font-size="12.5" text-anchor="middle" fill="#92400e">
    <rect x="525" y="508" width="86" height="34" rx="8" fill="white" stroke="#fcd34d"/><text x="568" y="530">向量数据库</text>
    <rect x="624" y="508" width="80" height="34" rx="8" fill="white" stroke="#fcd34d"/><text x="664" y="530">PDF/文档</text>
    <rect x="717" y="508" width="80" height="34" rx="8" fill="white" stroke="#fcd34d"/><text x="757" y="530">搜索引擎</text>
    <rect x="810" y="508" width="86" height="34" rx="8" fill="white" stroke="#fcd34d"/><text x="853" y="530">数据库/API</text>
  </g>

  <text x="490" y="592" text-anchor="middle" font-size="12.5" fill="#64748b">换模型只改一行初始化，业务流水线不动 —— 这就是"编排层"的价值</text>
</svg>
