<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">指数运算关系图</title>
  <desc id="desc">展示指数运算从重复乘法出发，扩展到零指数、负指数、分数指数和常用运算法则。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 18px sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .core { fill: #dbeafe; stroke: #3b82f6; stroke-width: 3; }
      .rule { fill: #dcfce7; stroke: #22c55e; stroke-width: 2.5; }
      .extend { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2.5; }
      .func { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2.5; }
      .label { font: 700 23px sans-serif; fill: #0f172a; }
      .formula { font: 700 20px monospace; fill: #1e293b; }
      .text { font: 16px sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1100" height="680"/>
  <text class="title" x="550" y="54" text-anchor="middle">指数运算：把重复乘法写成更高效的符号</text>
  <text class="subtitle" x="550" y="86" text-anchor="middle">核心思想：底数不变时，指数记录“乘了多少次”，并可扩展到倒数、开方和连续增长。</text>

  <rect class="core" x="385" y="130" width="330" height="130" rx="24"/>
  <text class="label" x="550" y="175" text-anchor="middle">指数的基本形式</text>
  <text class="formula" x="550" y="212" text-anchor="middle">a^n = a × a × ... × a</text>
  <text class="text" x="550" y="242" text-anchor="middle">a 是底数，n 是指数</text>

  <rect class="rule" x="70" y="330" width="270" height="105" rx="20"/>
  <text class="label" x="205" y="365" text-anchor="middle">同底数相乘</text>
  <text class="formula" x="205" y="400" text-anchor="middle">a^m · a^n = a^(m+n)</text>

  <rect class="rule" x="415" y="330" width="270" height="105" rx="20"/>
  <text class="label" x="550" y="365" text-anchor="middle">幂的乘方</text>
  <text class="formula" x="550" y="400" text-anchor="middle">(a^m)^n = a^(mn)</text>

  <rect class="rule" x="760" y="330" width="270" height="105" rx="20"/>
  <text class="label" x="895" y="365" text-anchor="middle">积的乘方</text>
  <text class="formula" x="895" y="400" text-anchor="middle">(ab)^n = a^n b^n</text>

  <rect class="extend" x="70" y="505" width="270" height="105" rx="20"/>
  <text class="label" x="205" y="540" text-anchor="middle">零指数</text>
  <text class="formula" x="205" y="575" text-anchor="middle">a^0 = 1，a ≠ 0</text>

  <rect class="extend" x="415" y="505" width="270" height="105" rx="20"/>
  <text class="label" x="550" y="540" text-anchor="middle">负指数</text>
  <text class="formula" x="550" y="575" text-anchor="middle">a^(-n) = 1/a^n</text>

  <rect class="extend" x="760" y="505" width="270" height="105" rx="20"/>
  <text class="label" x="895" y="540" text-anchor="middle">分数指数</text>
  <text class="formula" x="895" y="575" text-anchor="middle">a^(m/n) = ⁿ√(a^m)</text>

  <path class="line" d="M460 260 C350 285 260 300 205 330"/>
  <path class="line" d="M550 260 L550 330"/>
  <path class="line" d="M640 260 C750 285 840 300 895 330"/>
  <path class="line" d="M205 435 L205 505"/>
  <path class="line" d="M550 435 L550 505"/>
  <path class="line" d="M895 435 L895 505"/>
</svg>
