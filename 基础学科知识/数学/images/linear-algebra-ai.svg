<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">线性代数：AI的数学基石</text>
  
  <g transform="translate(400, 110)">
    <rect x="-120" y="-35" width="240" height="70" rx="15" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">深度学习/大模型</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#bfdbfe">神经网络本质是张量运算</text>
  </g>
  
  <g transform="translate(150, 230)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#16a34a"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">词向量/Embedding</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bbf7d0">n维向量表示语义</text>
  </g>
  
  <g transform="translate(400, 230)">
    <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#ea580c"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Transformer/注意力</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fed7aa">QKV矩阵乘法</text>
  </g>
  
  <g transform="translate(650, 230)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#9333ea"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">全连接层</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e9d5ff">Y = XW + b</text>
  </g>
  
  <g transform="translate(100, 360)">
    <rect x="-70" y="-25" width="140" height="50" rx="8" fill="#0ea5e9"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">向量</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bae6fd">数据的基本表示</text>
  </g>
  
  <g transform="translate(270, 360)">
    <rect x="-70" y="-25" width="140" height="50" rx="8" fill="#0ea5e9"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">矩阵乘法</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bae6fd">特征变换</text>
  </g>
  
  <g transform="translate(440, 360)">
    <rect x="-70" y="-25" width="140" height="50" rx="8" fill="#0ea5e9"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">点积</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bae6fd">交互/匹配计算</text>
  </g>
  
  <g transform="translate(610, 360)">
    <rect x="-70" y="-25" width="140" height="50" rx="8" fill="#0ea5e9"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">余弦相似度</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bae6fd">相似性度量</text>
  </g>
  
  <g transform="translate(720, 360)">
    <rect x="-60" y="-25" width="120" height="50" rx="8" fill="#0ea5e9"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">维度</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bae6fd">特征空间</text>
  </g>
  
  <line x1="320" y1="140" x2="200" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="400" y1="145" x2="400" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="480" y1="140" x2="600" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  
  <line x1="120" y1="290" x2="80" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="150" y1="290" x2="250" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="370" y1="290" x2="290" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="290" x2="420" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="430" y1="290" x2="590" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="630" y1="290" x2="700" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <rect x="50" y="430" width="700" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="400" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">AI领域的所有前沿模型（CNN、RNN、Transformer、Diffusion）底层都是线性代数运算</text>
</svg>