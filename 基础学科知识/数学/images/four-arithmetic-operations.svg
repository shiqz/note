<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">四则运算关系图</title>
  <desc id="desc">展示加法、减法、乘法、除法之间的基础关系：减法是加法的逆运算，除法是乘法的逆运算，乘法可理解为重复加法。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 700 30px sans-serif; fill: #0f172a; }
      .node-title { font: 700 24px sans-serif; fill: #0f172a; }
      .formula { font: 600 20px sans-serif; fill: #1e293b; }
      .text { font: 16px sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .muted-line { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .plus { fill: #dbeafe; stroke: #60a5fa; }
      .minus { fill: #fee2e2; stroke: #f87171; }
      .times { fill: #dcfce7; stroke: #4ade80; }
      .divide { fill: #fef3c7; stroke: #fbbf24; }
      .center { fill: #eef2ff; stroke: #818cf8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="560"/>
  <text class="title" x="490" y="58" text-anchor="middle">四则运算：数量变化的四种基本方式</text>

  <rect class="card plus" x="80" y="105" width="300" height="140" rx="18"/>
  <text class="node-title" x="230" y="150" text-anchor="middle">加法</text>
  <text class="formula" x="230" y="188" text-anchor="middle">a + b = c</text>
  <text class="text" x="230" y="220" text-anchor="middle">合并数量，求总和</text>

  <rect class="card minus" x="600" y="105" width="300" height="140" rx="18"/>
  <text class="node-title" x="750" y="150" text-anchor="middle">减法</text>
  <text class="formula" x="750" y="188" text-anchor="middle">a - b = c</text>
  <text class="text" x="750" y="220" text-anchor="middle">移除或比较数量，求差</text>

  <rect class="card times" x="80" y="335" width="300" height="140" rx="18"/>
  <text class="node-title" x="230" y="380" text-anchor="middle">乘法</text>
  <text class="formula" x="230" y="418" text-anchor="middle">a × b = c</text>
  <text class="text" x="230" y="450" text-anchor="middle">等量重复相加，求积</text>

  <rect class="card divide" x="600" y="335" width="300" height="140" rx="18"/>
  <text class="node-title" x="750" y="380" text-anchor="middle">除法</text>
  <text class="formula" x="750" y="418" text-anchor="middle">a ÷ b = c，b ≠ 0</text>
  <text class="text" x="750" y="450" text-anchor="middle">平均分配或求每份量</text>

  <rect class="card center" x="395" y="230" width="190" height="100" rx="18"/>
  <text class="node-title" x="490" y="270" text-anchor="middle">算术体系</text>
  <text class="text" x="490" y="302" text-anchor="middle">数、量、关系、规律</text>

  <path class="line" d="M380 175 C455 150 525 150 600 175"/>
  <text class="text" x="490" y="142" text-anchor="middle">逆运算</text>

  <path class="line" d="M380 405 C455 380 525 380 600 405"/>
  <text class="text" x="490" y="372" text-anchor="middle">逆运算</text>

  <path class="muted-line" d="M230 245 L230 335"/>
  <text class="text" x="286" y="294" text-anchor="middle">重复加法</text>

  <path class="muted-line" d="M490 230 L365 205"/>
  <path class="muted-line" d="M490 230 L615 205"/>
  <path class="muted-line" d="M490 330 L365 380"/>
  <path class="muted-line" d="M490 330 L615 380"/>

  <text class="text" x="490" y="520" text-anchor="middle">核心规则：括号优先；同级从左到右；先乘除，后加减。</text>
</svg>
