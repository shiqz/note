<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f8fafc"/>
  
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">点积（Dot Product）：向量的"乘积求和"</text>
  
  <g transform="translate(150, 180)">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="100" x2="0" y2="-100" stroke="#94a3b8" stroke-width="1.5"/>
    
    <line x1="0" y1="0" x2="80" y2="-60" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-dot1)"/>
    <defs><marker id="arr-dot1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
    <text x="85" y="-65" font-family="Arial, sans-serif" font-size="14" fill="#2563eb" font-weight="bold">a = (4, -3)</text>
    
    <line x1="0" y1="0" x2="60" y2="60" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-dot2)"/>
    <defs><marker id="arr-dot2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker></defs>
    <text x="50" y="80" font-family="Arial, sans-serif" font-size="14" fill="#16a34a" font-weight="bold">b = (2, 4)</text>
    
    <path d="M 30 -22.5 A 30 30 0 0 1 22.5 30" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="40" y="15" font-family="Arial, sans-serif" font-size="16" fill="#d97706" font-weight="bold">θ</text>
  </g>
  
  <g transform="translate(480, 120)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    
    <text x="140" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">点积公式</text>
    
    <text x="140" y="65" text-anchor="middle" font-family="monospace" font-size="18" fill="#1e3a8a">a · b = a₁b₁ + a₂b₂ + ... + aₙbₙ</text>
    
    <text x="140" y="100" text-anchor="middle" font-family="monospace" font-size="14" fill="#3b82f6">= 4×2 + (-3)×4</text>
    <text x="140" y="125" text-anchor="middle" font-family="monospace" font-size="14" fill="#3b82f6">= 8 - 12</text>
    <text x="140" y="155" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#1d4ed8">= -4</text>
    
    <text x="140" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">对应位置相乘，再全部相加</text>
  </g>
  
  <rect x="50" y="340" width="700" height="90" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
  
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e">点积的几何意义：a · b = |a| × |b| × cosθ</text>
  
  <g transform="translate(80, 395)">
    <text font-family="Arial, sans-serif" font-size="13" fill="#78350f">• 结果 = 0 → 两向量垂直（方向完全无关）</text>
    <text y="22" font-family="Arial, sans-serif" font-size="13" fill="#78350f">• 结果 > 0 → 两向量方向大致相同</text>
  </g>
  
  <g transform="translate(430, 395)">
    <text font-family="Arial, sans-serif" font-size="13" fill="#78350f">• 结果 < 0 → 两向量方向大致相反</text>
    <text y="22" font-family="Arial, sans-serif" font-size="13" fill="#78350f">• 结果越大 → 方向越一致（AI中的"相似度"基础）</text>
  </g>
</svg>