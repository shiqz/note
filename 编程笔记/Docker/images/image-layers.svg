<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">镜像分层原理：UnionFS 联合文件系统 + Copy-on-Write</text>

  <!-- 容器层 -->
  <rect x="180" y="80" width="340" height="62" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">容器层（Container Layer）</text>
  <text x="350" y="129" text-anchor="middle" font-size="12" fill="#991b1b">可读可写：容器运行时的修改只发生在这里</text>

  <!-- 镜像层 3 -->
  <rect x="200" y="155" width="300" height="56" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="350" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">镜像层 ③（只读）</text>
  <text x="350" y="200" text-anchor="middle" font-size="12" fill="#1e40af">COPY . /app　→　拷贝应用代码</text>

  <!-- 镜像层 2 -->
  <rect x="220" y="224" width="260" height="56" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">镜像层 ②（只读）</text>
  <text x="350" y="269" text-anchor="middle" font-size="12" fill="#166534">RUN pip install　→　安装依赖</text>

  <!-- 镜像层 1 -->
  <rect x="240" y="293" width="220" height="56" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">镜像层 ①（只读）</text>
  <text x="350" y="338" text-anchor="middle" font-size="12" fill="#92400e">FROM python:3.12　→　基础镜像</text>

  <!-- bootfs / 内核 -->
  <rect x="260" y="362" width="180" height="44" rx="8" fill="#334155"/>
  <text x="350" y="390" text-anchor="middle" font-size="13" fill="#f1f5f9">宿主机内核（共享，不属于镜像）</text>

  <!-- 右侧：CoW 说明 -->
  <rect x="580" y="80" width="290" height="150" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="725" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">Copy-on-Write（写时复制）</text>
  <text x="600" y="140" font-size="12.5" fill="#7c2d12">① 读取文件：直接读底层只读层</text>
  <text x="600" y="166" font-size="12.5" fill="#7c2d12">② 修改文件：先把文件复制到容器层，</text>
  <text x="616" y="186" font-size="12.5" fill="#7c2d12">再在副本上修改，底层镜像不变</text>
  <text x="600" y="212" font-size="12.5" fill="#7c2d12">③ 删除容器：容器层随之消失，</text>
  <text x="616" y="230" font-size="12.5" fill="#7c2d12">镜像层不受任何影响</text>

  <!-- 右下：复用说明 -->
  <rect x="580" y="252" width="290" height="154" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="725" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">分层带来的好处</text>
  <text x="600" y="312" font-size="12.5" fill="#14532d">• 层可复用：多个镜像共享同一基础层，</text>
  <text x="616" y="332" font-size="12.5" fill="#14532d">磁盘只存一份</text>
  <text x="600" y="358" font-size="12.5" fill="#14532d">• 构建缓存：未变动的层直接复用缓存，</text>
  <text x="616" y="378" font-size="12.5" fill="#14532d">重新构建秒级完成</text>
  <text x="600" y="404" font-size="12.5" fill="#14532d">注意：某层一旦变动，它之上的所有层</text>
  <text x="616" y="424" font-size="12.5" fill="#14532d">缓存都会失效（易变层要放在后面）</text>

  <text x="350" y="460" text-anchor="middle" font-size="13" fill="#475569">多个容器基于同一镜像启动时，共享所有只读镜像层，各自只新增一个容器层</text>
  <text x="350" y="488" text-anchor="middle" font-size="13" fill="#475569">→ 这就是容器启动快、占用小的根本原因</text>
</svg>
