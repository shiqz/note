<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <marker id="ar4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Dockerfile 指令 → 镜像层（每条指令构建一层）</text>

  <!-- 左：Dockerfile -->
  <rect x="60" y="70" width="360" height="470" rx="10" fill="#1e293b"/>
  <text x="240" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">Dockerfile</text>
  <g font-size="13.5" font-family="Consolas,'Courier New',monospace">
    <text x="82" y="134" fill="#94a3b8">1&nbsp;&nbsp;</text><text x="116" y="134" fill="#7dd3fc">FROM</text><text x="170" y="134" fill="#f1f5f9"> python:3.12-slim</text>
    <text x="82" y="174" fill="#94a3b8">2&nbsp;&nbsp;</text><text x="116" y="174" fill="#7dd3fc">WORKDIR</text><text x="200" y="174" fill="#f1f5f9"> /app</text>
    <text x="82" y="214" fill="#94a3b8">3&nbsp;&nbsp;</text><text x="116" y="214" fill="#7dd3fc">ENV</text><text x="160" y="214" fill="#f1f5f9"> PYTHONUNBUFFERED=1</text>
    <text x="82" y="254" fill="#94a3b8">4&nbsp;&nbsp;</text><text x="116" y="254" fill="#7dd3fc">COPY</text><text x="170" y="254" fill="#f1f5f9"> requirements.txt .</text>
    <text x="82" y="294" fill="#94a3b8">5&nbsp;&nbsp;</text><text x="116" y="294" fill="#7dd3fc">RUN</text><text x="160" y="294" fill="#f1f5f9"> pip install -r requirements.txt</text>
    <text x="82" y="334" fill="#94a3b8">6&nbsp;&nbsp;</text><text x="116" y="334" fill="#7dd3fc">COPY</text><text x="170" y="334" fill="#f1f5f9"> . .</text>
    <text x="82" y="374" fill="#94a3b8">7&nbsp;&nbsp;</text><text x="116" y="374" fill="#7dd3fc">EXPOSE</text><text x="190" y="374" fill="#f1f5f9"> 5000</text>
    <text x="82" y="414" fill="#94a3b8">8&nbsp;&nbsp;</text><text x="116" y="414" fill="#7dd3fc">CMD</text><text x="160" y="414" fill="#f1f5f9"> ["python", "app.py"]</text>
  </g>
  <text x="240" y="470" text-anchor="middle" font-size="12.5" fill="#94a3b8">docker build -t myapp:v1 .</text>
  <text x="240" y="500" text-anchor="middle" font-size="12" fill="#64748b">（最后的 “.” 是构建上下文）</text>

  <!-- 右：镜像层堆叠 -->
  <text x="660" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">构建出的镜像</text>

  <rect x="540" y="120" width="240" height="44" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="660" y="147" text-anchor="middle" font-size="12.5" fill="#334155">CMD / EXPOSE / ENV 配置（元数据，不产生文件层）</text>

  <rect x="540" y="176" width="240" height="50" rx="7" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="660" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Layer：COPY . .</text>
  <text x="660" y="217" text-anchor="middle" font-size="11.5" fill="#1e40af">应用源码</text>

  <rect x="540" y="238" width="240" height="50" rx="7" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="660" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Layer：RUN pip install</text>
  <text x="660" y="279" text-anchor="middle" font-size="11.5" fill="#166534">第三方依赖包</text>

  <rect x="540" y="300" width="240" height="50" rx="7" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="660" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">Layer：COPY requirements.txt</text>
  <text x="660" y="341" text-anchor="middle" font-size="11.5" fill="#92400e">依赖清单</text>

  <rect x="540" y="362" width="240" height="56" rx="7" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="660" y="385" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">基础镜像层（python:3.12-slim）</text>
  <text x="660" y="405" text-anchor="middle" font-size="11.5" fill="#991b1b">解释器 + 系统库，本身也是多层堆叠</text>

  <!-- 箭头 -->
  <line x1="430" y1="130" x2="530" y2="390" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="430" y1="250" x2="535" y2="325" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="430" y1="290" x2="535" y2="263" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="430" y1="330" x2="535" y2="201" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 底部要点 -->
  <rect x="60" y="556" width="720" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="578" text-anchor="middle" font-size="12.5" fill="#334155">技巧：先 COPY requirements.txt 再安装依赖、最后 COPY 源码，可充分利用构建缓存，代码变动不会让依赖重装</text>
</svg>
