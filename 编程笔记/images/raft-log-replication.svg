<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Raft log replication</title>
  <desc id="desc">Client command is appended on leader and replicated to followers.</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f7f5"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">日志复制：写请求如何被多数节点确认</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#666">Leader 先写本地日志，再通过 AppendEntries 复制到 Follower；多数节点写入后才提交。</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="70" y="170" width="170" height="82" rx="18" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="155" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">Client</text>
  <text x="155" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#666">set x=1</text>

  <rect x="385" y="130" width="270" height="160" rx="24" fill="#fff" stroke="#b9d4ff" stroke-width="3"/>
  <circle cx="430" cy="178" r="28" fill="#2f80ed"/>
  <text x="430" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">L</text>
  <text x="520" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Leader</text>

  <rect x="710" y="120" width="390" height="110" rx="20" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <circle cx="752" cy="165" r="26" fill="#78a55a"/>
  <text x="752" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">F</text>
  <text x="825" y="171" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">Follower A</text>

  <rect x="710" y="265" width="390" height="110" rx="20" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <circle cx="752" cy="310" r="26" fill="#78a55a"/>
  <text x="752" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">F</text>
  <text x="825" y="316" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">Follower B</text>

  <rect x="710" y="410" width="390" height="110" rx="20" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <circle cx="752" cy="455" r="26" fill="#78a55a"/>
  <text x="752" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">F</text>
  <text x="825" y="461" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">Follower C</text>

  <line x1="240" y1="211" x2="385" y2="211" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="312" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#555">写请求</text>
  <line x1="655" y1="190" x2="710" y2="170" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="655" y1="230" x2="710" y2="315" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="655" y1="255" x2="710" y2="455" stroke="#999" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="680" y="145" font-family="Arial, sans-serif" font-size="16" fill="#555">AppendEntries</text>

  <rect x="410" y="220" width="220" height="42" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
  <text x="520" y="247" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#222">[index=8, term=3]</text>

  <rect x="810" y="185" width="250" height="32" rx="8" fill="#e8f1ff" stroke="#b9d4ff"/>
  <text x="935" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#222">写入成功，返回 ACK</text>
  <rect x="810" y="330" width="250" height="32" rx="8" fill="#e8f1ff" stroke="#b9d4ff"/>
  <text x="935" y="352" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#222">写入成功，返回 ACK</text>
  <rect x="810" y="475" width="250" height="32" rx="8" fill="#f1f1ee" stroke="#d7d7d0"/>
  <text x="935" y="497" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#777">网络慢，稍后追赶</text>

  <rect x="160" y="585" width="880" height="56" rx="16" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="600" y="621" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Leader + Follower A + Follower B = 3 / 5，多数节点成功，日志可提交。</text>
</svg>
