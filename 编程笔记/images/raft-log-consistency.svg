<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Raft log consistency</title>
  <desc id="desc">Raft fixes inconsistent follower logs by matching previous log index and term.</desc>
  <rect width="1200" height="700" rx="28" fill="#f7f7f5"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">日志一致性：Leader 如何修复 Follower 的冲突日志</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#666">AppendEntries 会携带 prevLogIndex 和 prevLogTerm；不匹配时 Follower 拒绝，Leader 回退 nextIndex 重试。</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="92" y="185" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Leader 日志</text>
  <text x="92" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Follower 日志</text>

  <g font-family="Consolas, monospace" font-size="18" text-anchor="middle">
    <rect x="260" y="150" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="303" y="185" fill="#222">1/t1</text>
    <rect x="355" y="150" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="398" y="185" fill="#222">2/t1</text>
    <rect x="450" y="150" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="493" y="185" fill="#222">3/t2</text>
    <rect x="545" y="150" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="588" y="185" fill="#222">4/t2</text>
    <rect x="640" y="150" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="683" y="185" fill="#222">5/t3</text>
    <rect x="735" y="150" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="778" y="185" fill="#222">6/t3</text>

    <rect x="260" y="295" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="303" y="330" fill="#222">1/t1</text>
    <rect x="355" y="295" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="398" y="330" fill="#222">2/t1</text>
    <rect x="450" y="295" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="493" y="330" fill="#222">3/t2</text>
    <rect x="545" y="295" width="86" height="58" rx="10" fill="#fff0df" stroke="#e1b270"/>
    <text x="588" y="330" fill="#222">4/t4</text>
    <rect x="640" y="295" width="86" height="58" rx="10" fill="#fff0df" stroke="#e1b270"/>
    <text x="683" y="330" fill="#222">5/t4</text>
  </g>

  <line x1="588" y1="235" x2="588" y2="275" stroke="#d9963b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="760" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555">prevLogIndex=5, prevLogTerm=3 不匹配</text>

  <rect x="160" y="430" width="880" height="56" rx="16" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Leader 回退 nextIndex，找到共同前缀 index=3，然后覆盖 Follower 的冲突日志。</text>

  <g font-family="Consolas, monospace" font-size="18" text-anchor="middle">
    <rect x="355" y="545" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="398" y="580" fill="#222">3/t2</text>
    <rect x="450" y="545" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="493" y="580" fill="#222">4/t2</text>
    <rect x="545" y="545" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="588" y="580" fill="#222">5/t3</text>
    <rect x="640" y="545" width="86" height="58" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
    <text x="683" y="580" fill="#222">6/t3</text>
  </g>
  <text x="245" y="581" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">修复后</text>
</svg>
