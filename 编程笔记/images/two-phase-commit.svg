<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Two phase commit</title>
  <desc id="desc">Two phase commit prepare and commit flow.</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f7f5"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">2PC：协调者驱动的分布式事务提交</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#666">两阶段提交用于让多个参与者要么都提交，要么都回滚，但协调者故障可能导致阻塞。</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="470" y="150" width="260" height="90" rx="20" fill="#fff" stroke="#b9d4ff" stroke-width="3"/>
  <text x="600" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#222">Coordinator</text>
  <rect x="130" y="480" width="230" height="90" rx="20" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="245" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Participant A</text>
  <rect x="485" y="480" width="230" height="90" rx="20" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="600" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Participant B</text>
  <rect x="840" y="480" width="230" height="90" rx="20" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="955" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Participant C</text>
  <line x1="540" y1="240" x2="280" y2="480" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="240" x2="600" y2="480" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="660" y1="240" x2="920" y2="480" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="360" y="355" font-family="Arial, sans-serif" font-size="18" fill="#555">Phase 1: prepare?</text>
  <text x="630" y="355" font-family="Arial, sans-serif" font-size="18" fill="#555">vote yes/no</text>
  <text x="790" y="355" font-family="Arial, sans-serif" font-size="18" fill="#555">Phase 2: commit/rollback</text>
  <rect x="155" y="610" width="890" height="52" rx="16" fill="#fff0df" stroke="#e1b270" stroke-width="2"/>
  <text x="600" y="643" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">缺点：参与者 prepared 后会锁定资源；如果协调者宕机，参与者可能不知道该提交还是回滚。</text>
</svg>
