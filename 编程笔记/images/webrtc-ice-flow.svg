<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.t{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 17px Arial,sans-serif;fill:#172554}.p{font:15px Arial,sans-serif;fill:#334155}.n{font:700 18px Arial,sans-serif;fill:white}.l{stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="520" fill="#f8fafc"/><text x="600" y="45" class="t" text-anchor="middle">ICE：从多条候选路径中选出可用连接</text>
  <line x1="130" y1="265" x2="1070" y2="265" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="150" cy="265" r="35" fill="#2563eb"/><text x="150" y="272" class="n" text-anchor="middle">1</text><text x="150" y="330" class="h" text-anchor="middle">收集候选</text><text x="150" y="355" class="p" text-anchor="middle">host / srflx / relay</text>
  <circle cx="375" cy="265" r="35" fill="#7c3aed"/><text x="375" y="272" class="n" text-anchor="middle">2</text><text x="375" y="330" class="h" text-anchor="middle">交换候选</text><text x="375" y="355" class="p" text-anchor="middle">经由信令服务</text>
  <circle cx="600" cy="265" r="35" fill="#d97706"/><text x="600" y="272" class="n" text-anchor="middle">3</text><text x="600" y="330" class="h" text-anchor="middle">连通性检查</text><text x="600" y="355" class="p" text-anchor="middle">STUN Binding 请求</text>
  <circle cx="825" cy="265" r="35" fill="#16a34a"/><text x="825" y="272" class="n" text-anchor="middle">4</text><text x="825" y="330" class="h" text-anchor="middle">选择候选对</text><text x="825" y="355" class="p" text-anchor="middle">按优先级与可达性</text>
  <circle cx="1050" cy="265" r="35" fill="#0891b2"/><text x="1050" y="272" class="n" text-anchor="middle">5</text><text x="1050" y="330" class="h" text-anchor="middle">传输媒体</text><text x="1050" y="355" class="p" text-anchor="middle">DTLS 握手后 SRTP</text>
  <path d="M185 265 H335 M410 265 H560 M635 265 H785 M860 265 H1010" class="l"/>
  <rect x="80" y="92" width="300" height="85" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="230" y="125" class="h" text-anchor="middle">Host Candidate</text><text x="230" y="152" class="p" text-anchor="middle">本机网卡 IP + 端口</text>
  <rect x="450" y="92" width="300" height="85" rx="8" fill="#fef3c7" stroke="#fcd34d"/><text x="600" y="125" class="h" text-anchor="middle">Server Reflexive Candidate</text><text x="600" y="152" class="p" text-anchor="middle">STUN 发现的 NAT 映射地址</text>
  <rect x="820" y="92" width="300" height="85" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/><text x="970" y="125" class="h" text-anchor="middle">Relay Candidate</text><text x="970" y="152" class="p" text-anchor="middle">TURN 分配的中继地址</text>
  <text x="600" y="455" class="p" text-anchor="middle">优先直连以降低延迟和成本；对称 NAT、防火墙或企业网络下，TURN 中继保证连接成功率。</text>
</svg>
