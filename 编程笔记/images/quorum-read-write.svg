<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Quorum read write</title>
  <desc id="desc">Quorum read and write intersect when R plus W is greater than N.</desc>
  <rect width="1200" height="720" rx="28" fill="#f7f7f5"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">Quorum：用读写交集提高一致性</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#666">当 R + W &gt; N 时，任意一次读 quorum 和写 quorum 至少有一个副本重叠。</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#555"/>
    </marker>
  </defs>
  <text x="150" y="178" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">N = 5, W = 3</text>
  <text x="150" y="218" font-family="Arial, sans-serif" font-size="18" fill="#666">写入至少成功 3 个副本才返回</text>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <circle cx="190" cy="330" r="48" fill="#e8f1ff" stroke="#2f80ed" stroke-width="3"/><text x="190" y="337" fill="#222">A</text>
    <circle cx="320" cy="330" r="48" fill="#e8f1ff" stroke="#2f80ed" stroke-width="3"/><text x="320" y="337" fill="#222">B</text>
    <circle cx="450" cy="330" r="48" fill="#e8f1ff" stroke="#2f80ed" stroke-width="3"/><text x="450" y="337" fill="#222">C</text>
    <circle cx="580" cy="330" r="48" fill="#fff" stroke="#d7d7d0" stroke-width="3"/><text x="580" y="337" fill="#222">D</text>
    <circle cx="710" cy="330" r="48" fill="#fff" stroke="#d7d7d0" stroke-width="3"/><text x="710" y="337" fill="#222">E</text>
  </g>
  <text x="150" y="505" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">R = 3</text>
  <text x="150" y="545" font-family="Arial, sans-serif" font-size="18" fill="#666">读取任意 3 个副本，至少会遇到一个写成功副本</text>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <circle cx="450" cy="620" r="48" fill="#e8f8ea" stroke="#78a55a" stroke-width="3"/><text x="450" y="627" fill="#222">C</text>
    <circle cx="580" cy="620" r="48" fill="#e8f8ea" stroke="#78a55a" stroke-width="3"/><text x="580" y="627" fill="#222">D</text>
    <circle cx="710" cy="620" r="48" fill="#e8f8ea" stroke="#78a55a" stroke-width="3"/><text x="710" y="627" fill="#222">E</text>
  </g>
  <line x1="450" y1="378" x2="450" y2="572" stroke="#d9963b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="825" y="250" width="280" height="190" rx="22" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="965" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">关键公式</text>
  <text x="965" y="352" text-anchor="middle" font-family="Consolas, monospace" font-size="26" fill="#222">R + W &gt; N</text>
  <text x="965" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#666">读写集合必有交集</text>
  <text x="965" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#666">交集副本携带较新版本</text>
</svg>
