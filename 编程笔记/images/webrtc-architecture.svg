<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#0f172a}.label{font:700 18px Arial,sans-serif;fill:#172554}.text{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#475569}.box{stroke-width:2}.line{stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="570" fill="#f8fafc"/>
  <text x="600" y="45" class="title" text-anchor="middle">WebRTC：信令在服务端，媒体优先直连</text>
  <rect x="50" y="170" width="250" height="240" rx="10" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="175" y="210" class="label" text-anchor="middle">浏览器 A</text>
  <rect x="80" y="238" width="190" height="45" rx="6" fill="#fff" stroke="#93c5fd"/>
  <text x="175" y="266" class="text" text-anchor="middle">RTCPeerConnection</text>
  <rect x="80" y="306" width="190" height="70" rx="6" fill="#fff" stroke="#93c5fd"/>
  <text x="175" y="333" class="text" text-anchor="middle">摄像头 / 麦克风</text>
  <text x="175" y="356" class="small" text-anchor="middle">MediaStream + DataChannel</text>
  <rect x="900" y="170" width="250" height="240" rx="10" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="1025" y="210" class="label" text-anchor="middle">浏览器 B</text>
  <rect x="930" y="238" width="190" height="45" rx="6" fill="#fff" stroke="#86efac"/>
  <text x="1025" y="266" class="text" text-anchor="middle">RTCPeerConnection</text>
  <rect x="930" y="306" width="190" height="70" rx="6" fill="#fff" stroke="#86efac"/>
  <text x="1025" y="333" class="text" text-anchor="middle">摄像头 / 扬声器</text>
  <text x="1025" y="356" class="small" text-anchor="middle">MediaStream + DataChannel</text>
  <rect x="440" y="82" width="320" height="100" rx="10" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="600" y="120" class="label" text-anchor="middle">应用自建信令服务</text>
  <text x="600" y="148" class="text" text-anchor="middle">WebSocket / HTTP：SDP、ICE Candidate</text>
  <rect x="460" y="390" width="280" height="100" rx="10" fill="#f3e8ff" stroke="#9333ea" class="box"/>
  <text x="600" y="428" class="label" text-anchor="middle">STUN / TURN 服务</text>
  <text x="600" y="455" class="text" text-anchor="middle">发现公网地址 / 中继兜底</text>
  <line x1="300" y1="190" x2="440" y2="147" class="line"/><line x1="760" y1="147" x2="900" y2="190" class="line"/>
  <line x1="300" y1="330" x2="900" y2="330" class="line"/>
  <text x="600" y="314" class="small" text-anchor="middle">SRTP 媒体流 / SCTP 数据通道（优先 P2P）</text>
  <line x1="280" y1="380" x2="460" y2="430" class="line"/><line x1="920" y1="380" x2="740" y2="430" class="line"/>
  <text x="600" y="535" class="small" text-anchor="middle">注意：WebRTC 不定义信令协议；生产环境通常还需要鉴权、房间管理、录制或 SFU。</text>
</svg>
