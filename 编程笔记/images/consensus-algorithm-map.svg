<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Consensus algorithm map</title>
  <desc id="desc">Map of consistency and consensus algorithms.</desc>
  <rect width="1200" height="760" rx="28" fill="#f7f7f5"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">分布式一致性算法全景</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#666">不同算法解决的问题不同：副本读写、事务提交、共识选主、最终一致和无冲突合并。</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="175" width="300" height="180" rx="24" fill="#fff" stroke="#b9d4ff" stroke-width="3"/>
    <text x="230" y="220" text-anchor="middle" font-size="26" font-weight="700" fill="#222">共识算法</text>
    <text x="230" y="260" text-anchor="middle" font-size="19" fill="#555">Paxos / Raft / Zab</text>
    <text x="230" y="296" text-anchor="middle" font-size="17" fill="#666">选主、日志复制、强一致</text>
    <text x="230" y="326" text-anchor="middle" font-size="17" fill="#666">etcd / ZooKeeper / Consul</text>

    <rect x="450" y="175" width="300" height="180" rx="24" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
    <text x="600" y="220" text-anchor="middle" font-size="26" font-weight="700" fill="#222">事务提交</text>
    <text x="600" y="260" text-anchor="middle" font-size="19" fill="#555">2PC / 3PC / TCC / Saga</text>
    <text x="600" y="296" text-anchor="middle" font-size="17" fill="#666">跨资源原子性</text>
    <text x="600" y="326" text-anchor="middle" font-size="17" fill="#666">订单、支付、库存</text>

    <rect x="820" y="175" width="300" height="180" rx="24" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
    <text x="970" y="220" text-anchor="middle" font-size="26" font-weight="700" fill="#222">副本协议</text>
    <text x="970" y="260" text-anchor="middle" font-size="19" fill="#555">Quorum / Read Repair</text>
    <text x="970" y="296" text-anchor="middle" font-size="17" fill="#666">读写多数派、反熵修复</text>
    <text x="970" y="326" text-anchor="middle" font-size="17" fill="#666">Dynamo / Cassandra</text>

    <rect x="260" y="440" width="300" height="180" rx="24" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
    <text x="410" y="485" text-anchor="middle" font-size="26" font-weight="700" fill="#222">最终一致</text>
    <text x="410" y="525" text-anchor="middle" font-size="19" fill="#555">异步复制 / 消息补偿</text>
    <text x="410" y="561" text-anchor="middle" font-size="17" fill="#666">允许短暂不一致</text>
    <text x="410" y="591" text-anchor="middle" font-size="17" fill="#666">业务系统常用</text>

    <rect x="640" y="440" width="300" height="180" rx="24" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
    <text x="790" y="485" text-anchor="middle" font-size="26" font-weight="700" fill="#222">无冲突复制</text>
    <text x="790" y="525" text-anchor="middle" font-size="19" fill="#555">CRDT / Vector Clock</text>
    <text x="790" y="561" text-anchor="middle" font-size="17" fill="#666">多主写入、自动合并</text>
    <text x="790" y="591" text-anchor="middle" font-size="17" fill="#666">协同编辑、边缘系统</text>
  </g>
  <rect x="155" y="675" width="890" height="46" rx="14" fill="#f1f1ee" stroke="#d7d7d0"/>
  <text x="600" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">不要把所有“一致性”都理解成 Raft；先判断是共识、事务、副本读取，还是业务最终一致。</text>
</svg>
