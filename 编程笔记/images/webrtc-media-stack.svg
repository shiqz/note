<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.t{font:700 26px Arial,sans-serif;fill:#0f172a}.h{font:700 18px Arial,sans-serif;fill:#172554}.p{font:15px Arial,sans-serif;fill:#334155}.l{stroke:#475569;stroke-width:2.5;marker-end:url(#ar)}</style></defs>
  <rect width="1200" height="610" fill="#f8fafc"/><text x="600" y="45" class="t" text-anchor="middle">实时音视频的采集、编码、传输与播放</text>
  <g><rect x="55" y="180" width="180" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145" y="225" class="h" text-anchor="middle">采集</text><text x="145" y="255" class="p" text-anchor="middle">getUserMedia</text><text x="145" y="280" class="p" text-anchor="middle">摄像头 / 麦克风</text></g>
  <g><rect x="290" y="180" width="180" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="380" y="225" class="h" text-anchor="middle">处理与编码</text><text x="380" y="255" class="p" text-anchor="middle">回声消除 / 降噪</text><text x="380" y="280" class="p" text-anchor="middle">Opus、VP8/H.264/AV1</text></g>
  <g><rect x="525" y="180" width="180" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="615" y="225" class="h" text-anchor="middle">分包与安全</text><text x="615" y="255" class="p" text-anchor="middle">RTP / RTCP</text><text x="615" y="280" class="p" text-anchor="middle">DTLS-SRTP 加密</text></g>
  <g><rect x="760" y="180" width="180" height="140" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="850" y="225" class="h" text-anchor="middle">网络适配</text><text x="850" y="255" class="p" text-anchor="middle">拥塞控制 / 抖动缓冲</text><text x="850" y="280" class="p" text-anchor="middle">NACK / PLI / FEC</text></g>
  <g><rect x="995" y="180" width="150" height="140" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="1070" y="225" class="h" text-anchor="middle">播放</text><text x="1070" y="255" class="p" text-anchor="middle">解码</text><text x="1070" y="280" class="p" text-anchor="middle">渲染 / 输出</text></g>
  <path d="M235 250 H282 M470 250 H517 M705 250 H752 M940 250 H987" class="l"/>
  <rect x="145" y="420" width="390" height="100" rx="8" fill="#fff" stroke="#94a3b8"/><text x="340" y="457" class="h" text-anchor="middle">媒体轨道：MediaStreamTrack</text><text x="340" y="487" class="p" text-anchor="middle">音频与视频独立协商，可动态添加、替换、静音</text>
  <rect x="665" y="420" width="390" height="100" rx="8" fill="#fff" stroke="#94a3b8"/><text x="860" y="457" class="h" text-anchor="middle">数据通道：RTCDataChannel</text><text x="860" y="487" class="p" text-anchor="middle">SCTP over DTLS over UDP，适合协作状态、控制消息</text>
  <text x="600" y="570" class="p" text-anchor="middle">实时系统的目标不是零丢包，而是在延迟、画质、流畅度与网络成本之间持续折中。</text>
</svg>
