<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Distributed consistency problem</title>
  <desc id="desc">Different replicas may see different values during network delay.</desc>
  <rect width="1200" height="700" rx="28" fill="#f7f7f5"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222">分布式一致性问题：多副本如何看到同一个结果</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#666">多个节点保存同一份数据时，网络延迟、宕机和并发写入会让副本短时间内不一致。</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="70" y="170" width="200" height="96" rx="18" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="170" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Client</text>
  <text x="170" y="242" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#555">set x=1</text>
  <rect x="465" y="135" width="250" height="150" rx="24" fill="#fff" stroke="#b9d4ff" stroke-width="3"/>
  <text x="590" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#222">Replica A</text>
  <rect x="510" y="210" width="160" height="42" rx="10" fill="#e8f1ff" stroke="#b9d4ff"/>
  <text x="590" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#222">x = 1</text>
  <rect x="830" y="135" width="250" height="150" rx="24" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="955" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#222">Replica B</text>
  <rect x="875" y="210" width="160" height="42" rx="10" fill="#fff0df" stroke="#e1b270"/>
  <text x="955" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#222">x = 0</text>
  <rect x="465" y="395" width="250" height="150" rx="24" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="590" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#222">Replica C</text>
  <rect x="510" y="470" width="160" height="42" rx="10" fill="#fff0df" stroke="#e1b270"/>
  <text x="590" y="497" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#222">x = ?</text>
  <line x1="270" y1="218" x2="465" y2="210" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="715" y1="210" x2="830" y2="210" stroke="#999" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <line x1="640" y1="285" x2="620" y2="395" stroke="#999" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="775" y="194" font-family="Arial, sans-serif" font-size="17" fill="#666">复制延迟</text>
  <text x="655" y="350" font-family="Arial, sans-serif" font-size="17" fill="#666">节点故障或消息丢失</text>
  <rect x="145" y="590" width="910" height="54" rx="16" fill="#fff" stroke="#d7d7d0" stroke-width="2"/>
  <text x="600" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">一致性算法要定义：什么时候算写成功、读应该读到什么、故障后如何收敛。</text>
</svg>
